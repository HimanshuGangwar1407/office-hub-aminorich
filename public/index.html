@media (max-width:520px){.kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script>
/* ═════════════ Access control, salary sheet, direct messages ═════════════
   Salaries live in pay/{empId} and payroll runs in payroll/{YYYY-MM}. Those two collections are
   protected by the app's database rules: only people who are Editors of this app (and the owner)
   can read or write them — everyone else gets nothing back, whatever the screen shows. */

/* ── who can see which window / tab ── */
const ROLES = [['ADMIN', 'Administrator'], ['DIRECTOR', 'Director'], ['HR', 'HR'], ['MANAGER', 'Manager'], ['EMPLOYEE', 'Employee']];
const ACCESS_KEYS = [['chats', 'Chats'], ['attendance', 'Attendance'], ['salary', 'Attendance › Salary sheet'], ['leave', 'Leave'], ['tasks', 'Tasks'], ['worklog', 'Work log'], ['approvals', 'Approvals'], ['claims', 'Expense claims'],
  ['departments', 'Departments'], ['people', 'People'], ['reports', 'Reports'], ['settings', 'Settings']];
const ACCESS_DEFAULT_TXT = { people: 'Managers, HR, directors', reports: 'Managers, HR, directors', settings: 'HR and administrators', salary: 'HR and administrators' };
function accessRule(k) { const a = cfg().access?.[k]; return a && (a.roles?.length || a.depts?.length || a.people?.length) ? a : null; }
function canView(k, def = () => true) {
  if (!S.me) return false;
  if (S.me.role === 'ADMIN' || k === 'dashboard') return true; // administrators see every window
  const a = accessRule(k);
  if (a) return !!(a.roles?.includes(S.me.role) || a.depts?.includes(S.me.deptId) || a.people?.includes(S.me.id));
  return def();
}
const canSalary = () => canView('salary', () => isHR());
function accessSummary(k) {
  const a = accessRule(k);
  if (!a) return `<span class="muted">${esc(ACCESS_DEFAULT_TXT[k] || 'Everyone')}</span> <span class="tiny muted">(default)</span>`;
  const parts = [...(a.roles || []).map((r) => ROLES.find((x) => x[0] === r)?.[1] || r), ...(a.depts || []).map((d) => deptOf(d)?.name || 'Department'), ...(a.people || []).map(nameOf)];
  return `${esc(parts.join(', '))} <span class="tiny muted">+ administrators</span>`;
}
function accessForm(k) {
  if (!M) return '';
  if (!M.acc) { const a = accessRule(k) || {}; M.acc = { roles: [...(a.roles || [])], depts: [...(a.depts || [])], people: [...(a.people || [])] }; }
  const A = M.acc, label = ACCESS_KEYS.find((x) => x[0] === k)?.[1] || k;
  return `${mhead(`Who can see “${esc(label)}”`, 'Administrators always see everything. Leave everything unticked to go back to the default.')}
  <form data-f="acc-save" data-k="${k}"><div class="body grid" style="gap:14px">
    <div><div class="sec-l">Roles</div><div class="row" style="gap:14px">${ROLES.filter((r) => r[0] !== 'ADMIN').map(([r, l]) => `<label class="check"><input type="checkbox" id="ac-r-${r}" name="roles" value="${r}" ${A.roles.includes(r) ? 'checked' : ''}> ${l}</label>`).join('')}</div></div>
    <div><div class="sec-l">Departments</div><div class="row" style="gap:14px">${cfg().depts.map((d) => `<label class="check"><input type="checkbox" id="ac-d-${d.id}" name="depts" value="${d.id}" ${A.depts.includes(d.id) ? 'checked' : ''}> ${esc(d.name)}</label>`).join('')}</div></div>
    <div><div class="sec-l">Particular people</div>
      <select class="i" id="ac-add" data-c="accAdd">${peopleGroups(null, { blank: '+ Add a person…', exclude: A.people })}</select>
      <div class="row" style="margin-top:8px;gap:6px">${A.people.map((id) => `<span class="chip"><input type="hidden" name="people" value="${id}">${esc(nameOf(id))}<button type="button" class="chip-x" data-a="acc-rm" data-id="${id}" aria-label="Remove ${esc(nameOf(id))}">✕</button></span>`).join('') || '<span class="small muted">Nobody added.</span>'}</div></div>
    ${k === 'salary' ? '<p class="tiny muted" style="margin:0">Salary figures are also protected in the database: besides being allowed here, a person must be an <b>Editor</b> of this app (Share → change their access) to load them.</p>' : '<p class="tiny muted" style="margin:0">This hides the window in the menu. Shared records such as tasks or requests are still visible where they belong to the person (e.g. their own approvals).</p>'}
  </div><footer><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn" name="reset" value="1">Reset to default</button><button type="submit" class="btn pri">Save</button></footer></form>`;
}
function accessCard() {
  return card('Who can see each window', `<div class="tbl-wrap"><table class="t"><thead><tr><th>Window / tab</th><th>Visible to</th><th></th></tr></thead><tbody>
    <tr><td>Dashboard</td><td class="muted">Everyone</td><td></td></tr>
    ${ACCESS_KEYS.map(([k, l]) => `<tr><td>${esc(l)}</td><td class="small">${accessSummary(k)}</td><td style="text-align:right"><button class="btn sm" data-a="acc-edit" data-k="${k}">Change</button></td></tr>`).join('')}
  </tbody></table></div><p class="tiny muted" style="padding:10px 16px;margin:0">Administrators (${esc(active().filter((e) => e.role === 'ADMIN').map((e) => e.name).join(', ') || '—')}) always see every window. Change someone’s role on the People page.</p>`, { list: true });
}

/* ── direct messages ── */
async function startDM(other) {
  if (!other || other === S.me.id) return;
  const ids = [S.me.id, other].sort(), id = `dm-${ids[0]}-${ids[1]}`;
  if (!CHAT.list.some((c) => c.id === id)) await put(`chat/${id}`, { kind: 'dm', members: ids, created: Date.now(), createdBy: S.me.id });
  Object.assign(S.ui, { chat: id, chTab: 'msgs' });
  if (S.view !== 'chats') setView('chats'); else schedule();
  setTimeout(() => document.getElementById('ch-text')?.focus(), 120);
}

/* ── salary data (protected collections, loaded only for people allowed to see salaries) ── */
const PAY = { sub: false, map: {}, runs: {}, fines: [], err: '', loaded: false };
function ensurePay() {
  if (PAY.sub || !canSalary() || !S.db) return;
  PAY.sub = true;
  if (S.canEdit === false) { PAY.err = 'not_editor'; PAY.loaded = true; return; }
  S.db.collection('pay').onSnapshot((q) => { const m = {}; q.docs.forEach((d) => { m[d.id] = d.data(); }); PAY.map = m; PAY.loaded = true; PAY.err = ''; schedule(); },
    (e) => { PAY.err = e?.code || 'denied'; PAY.loaded = true; schedule(); });
  S.db.collection('fines').onSnapshot((q) => { PAY.fines = q.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.at - a.at); schedule(); }, () => {});
  S.db.collection('payroll').onSnapshot((q) => { const m = {}; q.docs.forEach((d) => { m[d.id] = { id: d.id, ...d.data() }; }); PAY.runs = m; schedule(); }, () => {});
}
const PAYCFG = () => { const c = { fullH: 8, missH: 4, wfhCut: 25, ...(cfg().pay || {}) }; if (c.missH == null) c.missH = c.halfH ?? 4; return c; };
const PCODE = { P: ['Full hours', 't-ok'], S: ['Short hours', 't-warn'], A: ['Absent', 't-bad'], I: ['Missing check-out', 't-warn'],
  LV: ['Paid leave', 't-vio'], HL: ['Half-day leave', 't-vio'], LWP: ['Leave without pay', 't-bad'], WFH: ['Work from home', 't-info'], OD: ['Official duty', 't-info'], WO: ['Sunday (paid off)', ''], H: ['Holiday (paid)', ''], NJ: ['Not on payroll', ''], F: ['Not yet', ''] };
const workMin = (empId, d) => { const ps = punchesOn(empId, d); return ps.length > 1 ? Math.round((ps[ps.length - 1].t - ps[0].t) / 60000) : 0; };
const hhmm = (m) => { m = Math.round(m || 0); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
/* one day: required minutes (what the company expects) and credited minutes (what counts as worked) */
function payDay(emp, d, P = PAYCFG()) {
  const T = today(), full = Math.round(P.fullH * 60);
  const r = { d, k: '', w: 0, req: 0, cred: 0, wfh: false, note: '' };
  if (d >= T) { r.k = 'F'; return r; }
  if ((emp.joining && d < emp.joining) || (emp.exitDate && d > emp.exitDate)) { r.k = 'NJ'; return r; }
  if (weeklyOff(d)) { r.k = 'WO'; return r; }
  const hol = holidayOn(d); if (hol) { r.k = 'H'; r.note = hol.name; return r; }
  const ps = punchesOn(emp.id, d); r.w = workMin(emp.id, d); r.req = full;
  const worked = () => (ps.length === 1 ? Math.round(P.missH * 60) : r.w);
  const lv = leaveOn(emp.id, d);
  if (lv) {
    const lt = cfg().leaveTypes.find((x) => x.code === lv.data.lt), unpaid = lt?.unpaid || lv.data.lt === 'LWP';
    if (!lv.data.half) { r.k = unpaid ? 'LWP' : 'LV'; r.cred = unpaid ? 0 : full; r.note = lv.data.lt; return r; }
    r.k = 'HL'; r.cred = (unpaid ? 0 : full / 2) + worked(); r.note = `${lv.data.lt} half day${unpaid ? ' (unpaid)' : ' (paid ' + hhmm(full / 2) + ')'}`; return r;
  }
  const rem = remoteOn(emp.id, d);
  if (rem && rem.data.kind === 'OD') { r.k = 'OD'; r.cred = full; r.note = rem.data.location || ''; return r; }
  if (rem) { r.k = 'WFH'; r.wfh = true; r.cred = ps.length ? worked() : full; r.note = `${P.wfhCut}% of the day’s pay deducted${ps.length ? '' : ' · no punches, full hours assumed'}`; return r; }
  if (ps.length === 1) { r.k = 'I'; r.cred = worked(); r.note = `Missing check-out — ${hhmm(r.cred)} credited until a correction is approved`; return r; }
  if (!ps.length) { r.k = 'A'; return r; }
  r.cred = r.w; r.k = r.w >= full ? 'P' : 'S';
  return r;
}
const FINE_CATS = ['Late coming', 'Absent without notice', 'Left early without approval', 'Misconduct', 'Damage / loss of company property', 'Policy / safety violation', 'Other'];
const finesFor = (empId, m) => PAY.fines.filter((f) => f.empId === empId && f.month === m && f.status !== 'WAIVED');
/* the month: base pay for days on payroll, minus pay for the total hours short (extra hours are not paid), minus WFH cut, minus fines */
function payFor(emp, m, P = PAYCFG()) {
  const days = eachDay(m + '-01', monthEnd(m)), salary = +(PAY.map[emp.id]?.monthly || 0), rate = salary / days.length, hourRate = rate / P.fullH;
  const rows = days.map((d) => payDay(emp, d, P));
  const n = (...k) => rows.filter((x) => k.includes(x.k)).length;
  const counted = rows.filter((x) => !['F', 'NJ'].includes(x.k)).length;
  const req = rows.reduce((a, x) => a + x.req, 0), cred = rows.reduce((a, x) => a + x.cred, 0);
  const short = Math.max(0, req - cred), extra = Math.max(0, cred - req);
  const base = Math.round(rate * counted), shortCut = Math.round((short / 60) * hourRate);
  const wfhDays = n('WFH'), wfhCut = Math.round(wfhDays * rate * (P.wfhCut / 100));
  const earned = Math.max(0, base - shortCut - wfhCut);
  const fl = finesFor(emp.id, m), fines = fl.reduce((a, f) => a + (+f.amount || 0), 0);
  return { emp, salary, rate, hourRate, rows, counted, base, req, cred, short, extra, shortCut, wfhCut, wfh: wfhDays, deduction: shortCut + wfhCut, earned, fines, fineList: fl, net: Math.max(0, earned - fines),
    present: n('P'), shortDays: n('S'), absent: n('A'), leave: n('LV') + n('HL') * 0.5, lwp: n('LWP'), od: n('OD'), missing: n('I'), off: n('WO', 'H'), workDays: rows.filter((x) => x.req).length, partial: rows.some((x) => x.k === 'F') };
}

/* ── the salary sheet (a tab inside Attendance) ── */
function vSalary() {
  ensurePay();
  if (!PAY.loaded) return card('Salary sheet', '<p class="muted">Loading salaries…</p>');
  if (PAY.err) return card('Salary sheet', `<p>Salary figures are protected and couldn’t be loaded for your login.</p><p class="small muted">Ask the app owner to open <b>Share</b> and make you an <b>Editor</b> of OfficeHub, then reload.</p>`);
  const T = today(), m = ui('payMonth', addDays(T.slice(0, 7) + '-01', -1).slice(0, 7)), P = PAYCFG(), dept = ui('payDept', ''), q = (ui('payQ', '') || '').toLowerCase();
  const ppl = active().concat(S.emps.filter((e) => e.status === 'EXITED' && e.exitDate >= m + '-01')).filter((e) => (!e.joining || e.joining <= monthEnd(m)) && (!dept || e.deptId === dept) && (!q || e.name.toLowerCase().includes(q) || (e.code || '').toLowerCase().includes(q))).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
  const res = ppl.map((e) => payFor(e, m, P));
  const run = PAY.runs[m], tot = res.reduce((a, r) => ({ s: a.s + r.salary, b: a.b + r.base, sc: a.sc + r.shortCut, w: a.w + r.wfhCut, f: a.f + r.fines, n: a.n + r.net, sh: a.sh + r.short, ex: a.ex + r.extra }), { s: 0, b: 0, sc: 0, w: 0, f: 0, n: 0, sh: 0, ex: 0 });
  const locked = run?.status === 'FINAL', mFines = PAY.fines.filter((f) => f.month === m);
  const noSal = res.filter((r) => !r.salary).length, partial = m >= T.slice(0, 7);
  const wd = eachDay(m + '-01', partial ? addDays(T, -1) : monthEnd(m)).filter(workingDay).length;
  return `<div class="filters"><input type="month" class="i" id="pay-m" data-c="payMonth" value="${m}" max="${T.slice(0, 7)}"><select class="i" id="pay-d" data-c="payDept">${deptOpts(dept, 'All departments')}</select><input class="i" id="pay-q" data-i="payQ" placeholder="Search name or code" value="${esc(ui('payQ', ''))}">
      <button class="btn pri" data-a="pay-export">Export to Excel</button><button class="btn" data-a="pay-csv" title="Comma-separated file — opens in Excel, Google Sheets, Tally import">CSV</button>${locked ? '' : '<button class="btn" data-a="pay-fine">+ Add fine</button>'}${run?.status === 'FINAL' ? `<span class="pill t-ok" style="align-self:center">Finalised ${fmtDT(run.at)}</span>${S.me.role === 'ADMIN' ? '<button class="btn" data-a="pay-reopen">Reopen</button>' : ''}` : `<button class="btn" data-a="pay-run" ${partial ? 'title="The month is not over — the run will be a draft up to yesterday"' : ''}>${run ? 'Re-run payroll' : 'Run payroll'}</button>${run ? `<button class="btn" data-a="pay-final">Finalise</button>` : ''}`}</div>
    ${partial ? `<div class="alert t-warn" style="cursor:default;margin-bottom:12px">${fmtM(m)} is still running — hours are counted up to yesterday.</div>` : ''}
    ${noSal ? `<div class="alert t-warn" style="cursor:default;margin-bottom:12px">${noSal} employee(s) have no salary set — open them on the People page to add it.</div>` : ''}
    <div class="kstrip" style="grid-template-columns:repeat(6,minmax(0,1fr))">
      <div class="kt"><span class="l">Company working hours</span><span class="v">${wd * P.fullH}<small> h · ${wd} days</small></span></div><div class="kt"><span class="l">Monthly salaries</span><span class="v">${money(tot.s)}</span></div>
      <div class="kt"><span class="l">Short-time deduction</span><span class="v bad">${money(tot.sc)}</span></div><div class="kt"><span class="l">WFH deduction</span><span class="v bad">${money(tot.w)}</span></div>
      <div class="kt"><span class="l">Fines (${res.reduce((a, r) => a + r.fineList.length, 0)})</span><span class="v bad">${money(tot.f)}</span></div>
      <div class="kt"><span class="l">Net payable ${partial ? 'so far' : ''}</span><span class="v ok">${money(tot.n)}</span></div></div>
    ${card(`Salary sheet · ${fmtM(m)}`, `<div class="tbl-wrap"><table class="t pay"><thead><tr><th>Employee</th><th class="num">Monthly salary</th><th class="num">Per hour</th><th class="num" title="Working days × ${P.fullH} h (leave and official duty count as worked)">Required h</th><th class="num" title="Hours actually worked + paid leave / official duty hours">Worked h</th><th class="num">Short h</th><th class="num" title="Extra hours are not paid">Extra h<br><span class="tiny">not paid</span></th><th class="num">Absent</th><th class="num">LWP</th><th class="num">Leave</th><th class="num">WFH</th><th class="num" title="Missing check-out">Miss. punch</th><th class="num">Short-time cut</th><th class="num">WFH cut</th><th class="num">Fines</th><th class="num">Net pay</th></tr></thead><tbody>
      ${res.map((r) => `<tr class="click" data-a="pay-emp" data-id="${r.emp.id}"><td>${person(r.emp.id, `${r.emp.code || ''} · ${deptOf(r.emp.deptId)?.code || ''}`)}</td><td class="num">${r.salary ? money(r.salary) : '<span class="muted">not set</span>'}</td><td class="num">${r.salary ? '₹' + round2(r.hourRate).toLocaleString('en-IN') : ''}</td>
        <td class="num">${hhmm(r.req)}</td><td class="num">${hhmm(r.cred)}</td><td class="num" style="color:var(--bad);font-weight:600">${r.short ? hhmm(r.short) : ''}</td><td class="num muted">${r.extra ? hhmm(r.extra) : ''}</td>
        <td class="num" style="color:var(--bad)">${r.absent || ''}</td><td class="num" style="color:var(--bad)">${r.lwp || ''}</td><td class="num">${r.leave || ''}</td><td class="num">${r.wfh || ''}</td><td class="num" style="color:var(--warn)">${r.missing || ''}</td>
        <td class="num" style="color:var(--bad)">${r.shortCut ? money(r.shortCut) : ''}</td><td class="num" style="color:var(--bad)">${r.wfhCut ? money(r.wfhCut) : ''}</td><td class="num" style="color:var(--bad)" title="${esc(r.fineList.map((f) => `${money(f.amount)} — ${f.reason}`).join('\n'))}">${r.fines ? money(r.fines) : ''}</td><td class="num"><b>${money(r.net)}</b></td></tr>`).join('')}
    </tbody><tfoot><tr><td><b>Total</b></td><td class="num"><b>${money(tot.s)}</b></td><td colspan="3"></td><td class="num" style="color:var(--bad)"><b>${hhmm(tot.sh)}</b></td><td class="num muted">${hhmm(tot.ex)}</td><td colspan="5"></td><td class="num" style="color:var(--bad)"><b>${money(tot.sc)}</b></td><td class="num" style="color:var(--bad)"><b>${money(tot.w)}</b></td><td class="num" style="color:var(--bad)"><b>${money(tot.f)}</b></td><td class="num"><b>${money(tot.n)}</b></td></tr></tfoot></table></div>`, { list: true })}
    ${card(`Fines · ${fmtM(m)} <span class="count">${mFines.length}</span>`, mFines.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Reason</th><th class="num">Amount</th><th>Added by</th><th>Status</th><th></th></tr></thead><tbody>
      ${mFines.map((f) => `<tr><td>${person(f.empId, empById(f.empId)?.code || '')}</td><td class="small">${fmtD(f.date)}</td><td class="small">${esc(f.category)}</td><td class="small" style="max-width:320px;white-space:normal">${esc(f.reason)}${f.status === 'WAIVED' ? `<div class="tiny muted">Waived by ${esc(nameOf(f.waivedBy))}: ${esc(f.waiveReason || '')}</div>` : ''}</td><td class="num" style="${f.status === 'WAIVED' ? 'text-decoration:line-through;color:var(--muted)' : 'color:var(--bad)'}">${money(f.amount)}</td><td class="small">${esc(nameOf(f.by))}<div class="tiny muted">${fmtDT(f.at)}</div></td><td>${f.status === 'WAIVED' ? '<span class="pill">Waived</span>' : '<span class="pill t-bad">Active</span>'}</td><td style="text-align:right">${!locked && f.status !== 'WAIVED' ? `<button class="btn sm" data-a="pay-waive" data-id="${f.id}">Waive</button>` : ''}</td></tr>`).join('')}

    ${card('How pay is calculated', `<form data-f="pay-rules" class="fgrid">
      <div class="full small" style="line-height:1.7"><b>Pay is by the minute, for the whole month.</b><br>
      1. <b>Required hours</b> = company working days × ${P.fullH} h (Mon–Sat; Sundays and holidays are paid off and not counted). Approved paid leave and official duty count as ${P.fullH} h worked; a half-day leave counts ${hhmm(P.fullH * 30)}.<br>

const hrs = (m) => round2((m || 0) / 60);

  const cellOf = (x) => (['F', 'NJ'].includes(x.k) ? '' : ['WO', 'H', 'LV', 'LWP', 'OD', 'A'].includes(x.k) ? x.k : `${hrs(x.cred)}${x.k === 'WFH' ? ' WFH' : x.k === 'I' ? ' I' : ''}`);
  const daywise = { name: 'Day-wise hours', cols: ['Code', 'Name', ...days.map((d) => `${+d.slice(8)} ${DAYS[dow(d)].slice(0, 2)}`), 'Worked h', 'Required h', 'Short h'], rows: rs.map((r) => [r.emp.code, r.emp.name, ...r.rows.map(cellOf), hrs(r.cred), hrs(r.req), hrs(r.short)]) };
  const legend = { name: 'Codes & rules', cols: ['Code', 'Meaning'], rows: [...Object.entries(PCODE).map(([k, v]) => [k, v[0]]), ['', ''], ['Numbers', 'Hours credited that day'], ['Required', `${P.fullH} h per working day (Mon–Sat, excluding holidays)`], ['Deduction', 'Only the total short hours for the month × per-hour rate; extra hours are not paid'], ['WFH', `${P.wfhCut}% of that day’s pay is deducted`]] };
  return [summary, fines, daywise, legend];

function payRows(m) {
  const P = PAYCFG();
  return active().concat(S.emps.filter((e) => e.status === 'EXITED' && e.exitDate >= m + '-01')).filter((e) => !e.joining || e.joining <= monthEnd(m)).sort((a, b) => (a.code || '').localeCompare(b.code || '')).map((e) => payFor(e, m, P));

async function payAction(a, el) {

  switch (a) {
    case 'pay-emp': return openModal(() => payDetail(el.dataset.id, m));
    case 'pay-export': return exportBook(`Salary sheet ${fmtM(m)} - ${cfg().company}`, payBook(m));

    case 'pay-emp-export': { const e = empById(el.dataset.id), r = payFor(e, m); return exportBook(`Salary ${e.code || ''} ${e.name} ${fmtM(m)}`, [
      { name: 'Day-wise', cols: ['Date', 'Day', 'In', 'Out', 'Worked (h)', 'Required (h)', 'Difference (h)', 'Counted as', 'Note'], rows: [...r.rows.filter((x) => x.k !== 'F').map((x) => { const ps = punchesOn(e.id, x.d); return [x.d, DAYS[dow(x.d)], ps[0] ? hm(ps[0].t) : '', ps.length > 1 ? hm(ps[ps.length - 1].t) : '', x.req || x.cred ? hrs(x.cred) : '', x.req ? hrs(x.req) : '', x.req ? hrs(x.cred - x.req) : '', PCODE[x.k]?.[0] || x.k, x.note]; }),
        [], ['', '', '', 'Month', hrs(r.cred), hrs(r.req), hrs(r.cred - r.req)], [], ['', '', '', '', '', '', '', 'Base pay (₹)', r.base], ['', '', '', '', '', '', '', `Short ${hhmm(r.short)} × ₹${round2(r.hourRate)}/h`, -r.shortCut], ['', '', '', '', '', '', '', 'WFH deduction (₹)', -r.wfhCut], ['', '', '', '', '', '', '', 'Fines (₹)', -r.fines], ['', '', '', '', '', '', '', 'Net pay (₹)', r.net]] },
      { name: 'Fines', cols: ['Date', 'Type', 'Reason', 'Amount'], rows: r.fineList.map((f) => [f.date, f.category, f.reason, +f.amount]) }]); }
    case 'pay-fine': { if (PAY.runs[m]?.status === 'FINAL') return toast('This month is finalised — an administrator must reopen it to add fines.', 'warn'); const pre = el.dataset.id; return openModal(() => fineForm(pre)); }
    case 'pay-waive': { const f = PAY.fines.find((x) => x.id === el.dataset.id); if (!f) return; return confirmBox(`Waive ${money(f.amount)} fine for ${nameOf(f.empId)}?`, 'It stays on record as waived and is no longer deducted.', async (why) => { await patch(`fines/${f.id}`, { status: 'WAIVED', waivedBy: S.me.id, waivedAt: Date.now(), waiveReason: why }); await audit('FINE_WAIVED', { emp: f.empId, amount: f.amount }); await notify([f.empId], { title: `Fine of ${money(f.amount)} waived`, body: why }); }, { input: 'Reason for waiving', danger: false }); }

      await put(`payroll/${m}`, { month: m, at: Date.now(), by: S.me.id, status: 'DRAFT', method: 'hours', rules: PAYCFG(), partial: m >= today().slice(0, 7),
        totals: { employees: rs.length, salary: sum('salary'), base: sum('base'), shortMin: sum('short'), shortCut: sum('shortCut'), wfhCut: sum('wfhCut'), fines: sum('fines'), net: sum('net') },
        rows: rs.map((r) => ({ e: r.emp.id, s: r.salary, dc: r.counted, rq: r.req, wk: r.cred, sh: r.short, ex: r.extra, a: r.absent, u: r.lwp, l: r.leave, w: r.wfh, mp: r.missing, b: r.base, sc: r.shortCut, wd: r.wfhCut, fi: r.fines, n: r.net })) });
      await audit('PAYROLL_RUN', { month: m, employees: rs.length });
    }, `Payroll calculated for ${fmtM(m)}`);
    case 'pay-final': return confirmBox(`Finalise ${fmtM(m)} payroll?`, 'The saved figures are locked. Re-running needs an administrator to reopen it.', async () => { await patch(`payroll/${m}`, { status: 'FINAL', finalAt: Date.now(), finalBy: S.me.id }); await audit('PAYROLL_FINAL', { month: m }); }, { danger: false });
    case 'pay-reopen': return act(async () => { await patch(`payroll/${m}`, { status: 'DRAFT' }); await audit('PAYROLL_REOPEN', { month: m }); }, 'Reopened');
  }
}
async function paySubmit(f, form, fd) {
  const v = (k) => String(fd.get(k) ?? '').trim();
  if (f === 'pay-rules') return act(async () => {
    if (!isHR()) fail('Only HR can change pay rules.');
    const fullH = +v('fullH') || 8, missH = Math.max(0, +v('missH') || 0);
    if (missH > fullH) fail('Hours credited for a missing check-out can’t be more than a full day.');
    await saveCfg({ pay: { fullH, missH, wfhCut: Math.max(0, Math.min(100, +v('wfhCut') || 0)) } });
    await audit('PAY_RULES_CHANGED', { fullH, missH });
  }, 'Pay rules saved');
  if (f === 'pay-fine') return act(async () => {
    if (!canSalary() || S.canEdit === false) fail('Only HR or an administrator with Editor access can add fines.');
    const empId = v('empId'), amount = Math.round(+v('amount')), date = v('date'), reason = v('reason'), m = date.slice(0, 7);
    if (!empId) fail('Choose the employee.');
    if (!(amount > 0)) fail('Enter the fine amount.');
    if (reason.length < 5) fail('Write the reason — the employee will see it.');
    if (PAY.runs[m]?.status === 'FINAL') fail(`${fmtM(m)} payroll is finalised — reopen it first.`);
    const sal = +(PAY.map[empId]?.monthly || 0), already = finesFor(empId, m).reduce((a, x) => a + (+x.amount || 0), 0);
    if (sal && amount + already > sal) fail(`Fines can’t exceed the monthly salary (${money(sal)}).`);
    await put(`fines/${newId()}`, { empId, month: m, date, amount, category: v('category'), reason, status: 'ACTIVE', by: S.me.id, at: Date.now() });
    await audit('FINE_ADDED', { emp: empId, amount, month: m });
    if (fd.get('notify') === 'on') await notify([empId], { title: `Fine of ${money(amount)} — ${v('category')}`, body: `${reason} (deducted from ${fmtM(m)} salary)` });
    closeModal();
  }, 'Fine added');
  if (f === 'acc-save') return act(async () => {
    if (S.me.role !== 'ADMIN') fail('Only an administrator can change who sees what.');
    const k = form.dataset.k, reset = fd.get('reset') === '1';
    const acc = { ...(cfg().access || {}) };
    if (reset) delete acc[k]; else acc[k] = { roles: fd.getAll('roles').map(String), depts: fd.getAll('depts').map(String), people: fd.getAll('people').map(String) };
    await saveCfg({ access: acc }); await audit('ACCESS_CHANGED', { window: k }); closeModal();
  }, 'Access updated');
}

<script>
/* ═════════════ Expense claims & TA/DA ═════════════
   A claim is an EXPENSE request (same approval chain: reporting manager → Accounts → Director above the limit)
   whose data.claim holds the trip and its line items. Approvers can pass a lower amount; Accounts marks it paid. */
const CLAIM_KINDS = [['TADA', 'TA/DA — field visit / tour'], ['LOCAL', 'Local conveyance'], ['OTHER', 'Other business expense']];
const CLINE = [['FARE', 'Travel fare (bus / train / flight / cab)'], ['OWN', 'Own vehicle (per km)'], ['LODGE', 'Hotel / lodging'], ['DA', 'Daily allowance (DA)'], ['FOOD', 'Food & meals'], ['LOCAL', 'Local conveyance / auto'], ['CLIENT', 'Client / farmer meeting'], ['COMM', 'Phone / internet'], ['OTHER', 'Other']];
const CLAIM_DEF = { da: { EMPLOYEE: 400, MANAGER: 600, HR: 600, DIRECTOR: 1000, ADMIN: 1000 }, lodge: { EMPLOYEE: 1800, MANAGER: 3000, HR: 3000, DIRECTOR: 5000, ADMIN: 5000 }, km2: 4, km4: 9, billAbove: 300 };
const CPOL = () => { const c = cfg().claims || {}; return { ...CLAIM_DEF, ...c, da: { ...CLAIM_DEF.da, ...(c.da || {}) }, lodge: { ...CLAIM_DEF.lodge, ...(c.lodge || {}) } }; };
const claimTotal = (lines) => Math.round((lines || []).reduce((a, l) => a + (+l.amt || 0), 0));
const isClaim = (r) => r?.type === 'EXPENSE' && !!r.data?.claim;
const canPayClaims = () => isHR() || S.me?.deptId === cfg().depts.find((d) => d.code === 'ACC')?.id;
const tripDays = (a, b) => (a && b && b >= a ? eachDay(a, b).length : a ? 1 : 0);
function claimFlags(c, emp) {
  const P = CPOL(), role = emp?.role || 'EMPLOYEE', out = [];
  const nights = Math.max(0, tripDays(c.from, c.to) - 1);
  (c.lines || []).forEach((l, i) => {
    const amt = +l.amt || 0;
    if (amt > P.billAbove && !l.file && !l.link && !['DA', 'OWN'].includes(l.cat)) out.push([i, `No bill attached for ${money(amt)}`]);
    if (l.cat === 'DA' && l.days && amt > l.days * P.da[role]) out.push([i, `DA above ${money(P.da[role])}/day`]);
    if (l.cat === 'OWN' && l.km && amt > Math.round(l.km * (l.veh === '4W' ? P.km4 : P.km2))) out.push([i, 'Above the per-km rate']);
  });
  const lodge = (c.lines || []).filter((l) => l.cat === 'LODGE').reduce((a, l) => a + (+l.amt || 0), 0);
  if (lodge && nights && lodge > nights * P.lodge[role]) out.push([-1, `Lodging ${money(lodge)} is above ${money(P.lodge[role])} × ${nights} night(s)`]);
  if (c.kind === 'TADA' && !c.odReq) out.push([-1, 'Not linked to an approved official-duty request']);
  return out;
}

/* ── the claim form ── */
function claimForm() {
  if (!M) return '';
  if (!M.cl) {
    const T = today(), od = myODs()[0];

/* read what is typed into the form back into M.cl, so adding/removing rows keeps it */

  const fd = new FormData(f), g = (k) => String(fd.get(k) ?? '');
  Object.assign(M.cl, { kind: g('kind') || M.cl.kind, purpose: g('purpose'), places: g('places'), from: g('from') || M.cl.from, to: g('to') || M.cl.to, odReq: fd.has('odReq') ? g('odReq') : M.cl.odReq, advance: g('advance'), link: g('link'), note: g('note') });
  M.cl.lines = M.cl.lines.map((l, i) => ({ ...l, date: g(`d_${i}`), cat: g(`c_${i}`) || l.cat, desc: g(`x_${i}`), amt: g(`a_${i}`), veh: g(`v_${i}`) || l.veh, km: l.cat === 'OWN' ? g(`k_${i}`) : l.km, days: l.cat === 'DA' ? g(`k_${i}`) : l.days }));
}
function clRecalc(el) {
  const row = el?.closest?.('.cl-line'), P = CPOL();
  if (row && el.dataset.calc) {
    const i = row.dataset.i, cat = row.querySelector(`[name=c_${i}]`)?.value, k = +row.querySelector(`[name=k_${i}]`)?.value || 0, a = row.querySelector(`[name=a_${i}]`);

async function claimAction(a, el) {
  if (a === 'claim-new') { if (S.readonly) return toast('You have view-only access to this app.', 'warn'); return openModal(claimForm); }
  if (a === 'claim-export') return claimExport();
  if (a === 'claim-pay') { const r = byId(S.reqs, el.dataset.id); return openModal(() => payClaimForm(r)); }

  clSync();
  const c = M.cl, i = +el.dataset.i;

  if (a === 'cl-del' && c.lines.length > 1) { c.lines.splice(i, 1); const nf = {}; Object.entries(c.files).forEach(([k, f]) => { if (+k < i) nf[k] = f; else if (+k > i) nf[+k - 1] = f; }); c.files = nf; }
  if (a === 'cl-unbill') delete c.files[i];

async function claimSubmit(form, fd) {

    const lines = c.lines.map((l, i) => ({ date: l.date || c.from, cat: l.cat, desc: (l.desc || '').trim(), amt: Math.round(+l.amt || 0), ...(l.cat === 'OWN' ? { veh: l.veh || '2W', km: +l.km || 0 } : {}), ...(l.cat === 'DA' ? { days: +l.days || 0 } : {}), ...(c.files[i] ? { file: c.files[i] } : {}) })).filter((l) => l.amt > 0);

    const total = claimTotal(lines), advance = Math.round(+c.advance || 0);
    const claim = { kind: c.kind, purpose: c.purpose.trim(), places: (c.places || '').trim(), from: c.from, to: c.kind === 'TADA' ? c.to : c.from, odReq: c.kind === 'TADA' ? c.odReq || null : null, lines, total, advance, net: Math.max(0, total - advance), link: (c.link || '').trim(), note: (c.note || '').trim() };

  body += `<div class="kstrip" style="grid-template-columns:repeat(3,minmax(0,1fr))">${kp.map(([l, v, s, t]) => `<div class="kt"><span class="l">${l}</span><span class="v ${t}">${v}</span><span class="tiny muted">${s}</span></div>`).join('')}</div>

    ${card(tab === 'mine' ? 'My claims' : tab === 'topay' ? 'Approved — waiting for payment' : 'Team claims', list.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Claim</th>${tab !== 'mine' ? '<th>Employee</th>' : ''}<th>Dates</th><th class="num">Claimed</th><th class="num">Approved</th><th>Status</th><th>With</th></tr></thead><tbody>
      ${list.map((r) => { const c = r.data.claim, s = stat(r), st = curStep(r); return `<tr class="click" data-a="req" data-id="${r.id}"><td><div class="trunc" style="max-width:340px">${esc(r.title)}</div><div class="tiny muted">${esc(r.code)}${c ? ` · ${c.lines.length} item(s)${c.lines.some((l) => l.file) ? ' · bills attached' : ''}` : ''}${c && claimFlags(c, empById(r.empId)).length ? ' · <span style="color:var(--warn)">⚑ check</span>' : ''}</div></td>${tab !== 'mine' ? `<td>${person(r.empId, deptOf(empById(r.empId)?.deptId)?.code || '')}</td>` : ''}<td class="small">${fmtDs(c?.from || r.data.billDate)}${c && c.to !== c.from ? '–' + fmtDs(c.to) : ''}</td><td class="num">${money(c?.total ?? r.amount)}</td><td class="num">${['APPROVED'].includes(r.status) ? money(amt(r)) : ''}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td class="small muted">${st ? esc(nameOf(st.by)) : r.paid ? esc(r.paid.mode) : ''}</td></tr>`; }).join('')}
      </tbody></table></div>` : empty(tab === 'mine' ? 'No claims yet. Use “+ New claim” after a field visit or business expense.' : 'Nothing here.'), { list: true })}`;
  return shell(body, 'Expense claims', 'TA/DA for field visits, local conveyance and business expenses', '<button class="btn pri" data-a="claim-new">+ New claim</button>');
}
function claimExport() {

  const list = all.filter((r) => !m || (r.data.claim?.from || r.data.billDate || '').startsWith(m));

  return exportBook(`Expense claims${m ? ' ' + fmtM(m) : ''} - ${cfg().company}`, [sum, lines]);

<script>
/* ═════════════ OfficeHub account & password, email alerts ═════════════
   On top of the Claude sign-in, every person creates an OfficeHub account (employee code + work email + password).
   The password hash lives in auth/{their Claude id}: only that person can read it; administrators can only delete it
   (that is the "reset password" action). Sessions are remembered in this browser only. */
const AUTH = { doc: undefined, sub: false, busy: false, err: '', mode: '' };
const SESSION_KEY = 'oh_session';
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function pwHash(pw, saltB64, iter = 120000) {
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), (c) => c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, key, 256);
  return { salt: b64(salt), hash: b64(bits), iter };
}
function pwProblem(pw, pw2) {
  if (pw.length < 8) return 'Use at least 8 characters.';
  if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Use letters and at least one number.';
  if (pw2 != null && pw !== pw2) return 'The two passwords don’t match.';
  return '';
}
const readSession = () => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; } };
const writeSession = (s) => { try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch { /* storage blocked: session lasts this page load */ } AUTH.mem = s; };
function authWatch() {
  if (AUTH.sub || !S.db || !S.uid) return;
  AUTH.sub = true;
  S.db.doc(`auth/${S.uid}`).onSnapshot((s) => { AUTH.doc = s.exists ? s.data() : null; schedule(); }, () => { AUTH.doc = null; schedule(); });
}
function isAuthed() {
  if (!S.me) return false;
  authWatch();
  if (AUTH.doc === undefined) return null; // still loading
  if (!AUTH.doc) return false;
  const s = AUTH.mem || readSession();
  return !!(s && s.uid === S.uid && s.v === AUTH.doc.ver && s.exp > Date.now());
}
const authCard = (title, sub, body) => `<div class="auth"><div class="auth-art" aria-hidden="true"><div class="auth-brand"><div class="mark">${esc(initials(cfg().company || 'OH'))}</div><div><b>OfficeHub</b><small>${esc(cfg().company)}</small></div></div>
  <div class="auth-copy"><h2>Your office, in one place.</h2><p>Attendance, leave, tasks, approvals, claims and salary — for everyone at ${esc(cfg().company)}.</p></div>
  <div class="auth-dots">${['var(--c-teal)', 'var(--c-amber)', 'var(--c-coral)', 'var(--c-sky)', 'var(--c-leaf)'].map((c) => `<span style="background:${c}"></span>`).join('')}</div></div>
  <div class="auth-panel"><div class="auth-box"><h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}${AUTH.err ? `<div class="alert t-bad" style="cursor:default;margin:12px 0">${esc(AUTH.err)}</div>` : ''}${body}</div></div></div>`;
function vLogin() {
  const e = S.me, d = AUTH.doc;
  if (d === undefined) return `<div class="splash"><p class="muted">Checking your account…</p></div>`;
  if (!d) return authCard(`Create your password`, `Hi ${esc(e.name.split(' ')[0])} — set a password for your OfficeHub account. You’ll use it with your work email or employee code to sign in.`, `
    <form data-f="auth-create" class="grid" style="gap:12px;margin-top:16px">
      <div class="auth-who">${avatar(e.name)}<div><b>${esc(e.name)}</b><div class="small muted">${esc(e.code || '')} · ${esc(e.email || 'no email on record')}</div></div></div>
      <label class="f">New password<input class="i" type="password" id="au-p1" name="pw" autocomplete="new-password" required minlength="8"></label>
      <label class="f">Repeat password<input class="i" type="password" id="au-p2" name="pw2" autocomplete="new-password" required></label>
      <label class="check"><input type="checkbox" id="au-mail" name="mail" ${e.prefs?.email === false ? '' : 'checked'}> Email me my alerts${e.email ? ` at ${esc(e.email)}` : ''}</label>
      <button class="btn pri big" type="submit" ${AUTH.busy ? 'disabled' : ''}>${AUTH.busy ? 'Saving…' : 'Create account'}</button>
      <p class="tiny muted" style="margin:0">At least 8 characters with letters and a number. Forgot it later? HR or an administrator can reset it.</p></form>`);
  const lock = d.lockUntil && d.lockUntil > Date.now();
  return authCard('Sign in', `Welcome back${e ? ', ' + esc(e.name.split(' ')[0]) : ''}.`, `
    <form data-f="auth-login" class="grid" style="gap:12px;margin-top:16px">
      <label class="f">Work email or employee code<input class="i" id="au-id" name="id" autocomplete="username" value="${esc(e.email || e.code || '')}" required></label>
      <label class="f">Password<input class="i" type="password" id="au-pw" name="pw" autocomplete="current-password" required ${lock ? 'disabled' : ''}></label>
      <label class="check"><input type="checkbox" id="au-keep" name="keep" checked> Keep me signed in on this device for 7 days</label>
      <button class="btn pri big" type="submit" ${AUTH.busy || lock ? 'disabled' : ''}>${lock ? `Locked until ${hm(d.lockUntil)}` : AUTH.busy ? 'Checking…' : 'Sign in'}</button>
      <p class="tiny muted" style="margin:0">Forgot your password? Ask HR or an administrator to reset it, then create a new one here.</p></form>`);
}
function vSignup() {
  return authCard('Create your account', 'Use the employee code and work email HR has on record for you.', `
    <form data-f="auth-signup" class="grid" style="gap:12px;margin-top:16px">
      <label class="f">Employee code<input class="i" id="su2-c" name="code" required placeholder="e.g. AMR112" autocomplete="off"></label>
      <label class="f">Work email<input class="i" type="email" id="su2-e" name="email" required value="${esc(S.myEmail || '')}" autocomplete="email"></label>
      <label class="f">Password<input class="i" type="password" id="su2-p1" name="pw" required minlength="8" autocomplete="new-password"></label>
      <label class="f">Repeat password<input class="i" type="password" id="su2-p2" name="pw2" required autocomplete="new-password"></label>
      <label class="check"><input type="checkbox" id="su2-m" name="mail" checked> Email me my alerts</label>
      <button class="btn pri big" type="submit" ${AUTH.busy ? 'disabled' : ''}>${AUTH.busy ? 'Creating…' : 'Create account'}</button>
      <p class="tiny muted" style="margin:0">Not on the employee list yet? Ask HR to add you on the People page first.${S.readonly ? ' Also ask the owner to share OfficeHub with you as a Contributor.' : ''}</p></form>`);
}
async function authSubmit(f, form, fd) {
  const v = (k) => String(fd.get(k) ?? '');
  AUTH.err = ''; AUTH.busy = true; schedule();
  try {
    if (f === 'auth-signup') {
      const code = v('code').trim().toUpperCase(), email = v('email').trim().toLowerCase();
      const e = S.emps.find((x) => (x.code || '').toUpperCase() === code && x.active !== false);
      if (!e || (e.email || '').toLowerCase() !== email) throw new Error('That employee code and email don’t match our records. Check them, or ask HR.');
      if (e.userId && e.userId !== S.uid) throw new Error('This employee already has an account on another login. Ask HR to reset it if that isn’t you.');
      const bad = pwProblem(v('pw'), v('pw2')); if (bad) throw new Error(bad);
      const h = await pwHash(v('pw'));
      await put(`auth/${S.uid}`, { ...h, ver: Date.now(), empId: e.id, created: Date.now(), fails: 0 });
      await patch(`emp/${e.id}`, { userId: S.uid, prefs: { ...(e.prefs || {}), email: fd.get('mail') === 'on' } });
      writeSession({ uid: S.uid, v: (await S.db.doc(`auth/${S.uid}`).get()).data().ver, exp: Date.now() + 12 * 3600000 });
      const hrs = active().filter((x) => ['HR', 'ADMIN'].includes(x.role)).map((x) => x.id);
      await S.db.collection('ntf').doc().set(clean({ to: hrs[0] || e.id, at: Date.now(), title: `${e.name} created an OfficeHub account`, body: `${e.code} · ${e.email}`, go: { view: 'people' }, read: false, from: e.id }));
      await S.db.collection('audit').doc().set(clean({ at: Date.now(), by: e.id, action: 'ACCOUNT_CREATED', detail: { emp: e.id } }));
    }
    if (f === 'auth-create') {
      const bad = pwProblem(v('pw'), v('pw2')); if (bad) throw new Error(bad);
      const h = await pwHash(v('pw')), ver = Date.now();
      await put(`auth/${S.uid}`, { ...h, ver, empId: S.me.id, created: Date.now(), fails: 0 });
      await patch(`emp/${S.me.id}`, { prefs: { ...(S.me.prefs || {}), email: fd.get('mail') === 'on' } });
      writeSession({ uid: S.uid, v: ver, exp: Date.now() + 12 * 3600000 });
      await audit('ACCOUNT_CREATED', { emp: S.me.id });
    }
    if (f === 'auth-login') {
      const d = AUTH.doc, id = v('id').trim().toLowerCase(), e = S.me;
      if (d.lockUntil && d.lockUntil > Date.now()) throw new Error(`Too many wrong attempts. Try again after ${hm(d.lockUntil)}.`);
      const idOk = id === (e.email || '').toLowerCase() || id === (e.code || '').toLowerCase();
      const h = await pwHash(v('pw'), d.salt, d.iter);
      if (!idOk || h.hash !== d.hash) {
        const fails = (d.fails || 0) + 1;
        await patch(`auth/${S.uid}`, fails >= 5 ? { fails: 0, lockUntil: Date.now() + 15 * 60000 } : { fails });
        throw new Error(fails >= 5 ? 'Too many wrong attempts — sign-in is locked for 15 minutes.' : `Wrong email/code or password. ${5 - fails} attempt(s) left.`);
      }
      if (d.fails || d.lockUntil) await patch(`auth/${S.uid}`, { fails: 0, lockUntil: null });
      writeSession({ uid: S.uid, v: d.ver, exp: Date.now() + (fd.get('keep') === 'on' ? 7 * 24 : 12) * 3600000 });
    }
    if (f === 'auth-change') {
      const d = AUTH.doc, cur = await pwHash(v('cur'), d.salt, d.iter);
      if (cur.hash !== d.hash) throw new Error('Your current password is wrong.');
      const bad = pwProblem(v('pw'), v('pw2')); if (bad) throw new Error(bad);
      const h = await pwHash(v('pw')), ver = Date.now();
      await put(`auth/${S.uid}`, { ...d, ...h, ver, fails: 0, lockUntil: null });
      writeSession({ uid: S.uid, v: ver, exp: Date.now() + 12 * 3600000 });
      await audit('PASSWORD_CHANGED', { emp: S.me.id });
      toast('Password changed');
    }
    if (f === 'acct-prefs') { await patch(`emp/${S.me.id}`, { prefs: { ...(S.me.prefs || {}), email: fd.get('mail') === 'on' } }); toast('Saved'); }
    AUTH.busy = false; AUTH.err = '';
    if (['auth-change', 'acct-prefs'].includes(f)) closeModal();
    viewChanged = true; schedule();
  } catch (e) { AUTH.busy = false; AUTH.err = e.user || e instanceof Error && !e.code ? e.message : errText(e); if (['auth-change', 'acct-prefs'].includes(f)) { toast(AUTH.err, 'bad'); AUTH.err = ''; } schedule(); }
}
function signOut() { writeSession(null); AUTH.mem = null; closeModal(); S.ui.moreOpen = ''; viewChanged = true; schedule(); }
function accountModal() {
  const e = S.me;
  return `${mhead('My account', `${esc(e.code || '')} · ${esc(e.email || '')}`)}<div class="body grid" style="gap:16px">
    <form data-f="acct-prefs" class="card body grid" style="gap:10px"><h3>Email alerts</h3>
      <label class="check"><input type="checkbox" id="ac-mail" name="mail" ${e.prefs?.email === false ? '' : 'checked'}> Send my alerts (approvals, tasks, leave, claims, fines) to ${esc(e.email || 'my work email')}</label>
      <p class="tiny muted" style="margin:0">${mailReady() ? 'Email delivery is switched on for the office.' : 'Your alerts are queued for email. They are delivered once the office connects an email service (Settings → Email alerts).'}</p>
      <div><button class="btn" type="submit">Save</button></div></form>
    <form data-f="auth-change" class="card body fgrid"><h3 class="full">Change password</h3>
      <label class="f full">Current password<input class="i" type="password" id="cp-cur" name="cur" autocomplete="current-password" required></label>
      <label class="f">New password<input class="i" type="password" id="cp-n1" name="pw" autocomplete="new-password" required minlength="8"></label>
      <label class="f">Repeat new password<input class="i" type="password" id="cp-n2" name="pw2" autocomplete="new-password" required></label>
      <div class="full"><button class="btn" type="submit">Change password</button></div></form>
  </div><footer><button class="btn danger" data-a="acct-signout">Sign out</button><span style="flex:1"></span><button class="btn" data-a="close">Close</button></footer>`;
}

/* ── email alerts: every alert is also queued as an email in mail/ for people who opted in ── */
const mailReady = () => !!(window.OH_SESSION?.mail || cfg().mail?.enabled);
async function queueMail(empId, n) {
  const e = empById(empId);
  if (!e?.email || e.prefs?.email === false || e.active === false) return;
  await S.db.collection('mail').doc().set(clean({ to: e.email, toName: e.name, empId, subject: `[OfficeHub] ${n.title}`, text: `${n.title}\n\n${n.body || ''}\n\nOpen OfficeHub to see the details.\n— ${cfg().company}`, at: Date.now(), status: 'QUEUED', by: S.me?.id || null }));
}
const MAIL = { sub: false, list: [] };
function ensureMail() { if (MAIL.sub || !S.db) return; MAIL.sub = true; S.db.collection('mail').where('at', '>=', Date.now() - 30 * 86400000).onSnapshot((q) => { MAIL.list = docsOf(q).sort((a, b) => b.at - a.at); schedule(); }, () => {}); }
function mailCard() {
  ensureMail();
  const q = MAIL.list.filter((m) => m.status === 'QUEUED'), sent = MAIL.list.filter((m) => m.status === 'SENT');
  const optedOut = active().filter((e) => e.prefs?.email === false).length, noMail = active().filter((e) => !e.email).length;
  return `<div class="grid g2">${card('Email alerts', `<div class="grid" style="gap:10px">
      <div class="alert ${mailReady() ? 't-ok' : 't-warn'}" style="cursor:default">${mailReady() ? 'Email delivery is on.' : '<b>No email service is connected yet.</b> Every alert is being queued as an email (below). Claude-hosted apps can’t send email on their own — delivery needs an email connection (Gmail / Outlook connector for your Claude organisation, or the Vercel version with an SMTP or email-API key).'}</div>
      <div class="kv" style="grid-template-columns:1fr"><div><span>Queued (last 30 days)</span><b>${q.length}</b></div><div><span>Marked sent</span><b>${sent.length}</b></div><div><span>People who switched email alerts off</span><b>${optedOut}</b></div><div><span>People with no email on record</span><b style="${noMail ? 'color:var(--warn)' : ''}">${noMail}</b></div></div>
      <div class="row"><button class="btn" data-a="mail-export" ${q.length ? '' : 'disabled'}>Export queued emails</button><button class="btn" data-a="mail-sent" ${q.length ? '' : 'disabled'}>Mark all as sent</button></div>
      <p class="tiny muted" style="margin:0">The export (Excel/CSV: to, subject, message) can be sent with Outlook or Gmail mail merge until a live connection is set up.</p></div>`)}
    ${card(`Email outbox <span class="count">${q.length}</span>`, q.length ? `<ul class="list">${q.slice(0, 12).map((m) => `<li style="display:block"><div class="row" style="justify-content:space-between"><b class="trunc small">${esc(m.subject)}</b><span class="tiny muted">${fmtDT(m.at)}</span></div><div class="tiny muted">To ${esc(m.toName || '')} &lt;${esc(m.to)}&gt;</div></li>`).join('')}</ul>` : empty('No emails waiting.'), { list: true })}</div>`;
}
async function mailAction(a) {
  const q = MAIL.list.filter((m) => m.status === 'QUEUED');
  if (a === 'mail-export') return exportBook(`OfficeHub email outbox ${today()}`, [{ name: 'Outbox', cols: ['To name', 'To email', 'Subject', 'Message', 'Queued at'], rows: q.map((m) => [m.toName || '', m.to, m.subject, m.text, fmtDT(m.at)]) }]);
  if (a === 'mail-sent') return act(async () => { for (const m of q) await patch(`mail/${m.id}`, { status: 'SENT', sentAt: Date.now(), sentBy: S.me.id }); }, `${q.length} marked as sent`);
}
</script>
<style>
/* ── sign-in screens ── */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg)}

.auth-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c-amber) 55%,transparent),transparent 70%);opacity:.5}
.auth-brand{display:flex;gap:12px;align-items:center}.auth-brand b{font:700 1.3rem var(--f-display)}.auth-brand small{display:block;color:var(--rail-muted);text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}
.auth-brand .mark{background:var(--rail-act);color:var(--rail)}
.auth-copy h2{font:700 clamp(1.6rem,3vw,2.4rem)/1.15 var(--f-display);max-width:14ch}
.auth-copy p{color:var(--rail-muted);max-width:36ch;font-size:1rem}
.auth-dots{display:flex;gap:8px;position:relative;z-index:1}.auth-dots span{width:28px;height:8px;border-radius:99px}
.auth-panel{display:grid;place-items:center;padding:32px 16px}
.auth-box{width:min(400px,100%)}
.auth-box h1{font-size:1.7rem}
.auth-who{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.btn.big{min-height:44px;justify-content:center;font-size:1rem}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{padding:24px 16px}.auth-copy h2{font-size:1.4rem}.auth-copy p,.auth-dots{display:none}}
</style>

<script>
/* ═════════════ Chat 2.0 (Slack/Teams-style) + quick search (Ctrl/⌘ K) ═════════════
   Adds: @mentions with autocomplete (people, @everyone), #tags you can click to filter, grouped messages with
   avatars, emoji reactions, edit, pin, starred chats, "new messages" line, a Mentions inbox, and — through the
   room capability — who is online right now and who is typing. */
const CH2 = { pop: null, editing: null, picker: null, room: null, peers: [], typingT: 0, seenFor: null, seenAt: 0, lastPresence: '' };
/* outline smiley-with-plus for the per-message reaction button (opens the picker; no emoji shown until clicked) */
const RX_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20.5 11A9 9 0 1 1 13 3.5"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/><path d="M19 2v6M16 5h6"/></svg>';
const EMOJI = ['👍', '✅', '😂', '🙏', '🎉', '👀', '❤️', '🔥', '👏', '💯', '🤝', '😊', '🙌', '⚠️', '❌', '📌'];

/* ── presence: online now / typing (room capability; the page works without it) ── */
(function initRoom() {
  const go = () => window.claude?.use?.('room').then((r) => {
    if (!r) return; CH2.room = r;
    r.onPeers((ch) => { CH2.peers = ch.peers; if (S.view === 'chats' || S.view === 'people') schedule(); }, () => { CH2.room = null; });
  }).catch(() => {});
  setTimeout(go, 0);
})();
function setPresence(patch) {
  if (!CH2.room || !S.me) return;
  const next = { emp: S.me.id, chat: CHAT.openId || null, typing: false, ...patch };
  const key = JSON.stringify(next); if (key === CH2.lastPresence) return; CH2.lastPresence = key;
  CH2.room.presence(next).catch(() => {});
}
const peerEmp = (p) => (p.by ? S.emps.find((e) => e.userId === p.by) : null);
function onlineIds() { const s = new Set(); for (const p of CH2.peers) { if (p.kind !== 'viewer') continue; const e = peerEmp(p); if (e) s.add(e.id); } return s; }
function typingIn(chatId) { const out = new Set(); for (const p of CH2.peers) { if (p.isMe || !p.presence?.typing || p.presence?.chat !== chatId) continue; const e = peerEmp(p); if (e) out.add(e.name.split(' ')[0]); } return [...out]; }
const onlineDot = (id, on) => (on.has(id) ? '<span class="ondot" title="Online now"></span>' : '');

/* ── message text: escape, then format, mentions, tags, links ── */
function fmtMsg(m) {
  let t = esc(m.text || '');
  const codes = []; t = t.replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<b>$2</b>').replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?]|$)/g, '$1<i>$2</i>').replace(/(^|[\s(])~([^~\n]+)~(?=[\s).,!?]|$)/g, '$1<s>$2</s>');
  const ids = m.mentions || [];
  const names = ids.filter((x) => x !== '*').map((id) => [id, empById(id)?.name]).filter((x) => x[1]).sort((a, b) => b[1].length - a[1].length);
  for (const [id, n] of names) t = t.split('@' + esc(n)).join(`<button class="men ${id === S.me.id ? 'me' : ''}" data-a="dm" data-id="${id}" title="Message ${esc(n)}">@${esc(n)}</button>`);
  t = t.replace(/@(everyone|here)\b/g, '<span class="men me">@$1</span>');
  if (!ids.length) t = t.replace(/(^|\s)@([A-Za-z][\w.-]*)/g, '$1<b class="men">@$2</b>');
  t = t.replace(/(^|[\s>(])#([A-Za-z0-9][\w-]{1,30})/g, '$1<button class="htag" data-a="chat-tag" data-t="$2">#$2</button>');
  t = t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
  return t.replace(/\n/g, '<br>');
}
const tagsOf = (text) => [...new Set((String(text).match(/(^|\s)#([A-Za-z0-9][\w-]{1,30})/g) || []).map((x) => x.trim().slice(1).toLowerCase()))];
function mentionsOf(text, c) {
  const members = chatMembers(c), out = new Set();
  if (/@(everyone|here)\b/.test(text)) out.add('*');
  for (const id of members) { const n = empById(id)?.name; if (n && text.includes('@' + n)) out.add(id); }
  for (const h of (text.match(/@([A-Za-z][\w.-]*)/g) || []).map((x) => x.slice(1).toLowerCase())) { // short @firstname still works
    const hit = members.filter((id) => (empById(id)?.name || '').toLowerCase().split(/\s+/)[0] === h); if (hit.length === 1) out.add(hit[0]);
  }
  return [...out];
}

/* ── the chat page ── */
function vChats2() {
  // a deleted direct chat you reopened shows no old preview
  const chats = myChats().map((c) => (c.kind === 'dm' && nothingNew(c) ? { ...c, last: null } : c)), q = ui('chQ', '').toLowerCase(), on = onlineIds(), fav = new Set(CHAT.reads._fav || []);
  let openId = S.ui.chat || CHAT.openId;
  const mentionsView = openId === '@mentions';
  if (openId && !mentionsView && !chats.some((c) => c.id === openId)) openId = null;
  if (openId && !mentionsView) openChat(openId); else { CHAT.unsub?.(); CHAT.unsub = null; CHAT.openId = null; }
  if (openId !== CH2.seenFor) { CH2.seenFor = openId; CH2.seenAt = CHAT.reads[openId] || 0; CH2.editing = null; CH2.pop = null; }
  setPresence({ chat: mentionsView ? null : openId || null });
  const ments = S.ntf.filter((n) => n.go?.chat && /mentioned you|replied to you/.test(n.title) && !(clearedOf(n.go.chat)?.nt || []).includes(n.id));
  const unM = ments.filter((n) => !n.read).length;
  const list = chats.filter((c) => !q || c.title.toLowerCase().includes(q)).sort((a, b) => (b.last?.at || 0) - (a.last?.at || 0) || a.title.localeCompare(b.title));
  const item = (c) => { const other = c.kind === 'dm' ? (c.members || []).find((x) => x !== S.me.id) : null; const typ = typingIn(c.id);
    return `<button class="chat-item ${c.id === openId ? 'on' : ''} ${unreadIn(c) ? 'unread' : ''}" data-a="chat-open" data-id="${esc(c.id)}"><span class="av-wrap">${c.kind === 'dm' ? avatar(c.title) : `<span class="av chav ck-${c.kind}">${c.kind === 'all' ? '★' : c.kind === 'dept' ? '#' : esc(initials(c.title))}</span>`}${other ? onlineDot(other, on) : ''}</span>
    <span class="grow" style="min-width:0"><span class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:6px"><b class="trunc">${esc(c.title)}</b><span class="tiny muted">${c.last ? (ymd(new Date(c.last.at)) === today() ? hm(c.last.at) : fmtDs(ymd(new Date(c.last.at)))) : ''}</span></span>
    <span class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:6px"><span class="tiny ${typ.length ? 'typing-t' : 'muted'} trunc">${typ.length ? `${esc(typ.join(', '))} typing…` : c.last ? `${c.last.by === S.me.id ? 'You: ' : c.kind === 'dm' ? '' : esc(nameOf(c.last.by).split(' ')[0]) + ': '}${esc(c.last.text)}` : c.kind === 'dm' ? 'Say hello' : `${chatMembers(c).length} members`}</span>${unreadIn(c) ? '<span class="dotu" aria-label="unread"></span>' : ''}</span></span></button>`; };
  const group = (label, items) => (items.length ? `<div class="chat-sec">${label}</div>${items.map(item).join('')}` : '');
  const side = `<aside class="chat-side ${openId ? 'has-open' : ''}"><div class="chat-side-top"><input class="i" id="ch-q" data-i="chQ" placeholder="Search chats" value="${esc(ui('chQ', ''))}"><button class="btn pri sm" data-a="chat-new" title="New group">+ Group</button></div>
    <div class="dm-pick"><select class="i" id="ch-dm" data-c="chatDM" aria-label="Message a person">${peopleGroups(null, { blank: '✉ Message a person…', exclude: [S.me.id] })}</select></div>
    <div class="chat-list"><button class="chat-item ment ${mentionsView ? 'on' : ''}" data-a="chat-open" data-id="@mentions"><span class="av chav ck-ment">@</span><span class="grow"><b>Mentions</b><span class="tiny muted" style="display:block">Where people tagged you</span></span>${unM ? `<span class="ct">${unM}</span>` : ''}</button>
      ${group('Starred', list.filter((c) => fav.has(c.id)))}${group('Company', list.filter((c) => c.kind === 'all' && !fav.has(c.id)))}${group('Departments', list.filter((c) => c.kind === 'dept' && !fav.has(c.id)))}${group('Groups', list.filter((c) => c.kind === 'group' && !fav.has(c.id)))}${group('Direct messages', list.filter((c) => c.kind === 'dm' && !fav.has(c.id)))}${list.length ? '' : empty('No chats match.')}
      <div class="chat-sec">Online now · ${on.size}</div><div class="online-row">${[...on].filter((id) => id !== S.me.id).slice(0, 14).map((id) => `<button class="av-wrap" data-a="dm" data-id="${id}" title="${esc(nameOf(id))} — message">${avatar(nameOf(id))}<span class="ondot"></span></button>`).join('') || '<span class="tiny muted" style="padding:0 14px">Only you right now</span>'}</div></div></aside>`;
  let main = `<section class="chat-main empty-main">${empty('Pick a chat on the left, or message a person from the list.')}</section>`;
  if (mentionsView) {
    main = `<section class="chat-main"><header class="chat-head"><button class="btn ghost sm chat-back" data-a="chat-close" aria-label="Back to chats">‹</button><div class="grow"><b>Mentions</b><span class="tiny muted" style="display:block">Messages where someone tagged you</span></div>${unM ? '<button class="btn sm" data-a="chat-ment-read">Mark all read</button>' : ''}</header>
      <div class="chat-msgs">${ments.length ? ments.slice(0, 60).map((n) => `<button class="ment-row ${n.read ? '' : 'new'}" data-a="chat-ment" data-id="${n.id}">${avatar(nameOf(n.from))}<span class="grow" style="min-width:0;text-align:left"><span class="row" style="justify-content:space-between"><b class="small">${esc(n.title)}</b><span class="tiny muted">${fmtDT(n.at)}</span></span><span class="small muted" style="display:block">${esc(n.body || '')}</span></span></button>`).join('') : empty('Nobody has tagged you yet. When someone writes @' + esc(S.me.name.split(' ')[0]) + ', it shows here.')}</div></section>`;
  }
  const c = chats.find((x) => x.id === openId);
  if (c) {
    const msgs = messagesOf(), fq = ui('chFind', '').toLowerCase(), tab = ui('chTab', 'msgs'), members = chatMembers(c), pins = (c.pins || []).filter((p) => !(clearedOf(c.id)?.p || []).includes(p.id));
    const other = c.kind === 'dm' ? (c.members || []).find((x) => x !== S.me.id) : null, typ = typingIn(c.id);
    let body = '';
    if (tab === 'files') {
      const files = msgs.filter((m) => m.file && !m.deleted).reverse();
      body = files.length ? `<div class="chat-files">${files.map((m) => `<div class="chat-frow">${m.file.voice ? voiceChip(m.file) : fileChip(m.file, m.id)}<div class="tiny muted">${esc(nameOf(m.by))} · ${fmtDT(m.at)}${m.text ? ` · ${esc(m.text.slice(0, 80))}` : ''}</div></div>`).join('')}</div>` : empty('No documents shared in this chat yet. Use the paperclip to share one.');
    } else if (tab === 'pins') {
      body = `<div class="chat-files">${pins.length ? pins.slice().reverse().map((p) => `<button class="pin-row" data-a="chat-jump" data-m="${p.id}"><span class="pin-ico">📌</span><span class="grow" style="min-width:0;text-align:left"><b class="small">${esc(nameOf(p.by))}</b> <span class="tiny muted">${fmtDT(p.at)} · pinned by ${esc(nameOf(p.pinnedBy))}</span><span class="small" style="display:block">${esc(String(p.text || '').replace(/[*_~`]/g, ''))}</span></span></button>`).join('') : empty('Nothing pinned yet. Hover a message and press 📌 to keep it here.')}</div>`;
    } else if (tab === 'members') {
      const admin = isGroupAdmin(c);
      body = `<div style="padding:12px 16px;overflow:auto" class="grid">${members.slice().sort((a, b) => on.has(b) - on.has(a)).map((id) => `<div class="row" style="justify-content:space-between"><span class="row" style="gap:6px">${person(id, empById(id)?.designation || '')}${on.has(id) ? '<span class="pill t-ok">Online</span>' : ''}</span><span class="row" style="gap:6px">${c.kind === 'group' && (c.admins || [c.createdBy]).includes(id) ? '<span class="pill t-acc">Group admin</span>' : ''}${id !== S.me.id ? `<button class="btn sm" data-a="dm" data-id="${id}">Message</button>` : ''}${admin && id !== S.me.id ? `<button class="btn sm ghost" data-a="chat-remove" data-id="${id}">Remove</button>` : ''}</span></div>`).join('')}
        ${admin ? `<form data-f="chat-add" class="row" style="flex-wrap:nowrap;margin-top:8px"><select class="i" id="ch-add" name="emp">${peopleGroups('', { blank: 'Add someone…', exclude: members })}</select><button class="btn">Add</button></form>
          <form data-f="chat-rename" class="row" style="flex-wrap:nowrap"><input class="i" id="ch-ren" name="name" value="${esc(c.name)}"><button class="btn">Rename</button></form>` : ''}
        ${c.kind === 'dept' ? '<p class="tiny muted">Members follow the department on the People page.</p>' : ''}
        ${admin ? '<button class="btn danger" data-a="chat-delete">Delete group</button>' : ''}
        ${c.kind === 'group' ? `<button class="btn danger" data-a="chat-leave">Leave group</button>` : ''}</div>`;
    } else {
      const tagQ = fq.startsWith('#') ? fq.slice(1) : null;
      const shown = msgs.filter((m) => !fq || (tagQ ? (m.tags || tagsOf(m.text || '')).includes(tagQ) : (m.text || '').toLowerCase().includes(fq) || (m.file?.name || '').toLowerCase().includes(fq)));
      let lastDay = '', prev = null, newShown = false;
      const pinned = new Set(pins.map((p) => p.id));
      body = `${pins.length ? `<button class="pinbar" data-a="ui" data-k="chTab" data-v="pins">📌 <b>${pins.length} pinned</b><span class="trunc">${esc(String(pins[pins.length - 1].text || '').replace(/[*_~`]/g, ''))}</span></button>` : ''}${fq ? `<div class="filterbar">Showing ${tagQ ? `messages tagged <b>#${esc(tagQ)}</b>` : `messages with “${esc(fq)}”`} · ${shown.length} <button class="btn sm ghost" data-a="ui" data-k="chFind" data-v="">Clear</button></div>` : ''}
      <div class="chat-msgs" id="chat-msgs">${shown.length ? '' : empty(fq ? 'No messages match.' : 'No messages yet — say hello.')}${shown.map((m) => {
        const d = ymd(new Date(m.at)), mine = m.by === S.me.id;
        const sep = d !== lastDay ? `<div class="chat-day"><span>${d === today() ? 'Today' : d === addDays(today(), -1) ? 'Yesterday' : `${DAYS[dow(d)]}, ${fmtD(d)}`}</span></div>` : '';
        const nw = !newShown && !fq && CH2.seenAt && m.at > CH2.seenAt && !mine ? ((newShown = true), '<div class="newline"><span>New messages</span></div>') : '';
        const cont = !sep && !nw && prev && prev.by === m.by && m.at - prev.at < 5 * 60000 && !m.reply && !prev.deleted;
        lastDay = d; prev = m;
        const meTagged = !mine && ((m.mentions || []).includes(S.me.id) || (m.mentions || []).includes('*'));
        const rxBy = Object.entries(m.reacts || {}).filter(([, e]) => e).reduce((a, [by, e]) => ((a[e] = a[e] || []).push(by), a), {});
        const sys = !m.file && /^(.+) (added|removed|left)( |$)/.test(m.text || '') && (m.text || '').startsWith(nameOf(m.by));
        if (sys) return `${sep}${nw}<div class="msg-sys">${esc(m.text)} · ${hm(m.at)}</div>`;
        return `${sep}${nw}<div class="msg ${mine ? 'mine' : 'theirs'} ${cont ? 'cont' : ''} ${meTagged ? 'hl' : ''} ${pinned.has(m.id) ? 'pinned' : ''}" id="m-${m.id}">
          <div class="msg-av">${cont ? `<span class="msg-t">${hm(m.at)}</span>` : `<span class="av-wrap">${avatar(nameOf(m.by))}${onlineDot(m.by, on)}</span>`}</div>
          <div class="msg-line">
          <div class="msg-body" title="${esc(fmtDT(m.at))}">
            ${cont ? '' : `<div class="msg-h"><b>${esc(nameOf(m.by))}</b>${mine ? '<span class="you">you</span>' : ''}<span class="msg-des tiny muted">${esc(empById(m.by)?.designation || '')}</span><span class="msg-time tiny muted">${hm(m.at)}</span>${pinned.has(m.id) ? '<span class="tiny">📌</span>' : ''}</div>`}
            ${m.deleted ? '<i class="muted small">Message deleted</i>' : `${m.reply ? `<button class="quote" data-a="chat-jump" data-m="${m.reply.id}"><b class="tiny">${esc(nameOf(m.reply.by))}</b><span class="tiny trunc" style="display:block">${esc(m.reply.text)}</span></button>` : ''}${m.file ? (m.file.voice ? voiceChip(m.file) : fileChip(m.file, m.id)) : ''}${m.text ? `<div class="btext">${fmtMsg(m)}${m.edited ? ' <span class="tiny muted">(edited)</span>' : ''}</div>` : ''}`}
            ${Object.keys(rxBy).length ? `<div class="rxs">${Object.entries(rxBy).map(([e, bys]) => `<button class="rxp ${bys.includes(S.me.id) ? 'on' : ''}" data-a="chat-react" data-m="${m.id}" data-e="${e}" title="${esc(bys.map(nameOf).join(', '))}">${e} <b>${bys.length}</b></button>`).join('')}</div>` : ''}
            ${CH2.picker === m.id ? `<div class="rx-picker" role="menu" aria-label="Pick a reaction">${EMOJI.map((e) => `<button data-a="chat-react" data-m="${m.id}" data-e="${e}" role="menuitem" title="React ${e}">${e}</button>`).join('')}</div>` : ''}
          </div>
          ${m.deleted ? '' : `<button class="rx-btn ${CH2.picker === m.id ? 'on' : ''}" data-a="chat-pick" data-m="${m.id}" title="Add reaction" aria-label="Add reaction" aria-haspopup="menu" aria-expanded="${CH2.picker === m.id}">${RX_ICON}</button>`}
          </div>
          ${m.deleted ? '' : `<div class="msg-tools" role="toolbar" aria-label="Message actions"><button data-a="chat-reply" data-m="${m.id}" title="Reply">↩</button><button data-a="chat-pin" data-m="${m.id}" title="${pinned.has(m.id) ? 'Unpin' : 'Pin'}">📌</button>${mine && m.text ? `<button data-a="chat-edit" data-m="${m.id}" title="Edit">✎</button>` : ''}${m.text ? `<button data-a="chat-task" data-m="${m.id}" title="Make a task">☑</button>` : ''}${mine ? `<button data-a="chat-del" data-m="${m.id}" title="Delete">🗑</button>` : ''}</div>`}
        </div>`;
      }).join('')}</div>`;
    }
    const canWrite = !S.readonly && (c.kind !== 'all' || isHR() || !c.hrOnly);
    const ed = CH2.editing;
    main = `<section class="chat-main">
      <header class="chat-head"><button class="btn ghost sm chat-back" data-a="chat-close" aria-label="Back to chats">‹</button>
        <span class="av-wrap">${c.kind === 'dm' ? avatar(c.title) : `<span class="av chav ck-${c.kind}">${c.kind === 'all' ? '★' : c.kind === 'dept' ? '#' : esc(initials(c.title))}</span>`}${other ? onlineDot(other, on) : ''}</span>
        <div class="grow" style="min-width:0"><b class="trunc" style="display:block">${esc(c.title)}</b><span class="tiny ${typ.length ? 'typing-t' : 'muted'}">${typ.length ? `${esc(typ.join(', '))} ${typ.length > 1 ? 'are' : 'is'} typing…` : c.kind === 'dm' ? `${esc(empById(other)?.designation || '')}${on.has(other) ? ' · <span class="on-t">online</span>' : ''}` : `${members.length} members · ${members.filter((x) => on.has(x)).length} online${c.kind === 'dept' ? ' · department' : c.kind === 'all' ? ' · whole company' : ''}`}</span></div>
        <input class="i" id="ch-find" data-i="chFind" placeholder="Search · #tag" value="${esc(ui('chFind', ''))}" style="width:170px">
        <button class="btn ghost sm" data-a="chat-fav" title="${fav.has(c.id) ? 'Unstar' : 'Star'} this chat" aria-pressed="${fav.has(c.id)}">${fav.has(c.id) ? '★' : '☆'}</button>
        ${c.kind === 'dm' ? '<button class="btn ghost sm" data-a="chat-dm-delete" title="Delete this chat for you" aria-label="Delete this chat">🗑</button>' : ''}
      </header>

/* ── @ / # autocomplete ── */
function menCandidates(kind, q) {
  q = q.toLowerCase();
  if (kind === '#') {
    const seen = {}; for (const m of messagesOf()) for (const t of m.tags || tagsOf(m.text || '')) seen[t] = (seen[t] || 0) + 1;
    const base = ['urgent', 'todo', 'decision', 'followup', 'invoice', 'dispatch', 'payment', 'meeting'];
    for (const b of base) seen[b] = seen[b] || 0;
    return Object.entries(seen).filter(([t]) => t.startsWith(q)).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t, n]) => ({ k: '#', v: t, label: '#' + t, sub: n ? `${n} message(s)` : 'new topic' }));
  }
  const c = myChats().find((x) => x.id === CHAT.openId); if (!c) return [];
  const on = onlineIds();
  const ppl = chatMembers(c).filter((id) => id !== S.me.id).map(empById).filter(Boolean).filter((e) => !q || e.name.toLowerCase().split(/\s+/).some((p) => p.startsWith(q)) || e.name.toLowerCase().startsWith(q)).sort((a, b) => on.has(b.id) - on.has(a.id) || a.name.localeCompare(b.name)).slice(0, 7)
    .map((e) => ({ k: '@', v: e.name, id: e.id, label: e.name, sub: `${e.designation || ''}${on.has(e.id) ? ' · online' : ''}` }));
  const extra = c.kind !== 'dm' && 'everyone'.startsWith(q) ? [{ k: '@', v: 'everyone', label: '@everyone', sub: `Notify all ${chatMembers(c).length} members` }] : [];
  return [...ppl, ...extra];
}
function menPopHtml() {
  const p = CH2.pop; if (!p || !p.items.length) return '';
  return p.items.map((it, i) => `<button type="button" class="men-it ${i === p.idx ? 'on' : ''}" data-a="chat-men-pick" data-i="${i}">${it.k === '@' && it.id ? avatar(it.v) : `<span class="av chav ck-ment">${it.k}</span>`}<span class="grow" style="min-width:0"><b class="small">${esc(it.label)}</b><span class="tiny muted" style="display:block">${esc(it.sub)}</span></span></button>`).join('');
}
function menUpdate(ta) {
  const pos = ta.selectionStart, before = ta.value.slice(0, pos), mm = before.match(/(^|\s)([@#])([\w.-]*)$/);
  if (!mm) { if (CH2.pop) { CH2.pop = null; menPaint(); } return; }
  const items = menCandidates(mm[2], mm[3]);
  CH2.pop = items.length ? { kind: mm[2], start: pos - mm[3].length - 1, items, idx: Math.min(CH2.pop?.idx || 0, items.length - 1) } : null;

}

/* ── group admin: the person who creates a group can rename it, change members and delete it ── */
const isGroupAdmin = (c) => !!c && c.kind === 'group' && (c.admins || [c.createdBy]).includes(S.me.id);
function groupDeleteAsk() {
  const c = myChats().find((x) => x.id === CHAT.openId);
  if (!isGroupAdmin(c)) return toast('Only the group admin can delete this group.', 'warn');

}
async function groupDelete(c) {
  await act(async () => {
    // Files and messages go first: the server only lets the admin delete them while the group still exists.
    const snap = await S.db.collection(`chat/${c.id}/b`).get();
    for (const b of docsOf(snap)) {
      for (const m of b.msgs || []) if (m.file?.fid) for (let i = 0; i < (m.file.chunks || 0); i++) await docRef(`blob/${m.file.fid}_${i}`).delete();
      await docRef(`chat/${c.id}/b/${b.id}`).delete();
