    <button class="me" data-a="acct" title="My account, password and email alerts">${avatar(S.me.name)}<div style="min-width:0;text-align:left"><div class="trunc small" style="font-weight:600">${esc(S.me.name)}</div><div class="tiny rail-muted">${esc(S.me.designation || '')} · ${cap(S.me.role)}</div></div><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="margin-left:auto;opacity:.7"><path d="M10 17l5-5-5-5"/></svg></button>
  </nav>
  <main class="main" id="main" style="--sec:var(--c-${SEC[S.view] || 'teal'})">
    ${S.readonly ? '<div class="alert t-warn" style="margin-bottom:12px;cursor:default">You have view-only access. Ask the app owner to share it with you as a Contributor so you can check in, apply for leave and update tasks.</div>' : ''}
    <div class="topbar"><div class="tb-title"><span class="sec-ico">${ico(S.view)}</span><div style="min-width:0"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>
      <div class="row tb-actions">${actions}<button class="btn searchbtn" data-a="cmdk-open" aria-label="Search (Ctrl K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg><span class="hide-sm">Search</span><kbd class="hide-sm">Ctrl K</kbd></button><button class="btn bell" data-a="ntf" aria-label="Notifications${unread ? ` (${unread} unread)` : ''}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="hide-sm">Alerts</span>${unread ? `<span class="dot">${unread}</span>` : ''}</button></div></div>
    ${content}
  </main>
  <nav class="tabbar" aria-label="Main (mobile)">${MOBILE_NAV.filter((k) => vis.has(k)).map((k) => `<button class="tb" data-a="nav" data-v="${k}" ${S.view === k && !more ? 'aria-current="page"' : ''}>${ico(k)}<span>${k === 'dashboard' ? 'Home' : vis.get(k)}</span>${badge(k)}</button>`).join('')}<button class="tb" data-a="ui" data-k="moreOpen" data-v="${more ? '' : '1'}" ${more || (!MOBILE_NAV.includes(S.view)) ? 'aria-current="page"' : ''}>${ico('more')}<span>More</span>${chatUnread && !MOBILE_NAV.includes('chats') ? '<span class="ct ct-acc">•</span>' : ''}</button></nav>
  ${more ? `<div class="sheet-bg" data-a="ui" data-k="moreOpen" data-v=""></div><div class="sheet" role="dialog" aria-label="All sections"><div class="sheet-me">${avatar(S.me.name)}<div style="flex:1"><b>${esc(S.me.name)}</b><div class="tiny muted">${esc(S.me.designation || '')} · ${cap(S.me.role)}</div></div><button class="btn sm" data-a="acct">My account</button></div>${NAV_GROUPS.map(([g, ks]) => { const items = ks.filter((k) => vis.has(k)); return items.length ? `<div class="nav-g">${g}</div><div class="sheet-grid">${items.map((k) => `<button class="sg" style="--nc:var(--c-${SEC[k]})" data-a="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${ico(k)}<span>${vis.get(k)}</span>${badge(k)}</button>`).join('')}</div>` : ''; }).join('')}</div>` : ''}
  </div>`;
}

/* ═════════════ Dashboard ═════════════ */
function vDashboard() {
  const T = today(), me = S.me, ids = scope(), mgmt = isMgmt(), team = myTeam();
  const mode = mgmt ? 'Whole office' : team.length ? `You and your team (${team.length})` : 'Your work';
  const ppl = ids.map(empById).filter((e) => e && (!e.joining || e.joining <= T));
  const st = ppl.map((e) => ({ e, s: dayStatus(e, T) }));
  const expected = st.filter((x) => !['WO', 'H', ''].includes(x.s.code));
  const c = (codes) => st.filter((x) => codes.includes(x.s.code)).length;
  const present = c(['P', 'L', 'HD']), late = st.filter((x) => x.s.lateMin).length, leave = c(['LV']), remote = ppl.filter((e) => remoteOn(e.id, T) && !leaveOn(e.id, T)).length, notIn = c(['NI']), absent = c(['A']);
  const sh = cfg().shift, afterEnd = minOfDay(Date.now()) > toMin(sh.end) + 30;
  const noLogoff = afterEnd ? st.filter((x) => x.s.punches?.length === 1).length : 0;
  const tasks = S.tasks.filter((t) => ids.includes(t.assigneeId));
  const open = tasks.filter(openTask), dueToday = open.filter((t) => t.due === T), od = open.filter((t) => overdue(t)), blocked = open.filter((t) => t.status === 'BLOCKED');
  const doneToday = tasks.filter((t) => t.status === 'DONE' && t.completedAt && ymd(new Date(t.completedAt)) === T).length;
  const inbox = myInbox(), sla = S.reqs.filter((r) => pastSLA(r) && (ids.includes(r.empId) || curStep(r)?.by === me.id));
  const mine = S.tasks.filter((t) => t.assigneeId === me.id && openTask(t)).sort(taskSort);
  const byMe = S.tasks.filter((t) => t.assignerId === me.id && t.assigneeId !== me.id && openTask(t)).sort(taskSort);
  const drOpen = S.dreqs.filter((r) => !['RESOLVED', 'CLOSED'].includes(r.status) && (mgmt || r.ownerId === me.id || r.byId === me.id || r.toDept === me.deptId || r.fromDept === me.deptId));
  let prev = addDays(T, -1); for (let i = 0; i < 6 && !workingDay(prev); i++) prev = addDays(prev, -1);
  const logged = new Set(S.wlogs.filter((w) => w.date === prev).map((w) => w.empId));
  const noLog = ppl.filter((e) => e.id !== me.id && presentish(dayStatus(e, prev).code) && !logged.has(e.id));
  const incomplete = [];
  for (let i = 1; i <= 7; i++) { const d = addDays(T, -i); ppl.forEach((e) => { if (dayStatus(e, d).code === 'I') incomplete.push({ e, d }); }); }
  const myS = dayStatus(me, T), myP = punchesOn(me.id, T);

  const alerts = [];
  const crit = od.filter((t) => t.priority === 'CRITICAL');
  if (crit.length) alerts.push(['bad', `${crit.length} critical task(s) overdue`, 'tasks:overdue']);
  if (sla.length) alerts.push(['bad', `${sla.length} approval(s) waiting longer than ${cfg().slaHours} h`, 'approvals:team']);
  if (blocked.length) alerts.push(['warn', `${blocked.length} task(s) blocked`, 'tasks:blocked']);
  const drLate = drOpen.filter((r) => r.due < T);
  if (drLate.length) alerts.push(['warn', `${drLate.length} cross-department request(s) past their date`, 'departments']);
  if (ids.length > 1 && incomplete.length) alerts.push(['', `${incomplete.length} missing check-out(s) in the last 7 days`, 'attendance:register']);
  if (ids.length > 1 && noLog.length) alerts.push(['', `${noLog.length} work log(s) not submitted for ${fmtDs(prev)}`, 'worklog:team']);
  if (cfg().attSource === 'device' && isHR() && (!cfg().importedThrough || cfg().importedThrough < addDays(T, -2))) alerts.push(['warn', `Machine attendance imported only up to ${cfg().importedThrough ? fmtD(cfg().importedThrough) : 'never'}`, 'attendance:import']);
  { const nl = locAlertCount(ids, T); if (ids.length > 1 && nl) alerts.push(['warn', `${nl} on WFH / official duty today haven’t shared their location`, 'attendance:today']); }
  if (ids.length > 2 && late >= 3) alerts.push(['', `${late} late arrival(s) today`, 'attendance:today']);

  const events = [];
  const win = eachDay(T, addDays(T, 30));
  for (const e of ppl) {
    const b = e.dob && win.find((d) => d.slice(5) === e.dob.slice(5)); if (b) events.push([b, `${e.name} — birthday`]);
    const a = e.joining && e.joining < addDays(T, -300) && win.find((d) => d.slice(5) === e.joining.slice(5)); if (a) events.push([a, `${e.name} — ${+a.slice(0, 4) - +e.joining.slice(0, 4)} yr work anniversary`]);
    if (e.status === 'PROBATION' && e.probEnd && e.probEnd <= addDays(T, 30)) events.push([e.probEnd, `${e.name} — probation ends`]);
    if (e.status === 'ON_NOTICE' && e.exitDate) events.push([e.exitDate, `${e.name} — last working day`]);
  }
  cfg().holidays.filter((h) => h.date >= T && h.date <= addDays(T, 60)).forEach((h) => events.push([h.date, `${h.name}${h.optional ? ' (optional)' : ''}`]));
  events.sort((a, b) => a[0].localeCompare(b[0]));
  const anns = (cfg().announcements || []).filter((a) => !a.until || a.until >= T).slice(-3).reverse();
  const deptStr = cfg().depts.map((d) => { const m = st.filter((x) => x.e.deptId === d.id); return [d, m.length, m.filter((x) => presentish(x.s.code)).length, m.filter((x) => x.s.code === 'LV').length]; }).filter((x) => x[1]);
  const h = new Date().getHours();

  const taskLi = (t, who) => `<li class="pri-${t.priority}" data-a="task" data-id="${t.id}" style="cursor:pointer"><div class="grow"><div class="trunc">${esc(t.title)}</div><div class="tiny muted">${esc(t.code)}${who ? ' · ' + esc(nameOf(t.assigneeId)) : ' · from ' + esc(nameOf(t.assignerId))}</div></div>${pill(TSTAT, effStatus(t))}<span class="tiny ${overdue(t) ? '' : 'muted'}" style="white-space:nowrap;${overdue(t) ? 'color:var(--bad);font-weight:600' : ''}">${overdue(t) ? 'Overdue · ' : 'Due '}${fmtDs(t.due)}</span></li>`;
  const office = ids.length > 1;
  const myDue = mine.filter((t) => t.due === T).length, myOd = mine.filter((t) => overdue(t)).length;
  const wl7 = []; for (let i = 6; i >= 0; i--) wl7.push(addDays(T, -i));
  const wlT = wlState(me, T), wlY = wlState(me, prev);
  const wlMsg = wlT === 'ok' || wlT === 'late' ? ['Today’s log submitted', 'ok'] : wlY === 'miss' ? [`${fmtDs(prev)} log missing`, 'bad'] : wlT === 'due' ? ['Today’s log not yet submitted', 'warn'] : ['Nothing due today', ''];

  /* 1 — your day */
  const seg = (label, inner) => `<div class="day-seg"><div class="sec-l">${label}</div>${inner}</div>`;
  const yourDay = `<section class="card dayband">
    ${seg('Attendance', `<div class="row" style="justify-content:space-between;gap:6px">${myS.code ? stPill(myS.code, myS.note) : '<span class="pill">Non-working day</span>'}<span class="small">In <b>${hm(myS.inT)}</b> · Out <b>${hm(myS.outT)}</b></span></div>
      ${myS.lateMin ? `<div class="tiny" style="color:var(--warn);margin-top:4px">Late by ${mins(myS.lateMin)}</div>` : ''}
      <div class="row" style="margin-top:10px;gap:6px">${cfg().webPunch && !S.readonly ? `<button class="btn pri sm" data-a="punch">${myP.length % 2 === 0 ? 'Check in' : 'Check out'}</button>` : ''}<button class="btn sm" data-a="new-req" data-t="CORRECTION">Fix attendance</button></div>
      ${myLocStrip()}`)}
    ${seg('Work log', `<div class="small"><span class="dot-s ${wlMsg[1] ? 'd-' + wlMsg[1] : ''}"></span>${wlMsg[0]}</div>
      <div class="wl7" aria-label="Last 7 days">${wl7.map((d) => { const k = wlState(me, d); return `<button class="wl7-d wc-${k || 'none'}" data-a="wl-day" data-d="${d}" title="${fmtD(d)} · ${WLSTATE[k]?.[0] || 'No log needed'}"><span>${DAYS[dow(d)][0]}</span></button>`; }).join('')}</div>
      <button class="btn sm" style="margin-top:8px" data-a="wl-day" data-d="${wlY === 'miss' && wlT !== 'due' ? prev : T}">${wlT === 'ok' || wlT === 'late' ? 'Update today’s log' : 'Fill work log'}</button>`)}
    ${seg('My tasks', `<div class="mini-kpis"><button data-a="go" data-go="tasks:mine"><b>${mine.length}</b><span>Open</span></button><button data-a="go" data-go="tasks:mine-today"><b>${myDue}</b><span>Due today</span></button><button data-a="go" data-go="tasks:mine-overdue"><b class="${myOd ? 'bad' : ''}">${myOd}</b><span>Overdue</span></button></div>`)}
    ${seg('Approvals', `<div class="mini-kpis"><button data-a="go" data-go="approvals"><b class="${inbox.length ? 'warn' : ''}">${inbox.length}</b><span>Waiting for me</span></button><button data-a="go" data-go="approvals:team"><b class="${sla.length ? 'bad' : ''}">${sla.length}</b><span>Past ${cfg().slaHours} h</span></button><button data-a="go" data-go="chats"><b>${unreadCount()}</b><span>Unread chats</span></button></div>`)}
  </section>`;

  const myLists = `<div class="dgrid">
    ${card(`My tasks <span class="count">${mine.length}</span>`, mine.length ? `<ul class="list">${mine.slice(0, 6).map((t) => taskLi(t)).join('')}</ul>${mine.length > 6 ? `<div class="more"><button class="btn sm ghost" data-a="go" data-go="tasks:mine">See all ${mine.length}</button></div>` : ''}` : empty('No open tasks assigned to you.'), { list: true, cls: 'span2', actions: '<button class="btn sm ghost" data-a="go" data-go="tasks:mine-board">Board</button>' })}
    ${card(`Waiting for my decision <span class="count">${inbox.length}</span>`, inbox.length ? `<ul class="list">${inbox.slice(0, 6).map((r) => `<li data-a="req" data-id="${r.id}" style="cursor:pointer"><div class="grow"><div class="trunc">${esc(r.title)}</div><div class="tiny muted">${esc(nameOf(r.empId))} · ${RTYPE[r.type]}</div></div>${pastSLA(r) ? '<span class="pill t-bad">Late</span>' : ''}</li>`).join('')}</ul>${inbox.length > 6 ? `<div class="more"><button class="btn sm ghost" data-a="go" data-go="approvals">See all ${inbox.length}</button></div>` : ''}` : empty('Nothing waiting for you.'), { list: true })}
  </div>`;

  /* 2 — office / team overview */
  let overview = '';
  if (office) {
    const strip = [['Present', `${present}<small>/${expected.length}</small>`, 'ok', 'attendance:today'], ['Absent', absent, absent ? 'bad' : '', 'attendance:today'], ['Not in yet', notIn, '', 'attendance:today'], ['Late', late, late ? 'warn' : '', 'attendance:today'],
      ['On leave', leave, '', 'attendance:today'], ['WFH / OD', remote, '', 'attendance:today'], ['Overdue tasks', od.length, od.length ? 'bad' : '', 'tasks:overdue'], ['Blocked', blocked.length, blocked.length ? 'bad' : '', 'tasks:blocked']];
    const ftab = ui('dashTab', 'attention');
    const tabs = [['attention', 'Attention', alerts.length], ['byme', 'Assigned by me', byMe.length], ['blocked', 'Blocked', blocked.length + drOpen.length], ['nolog', `No log · ${fmtDs(prev)}`, noLog.length], ['noout', 'No check-out', incomplete.length]];
    const panel = {
      attention: alerts.length ? `<div class="body grid" style="gap:8px">${alerts.map(([t, txt, go]) => `<button class="alert ${t ? 't-' + t : ''}" style="${t ? '' : 'background:var(--sunk)'}" data-a="go" data-go="${go}">${esc(txt)}<span style="margin-left:auto">›</span></button>`).join('')}</div>` : `<div class="body">${empty('No exceptions — all clear.')}</div>`,
      byme: byMe.length ? `<ul class="list">${byMe.slice(0, 8).map((t) => taskLi(t, true)).join('')}</ul>` : `<div class="body">${empty('You have no open tasks assigned to others.')}</div>`,
      blocked: (blocked.length + drOpen.length) ? `<ul class="list">${blocked.slice(0, 5).map((t) => `<li data-a="task" data-id="${t.id}" style="cursor:pointer"><div class="grow"><div class="trunc">${esc(t.code)} · ${esc(t.title)}</div><div class="tiny" style="color:var(--bad)">${esc(t.blockedReason || '')} · ${esc(nameOf(t.assigneeId))}</div></div>${pill(TSTAT, 'BLOCKED')}</li>`).join('')}${drOpen.slice(0, 5).map((r) => `<li data-a="dreq" data-id="${r.id}" style="cursor:pointer"><div class="grow"><div class="trunc">${esc(r.code)} · ${esc(r.title)}</div><div class="tiny muted">${esc(deptOf(r.fromDept)?.code)} → ${esc(deptOf(r.toDept)?.code)} · due ${fmtDs(r.due)}</div></div>${pill(DRSTAT, r.status)}</li>`).join('')}</ul>` : `<div class="body">${empty('Nothing blocked.')}</div>`,
      nolog: noLog.length ? `<ul class="list cols2">${noLog.slice(0, 12).map((e) => `<li>${person(e.id, deptOf(e.deptId)?.name)}</li>`).join('')}</ul>${noLog.length > 12 ? `<div class="more"><button class="btn sm ghost" data-a="go" data-go="worklog:team">See all ${noLog.length}</button></div>` : ''}` : `<div class="body">${empty('Everyone who worked submitted a log.')}</div>`,
      noout: incomplete.length ? `<ul class="list cols2">${incomplete.slice(0, 12).map(({ e, d }) => `<li>${person(e.id, fmtD(d))}</li>`).join('')}</ul>` : `<div class="body">${empty('No missing punches.')}</div>`,
    }[ftab];
    overview = `<h2 class="sec-h">${mgmt ? 'Office today' : 'My team today'} <span class="muted">· ${esc(mode)}</span></h2>
    <div class="kstrip">${strip.map(([l, v, tone, go]) => `<button class="kt" data-a="go" data-go="${go}"><span class="l">${l}</span><span class="v ${tone}">${v}</span></button>`).join('')}</div>
    <div class="dgrid">
      <section class="card span2"><div class="tabs card-tabs" role="tablist">${tabs.map(([k, l, n]) => `<button class="tab" role="tab" aria-selected="${ftab === k}" data-a="ui" data-k="dashTab" data-v="${k}">${esc(l)}${n ? ` <span class="count">${n}</span>` : ''}</button>`).join('')}</div>${panel}</section>
      ${card('Attendance by department', `<div class="grid" style="gap:10px">${deptStr.map(([d, n, p, l]) => `<div><div class="row small" style="justify-content:space-between"><span>${esc(d.name)}</span><span><b>${p}</b><span class="muted">/${n}</span>${l ? ` <span class="tiny muted">· ${l} on leave</span>` : ''}</span></div><div class="bar"><span style="width:${n ? Math.round((p / n) * 100) : 0}%"></span></div></div>`).join('')}</div>`)}
    </div>`;
  } else if (byMe.length) {
    overview = `<div class="dgrid">${card(`Assigned by me <span class="count">${byMe.length}</span>`, `<ul class="list">${byMe.slice(0, 6).map((t) => taskLi(t, true)).join('')}</ul>`, { list: true, cls: 'span2' })}</div>`;
  }

  /* 3 — company */
  const company = (events.length || anns.length) ? `<h2 class="sec-h">Around the company</h2><div class="dgrid">
    ${anns.length ? card('Announcements', `<ul class="list">${anns.map((a) => `<li style="display:block"><b>${esc(a.title)}</b><div class="small muted">${esc(a.body)}</div></li>`).join('')}</ul>`, { list: true, cls: events.length ? '' : 'span3' }) : ''}
    ${events.length ? card('Coming up · 30 days', `<ul class="list cols2">${events.slice(0, 8).map(([d, l]) => `<li><span class="date-chip"><b>${+d.slice(8)}</b>${MON[+d.slice(5, 7) - 1]}</span><span class="grow trunc">${esc(l)}</span></li>`).join('')}</ul>`, { list: true, cls: anns.length ? 'span2' : 'span3' }) : ''}
  </div>` : '';

  const actions = `<button class="btn pri" data-a="new-task">+ Task</button><button class="btn" data-a="apply-leave">Apply leave</button><button class="btn" data-a="claim-new">Claim expense</button><button class="btn hide-sm" data-a="new-req">Raise request</button>`;
  const body = `${yourDay}${myLists}${overview}${company}`;
  return shell(body, `Good ${h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'}, ${esc(me.name.split(' ')[0])}`, `${DAYS[dow(T)]}, ${fmtD(T)}`, actions);
}

/* ═════════════ Attendance ═════════════ */
function vAttendance() {
  const mgr = isManager(), tab = ui('attTab', mgr ? 'today' : 'mine');
  const tabs = [['today', 'Daily board', mgr], ['mine', 'My attendance', true], ['register', 'Monthly register', mgr], ['salary', 'Salary sheet', canSalary()], ['import', 'Import machine report', isHR()]].filter((t) => t[2]);
  let body = `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${tab === k}" data-a="ui" data-k="attTab" data-v="${k}">${l}</button>`).join('')}</div>`;
  const T = today();
  if (tab === 'mine') body += monthView(S.me, ui('attMonth', T.slice(0, 7)));
  if (tab === 'salary') body += canSalary() ? vSalary() : '';
  if (tab === 'today') {
    const d = ui('attDate', T), dept = ui('attDept', '');
    const rows = scope().map(empById).filter((e) => e && (!dept || e.deptId === dept)).sort((a, b) => a.name.localeCompare(b.name)).map((e) => ({ e, s: dayStatus(e, d) }));
    const counts = rows.reduce((m, r) => ((m[r.s.code] = (m[r.s.code] || 0) + 1), m), {});
    body += `<div class="filters"><input type="date" class="i" id="att-date" data-c="attDate" value="${d}"><select class="i" id="att-dept" data-c="attDept">${deptOpts(dept, 'All departments')}</select>
      <button class="btn" data-a="ui" data-k="attDate" data-v="${addDays(d, -1)}">‹ Previous day</button><button class="btn" data-a="ui" data-k="attDate" data-v="${addDays(d, 1)}">Next day ›</button></div>
      <div class="row" style="margin-bottom:10px">${Object.entries(counts).map(([k, n]) => `${stPill(k)}<b class="small">${n}</b>`).join(' ')}</div>
      ${card(`${DAYS[dow(d)]} ${fmtD(d)}`, `<div class="tbl-wrap"><table class="t"><thead><tr><th>Employee</th><th>Status</th><th>First in</th><th>Last out</th><th class="num">Worked</th><th class="num">Late</th><th>Location</th><th>Notes</th></tr></thead><tbody>
        ${rows.map(({ e, s }) => `<tr><td>${person(e.id, `${e.code || ''} · ${deptOf(e.deptId)?.name || ''}`)}</td><td>${stPill(s.code, s.note)}</td><td>${hm(s.inT)}</td><td>${hm(s.outT)}</td><td class="num">${mins(s.work)}</td><td class="num">${s.lateMin ? s.lateMin + 'm' : ''}</td><td>${locCell(e.id, d)}</td><td class="small muted">${esc(s.note)}</td></tr>`).join('')}
      </tbody></table></div>`, { list: true, actions: `<button class="btn sm" data-a="export-att-day">Export</button>` })}`;
  }
  if (tab === 'register') {
    const m = ui('regMonth', T.slice(0, 7)), dept = ui('attDept', ''), days = eachDay(m + '-01', monthEnd(m));
    const ppl = scope().map(empById).filter((e) => e && (!dept || e.deptId === dept)).sort((a, b) => a.name.localeCompare(b.name));
    body += `<div class="filters"><input type="month" class="i" id="reg-month" data-c="regMonth" value="${m}"><select class="i" id="att-dept2" data-c="attDept">${deptOpts(dept, 'All departments')}</select><button class="btn" data-a="export-register">Export month</button></div>
    ${card(fmtM(m), `<div class="tbl-wrap"><table class="reg"><thead><tr><th class="n" style="text-align:left">Employee</th>${days.map((d) => `<th class="tiny muted">${+d.slice(8)}<br>${DAYS[dow(d)][0]}</th>`).join('')}<th>P</th><th>L</th><th>A</th><th>LV</th></tr></thead><tbody>
      ${ppl.map((e) => { const ss = days.map((d) => dayStatus(e, d)); const c = (k) => ss.filter((s) => k.includes(s.code)).length;
        return `<tr><td class="n">${esc(e.name)}</td>${ss.map((s, i) => `<td>${s.code ? `<span class="code c-${s.code}" title="${esc(fmtD(days[i]) + ' · ' + (STATUS[s.code]?.[0] || '') + (s.inT ? ' · ' + hm(s.inT) + '–' + hm(s.outT) : ''))}">${s.code === 'NI' ? '·' : s.code}</span>` : ''}</td>`).join('')}
        <td><b>${c(['P', 'L', 'WFH', 'OD']) + c(['HD']) / 2}</b></td><td>${ss.filter((s) => s.lateMin).length}</td><td style="color:var(--bad)">${c(['A'])}</td><td>${c(['LV'])}</td></tr>`; }).join('')}
    </tbody></table></div><div class="row tiny muted" style="padding:10px 16px">${Object.entries(STATUS).filter(([k]) => k).map(([k, v]) => `<span><span class="code c-${k}">${k}</span> ${v[0]}</span>`).join(' ')}</div>`, { list: true })}`;
  }
  if (tab === 'import') {
    const imp = S.ui.import;
    body += `<div class="grid g2">${card('Upload the attendance report', `
      <p class="small">Export the punch log from your machine software (eSSL eTimeTrackLite, ZKTeco, Realtime, Matrix…) as Excel or CSV, then upload it here. Each row needs an employee ID — matched to the <b>Biometric ID</b> or <b>Employee code</b> on the People page — and either a date-time column, a date + time column, or date + in-time + out-time columns.</p>
      <input type="file" class="i" id="imp-file" accept=".xlsx,.xls,.csv" data-c="importFile">
      <p class="tiny muted" style="margin-top:8px">Duplicate punches are skipped automatically, so re-uploading an overlapping report is safe.</p>`)}
      ${card('Preview', imp ? (imp.error ? `<p style="color:var(--bad)">${esc(imp.error)}</p>` : `
        <div class="kv"><div><span>Punches matched</span><b>${imp.punches.length}</b></div><div><span>Employees</span><b>${new Set(imp.punches.map((p) => p.emp.id)).size}</b></div>
        <div><span>Unknown IDs</span><b>${imp.unknown.length}</b></div><div><span>Unreadable rows</span><b>${imp.bad}</b></div></div>
        ${imp.unknown.length ? `<p class="tiny muted">Not matched: ${esc(imp.unknown.slice(0, 20).join(', '))}${imp.unknown.length > 20 ? '…' : ''} — add these IDs to the employees’ profiles and upload again.</p>` : ''}
        <p class="tiny muted">Columns used: ${esc(Object.values(imp.cols).filter(Boolean).join(', '))}</p>
        <button class="btn pri" data-a="do-import" ${imp.punches.length ? '' : 'disabled'}>Import ${imp.punches.length} punches</button>`) : empty('Choose a file to see what will be imported.'))}
      ${card('Attendance source', `<p class="small">Currently: <b>${cfg().attSource === 'device' ? 'biometric machine report' : 'web check-in'}</b>. Machine data imported up to <b>${fmtD(cfg().importedThrough)}</b>.</p><p class="tiny muted">In machine mode, days after the last import show “Pending import” instead of absent. Change the source in Settings.</p>`)}</div>`;
  }
  return shell(body, 'Attendance', `Shift ${cfg().shift.start}–${cfg().shift.end}, ${cfg().shift.grace} min grace`, `${remoteOn(S.me.id, T) || lastPing(locOf(S.me.id, T)) ? '<button class="btn" data-a="loc-share">Share my location</button>' : ''}<button class="btn" data-a="new-req" data-t="CORRECTION">Correction</button><button class="btn" data-a="new-req" data-t="WFH_OD">WFH / OD</button>`);
}
function monthView(emp, m) {
  const days = eachDay(m + '-01', monthEnd(m)), padN = (dow(m + '-01') + 6) % 7;
  const ss = days.map((d) => [d, dayStatus(emp, d)]);
  const c = (k) => ss.filter(([, s]) => k.includes(s.code)).length;
  const prevM = addDays(m + '-01', -1).slice(0, 7), nextM = addDays(monthEnd(m), 1).slice(0, 7);
  return `<div class="grid g3">${card(fmtM(m), `<div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="dh">${d}</div>`).join('')}${'<div></div>'.repeat(padN)}
    ${ss.map(([d, s]) => `<div class="dc ${s.code ? 'c-' + s.code : ''}" style="${d === today() ? 'outline:2px solid var(--accent)' : ''}"><b>${+d.slice(8)}</b> ${s.code && s.code !== 'NI' ? s.code : ''}${s.inT ? `<div>${hm(s.inT)}–${hm(s.outT)}</div>` : ''}${s.code === 'I' ? `<button class="btn sm ghost" style="padding:0" data-a="new-req" data-t="CORRECTION" data-d="${d}">Fix</button>` : ''}</div>`).join('')}</div>`,
    { cls: 'span2', actions: `<button class="btn sm" data-a="ui" data-k="attMonth" data-v="${prevM}">‹</button><button class="btn sm" data-a="ui" data-k="attMonth" data-v="${nextM}">›</button>` })}
    ${card('Summary', `<div class="kv" style="grid-template-columns:1fr">${[['Present', c(['P', 'L'])], ['Late marks', ss.filter(([, s]) => s.lateMin).length], ['Half days', c(['HD'])], ['WFH / OD', c(['WFH', 'OD'])], ['On leave', c(['LV'])], ['Absent', c(['A'])], ['Missing check-out', c(['I'])], ['Hours worked', mins(ss.reduce((a, [, s]) => a + s.work, 0))]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`)}</div>`;
}

/* ═════════════ Leave ═════════════ */
function vLeave() {
  const T = today(), year = +T.slice(0, 4), bals = balances(S.me, year);
  const mine = reqsOf('LEAVE', S.me.id).sort((a, b) => b.data.from.localeCompare(a.data.from));
  const m = ui('lvMonth', T.slice(0, 7)), days = eachDay(m + '-01', monthEnd(m));
  const ppl = (isMgmt() ? active() : [S.me, ...myTeam().map(empById), empById(S.me.managerId)].filter(Boolean)).sort((a, b) => a.name.localeCompare(b.name));
  const body = `<div class="grid g3" style="margin-bottom:14px">${bals.map((b) => card(esc(b.lt.name), `<div style="font:600 2rem var(--f-display)">${b.lt.quota ? b.avail : '—'} <span class="small muted" style="font-family:var(--f-body)">${b.lt.quota ? 'days available' : 'unpaid, no balance'}</span></div>
    <div class="kv" style="margin-top:6px"><div><span>Credited</span><b>${b.entitled}</b></div><div><span>Used</span><b>${b.used}</b></div><div><span>Pending</span><b>${b.pending}</b></div><div><span>Code</span><b>${esc(b.lt.code)}</b></div></div>
    ${b.lt.accrual ? `<p class="tiny muted" style="margin:6px 0 0">Earns ${round2(b.lt.quota / 12)} per month</p>` : ''}`)).join('')}</div>
  <div class="grid" style="margin-bottom:14px">${card('My leave applications', mine.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Type</th><th>Dates</th><th class="num">Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>
    ${mine.map((r) => `<tr><td><span class="pill">${esc(r.data.lt)}</span></td><td>${fmtD(r.data.from)}${r.data.to !== r.data.from ? ' – ' + fmtD(r.data.to) : ''}${r.data.half ? ' (½)' : ''}</td><td class="num">${r.data.days}</td><td class="small muted">${esc(r.data.reason)}</td>
    <td>${r.data.cancelled ? '<span class="pill">Cancelled</span>' : pill(RSTAT, r.status)}</td><td class="row">${r.status === 'PENDING' || r.status === 'RETURNED' ? `<button class="btn sm" data-a="req" data-id="${r.id}">Open</button>` : ''}${r.status === 'APPROVED' && !r.data.cancelled && r.data.to >= T && !r.data.cancelOf ? `<button class="btn sm" data-a="cancel-leave" data-id="${r.id}">Request cancellation</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>` : empty('No leave applications yet.'), { list: true, actions: '<button class="btn pri sm" data-a="apply-leave">Apply for leave</button>' })}</div>
  ${card(`Team leave calendar · ${fmtM(m)}`, `<div class="tbl-wrap"><table class="reg"><thead><tr><th class="n" style="text-align:left">Employee</th>${days.map((d) => `<th class="tiny muted">${+d.slice(8)}<br>${DAYS[dow(d)][0]}</th>`).join('')}</tr></thead><tbody>
    ${ppl.map((e) => `<tr><td class="n">${esc(e.name)}</td>${days.map((d) => { const r = reqsOf('LEAVE', e.id).find((x) => ['APPROVED', 'PENDING'].includes(x.status) && !x.data.cancelled && !x.data.cancelOf && x.data.from <= d && x.data.to >= d); const off = !workingDay(d);
      return `<td style="${off ? 'background:var(--sunk)' : ''}">${r && !off ? `<span class="code ${r.status === 'APPROVED' ? 'c-LV' : ''}" style="${r.status === 'PENDING' ? 'border:1px dashed var(--vio);color:var(--vio)' : ''}" title="${esc(r.data.lt + ' · ' + r.status.toLowerCase())}">${esc(r.data.lt[0])}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div><p class="tiny muted" style="padding:8px 16px">Solid = approved, dashed = pending. Grey columns are weekly offs and holidays.</p>`, { list: true, actions: `<button class="btn sm" data-a="ui" data-k="lvMonth" data-v="${addDays(m + '-01', -1).slice(0, 7)}">‹</button><button class="btn sm" data-a="ui" data-k="lvMonth" data-v="${addDays(monthEnd(m), 1).slice(0, 7)}">›</button>` })}`;
  return shell(body, 'Leave — CL / SL', `Balances for ${year}. Approved leave updates attendance automatically.`, '<button class="btn pri" data-a="apply-leave">Apply for leave</button>');
}

/* ═════════════ Tasks ═════════════ */
function vTasks() {
  const team = myTeam(), mgmt = isMgmt();
  const sc = ui('tScope', mgmt ? 'all' : team.length ? 'team' : 'mine'), view = ui('tView', 'list');
  const st = ui('tStatus', 'OPEN'), pr = ui('tPrio', ''), q = ui('tQ', '').toLowerCase(), dept = ui('tDept', ''), who = ui('tWho', '');
  let list = S.tasks.filter((t) => t.code);
  if (sc === 'mine') list = list.filter((t) => t.assigneeId === S.me.id);
  else if (sc === 'assigned') list = list.filter((t) => t.assignerId === S.me.id);
  else if (sc === 'team') list = list.filter((t) => [S.me.id, ...team].includes(t.assigneeId));
  else if (!mgmt) list = list.filter((t) => canSee(t.assigneeId) || t.assignerId === S.me.id);
  if (view === 'board') list = list.filter((t) => openTask(t) || (t.completedAt && Date.now() - t.completedAt < 7 * 86400000));
  else if (st === 'OPEN') list = list.filter(openTask);
  else if (st === 'OVERDUE') list = list.filter((t) => overdue(t));
  else if (st === 'TODAY') list = list.filter((t) => openTask(t) && t.due === today());
  else if (st) list = list.filter((t) => effStatus(t) === st);
  if (pr) list = list.filter((t) => t.priority === pr);
  if (dept) list = list.filter((t) => t.deptId === dept);
  if (who) list = list.filter((t) => t.assigneeId === who);
  if (q) list = list.filter((t) => `${t.code} ${t.title} ${t.project || ''} ${t.desc || ''}`.toLowerCase().includes(q));
  list.sort(taskSort);
  const scopes = [['mine', 'My tasks'], ['assigned', 'Assigned by me'], ...(team.length && !mgmt ? [['team', 'My team']] : []), ...(mgmt ? [['all', 'All tasks']] : [])];
  let body = `<div class="tabs">${scopes.map(([k, l]) => `<button class="tab" aria-selected="${sc === k}" data-a="ui" data-k="tScope" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="filters">
    <input class="i" id="t-q" data-i="tQ" placeholder="Search ID, title, project…" value="${esc(ui('tQ', ''))}" style="min-width:200px">
    ${view === 'list' ? `<select class="i" id="t-st" data-c="tStatus">${opts([['OPEN', 'Open tasks'], ['TODAY', 'Due today'], ['OVERDUE', 'Overdue'], ['', 'Any status'], ...Object.entries(TSTAT).map(([k, v]) => [k, v[0]])], st)}</select>` : ''}
    <select class="i" id="t-pr" data-c="tPrio">${opts(Object.entries(PRIO).map(([k, v]) => [k, v[0]]), pr, 'Any priority')}</select>
    <select class="i" id="t-dept" data-c="tDept">${deptOpts(dept, 'Any department')}</select>
    ${sc !== 'mine' ? `<select class="i" id="t-who" data-c="tWho">${peopleOpts(who, 'Anyone', mgmt ? null : [S.me.id, ...team])}</select>` : ''}
    <span style="flex:1"></span>
    <button class="btn ${view === 'list' ? 'pri' : ''}" data-a="ui" data-k="tView" data-v="list">List</button><button class="btn ${view === 'board' ? 'pri' : ''}" data-a="ui" data-k="tView" data-v="board">Board</button>
  </div>`;
  if (view === 'board') {
    const cols = [['TODO', 'To do'], ['IN_PROGRESS', 'In progress'], ['BLOCKED', 'Blocked'], ['IN_REVIEW', 'In review'], ['DONE', 'Completed']];
    body += `<div class="board">${cols.map(([k, l]) => { const items = list.filter((t) => t.status === k); return `<div class="col" data-drop="${k}"><h3><span>${l}</span><span>${items.length}</span></h3>
      ${items.map((t) => `<div class="kcard pri-${t.priority}" draggable="true" data-drag="${t.id}" data-a="task" data-id="${t.id}"><div>${esc(t.title)}</div><div class="tiny muted">${esc(t.code)} · ${esc(nameOf(t.assigneeId))} · <span style="${overdue(t) ? 'color:var(--bad);font-weight:600' : ''}">${fmtDs(t.due)}</span></div></div>`).join('')}</div>`; }).join('')}</div>
      <p class="tiny muted">Drag a card to change its status. Blocking a task needs a reason, so open the task for that.</p>`;
  } else {
    body += card(`${list.length} task(s)`, list.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Task</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Due</th><th>Assigned by</th><th>Project</th></tr></thead><tbody>
      ${list.map((t) => `<tr class="click pri-${t.priority}" data-a="task" data-id="${t.id}"><td style="min-width:220px"><b style="font-weight:500">${esc(t.title)}</b><div class="tiny muted">${esc(t.code)}${t.status === 'BLOCKED' && t.blockedReason ? ` · <span style="color:var(--bad)">${esc(t.blockedReason)}</span>` : ''}</div></td>
      <td>${esc(nameOf(t.assigneeId))}</td><td>${pill(PRIO, t.priority)}</td><td>${pill(TSTAT, effStatus(t))} ${overdue(t) ? '<span class="pill t-bad">Overdue</span>' : ''}</td>
      <td style="white-space:nowrap;${overdue(t) ? 'color:var(--bad);font-weight:600' : ''}">${fmtD(t.due)}</td><td>${esc(nameOf(t.assignerId))}</td><td class="small muted">${esc(t.project || '')}</td></tr>`).join('')}</tbody></table></div>` : empty('No tasks match these filters.'),
      { list: true, actions: `<button class="btn sm" data-a="export-tasks">Export</button>` });
  }
  return shell(body, 'Tasks', 'Assignments, deadlines and progress — overdue is flagged on top of each task’s real status', `<button class="btn" data-a="templates">Recurring tasks</button><button class="btn pri" data-a="new-task">New task</button>`);
}
</script>

<script>
const DRSTAT = { OPEN: ['Open', 't-info'], PENDING_INFO: ['Needs info', 't-warn'], IN_PROGRESS: ['In progress', 't-vio'], BLOCKED: ['Blocked', 't-bad'], RESOLVED: ['Resolved', 't-ok'], CLOSED: ['Closed', ''] };

/* ═════════════ Work log ═════════════ */
/* work-log status per day: ok = same day, late = submitted after the day, miss = worked but no log, due = today, not yet */
const WLSTATE = { ok: ['Submitted on time', 't-ok'], late: ['Submitted late', 't-vio'], miss: ['Not submitted', 't-bad'], due: ['Due today', 't-warn'] };
const WL_WINDOW = 62;
function wlState(emp, d) {
  const T = today();
  if (!emp || d > T || (emp.joining && d < emp.joining) || d < addDays(T, -WL_WINDOW)) return '';
  const log = S.wlogs.find((w) => w.empId === emp.id && w.date === d);
  if (log) { const t = log.firstAt || log.at; return t && ymd(new Date(t)) > d ? 'late' : 'ok'; }
  const c = dayStatus(emp, d).code;
  if (d === T) return presentish(c) || c === 'NI' ? 'due' : '';
  return presentish(c) ? 'miss' : '';
}
function wlCalendar(emp, m, sel) {
  const T = today(), first = m + '-01', days = eachDay(first, monthEnd(m));
  const lead = (dow(first) + 6) % 7; // Monday first
  const minM = addDays(T, -WL_WINDOW).slice(0, 7), prevM = addDays(first, -1).slice(0, 7), nextM = addDays(monthEnd(m), 1).slice(0, 7);
  const st = days.map((d) => [d, wlState(emp, d)]);
  const n = (k) => st.filter(([, s]) => s === k).length;
  const cells = [...Array(lead).fill('<span></span>'), ...st.map(([d, k]) => {
    const off = !workingDay(d), fut = d > T;
    return `<button type="button" class="cal-d wc-${k || 'none'}${d === sel ? ' sel' : ''}${d === T ? ' today' : ''}${off ? ' off' : ''}" data-a="wl-day" data-d="${d}" ${fut ? 'disabled' : ''} aria-label="${fmtD(d)}${k ? ' — ' + WLSTATE[k][0] : ''}" title="${fmtD(d)}${k ? ' — ' + WLSTATE[k][0] : ''}" aria-pressed="${d === sel}"><span class="n">${+d.slice(8)}</span></button>`;
  })];
  return `<section class="card wl-cal"><header><button class="btn sm ghost" data-a="wl-month" data-m="${prevM}" ${prevM < minM ? 'disabled' : ''} aria-label="Previous month">‹</button><h2>${fmtM(m)}</h2><button class="btn sm ghost" data-a="wl-month" data-m="${nextM}" ${nextM > T.slice(0, 7) ? 'disabled' : ''} aria-label="Next month">›</button></header>
    <div class="body"><div class="cal-h">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((x) => `<span>${x}</span>`).join('')}</div><div class="cal-g">${cells.join('')}</div>
    <div class="cal-legend"><span><i class="wc-ok"></i>On time <b>${n('ok')}</b></span><span><i class="wc-late"></i>Late <b>${n('late')}</b></span><span><i class="wc-miss"></i>Missing <b>${n('miss')}</b></span>${n('due') ? `<span><i class="wc-due"></i>Due today</span>` : ''}</div>
    <p class="tiny muted" style="margin:8px 0 0">Click any day to add or edit its log. Late = submitted after that day ended. Days off, leave and absences need no log.</p></div></section>`;
}
function wlTeamGrid(ids, m, sel) {
  const T = today(), days = eachDay(m + '-01', monthEnd(m)).filter((d) => d <= T);
  const ppl = ids.map(empById).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  const rows = ppl.map((e) => { const ss = days.map((d) => wlState(e, d)); return { e, ss, miss: ss.filter((x) => x === 'miss').length, late: ss.filter((x) => x === 'late').length }; });
  return card(`Team work-log calendar · ${fmtM(m)}`, `<div class="tbl-wrap"><table class="reg wlg"><thead><tr><th class="n" style="text-align:left">Employee</th>${days.map((d) => `<th class="tiny muted">${+d.slice(8)}</th>`).join('')}<th title="Missing">Miss</th><th title="Late">Late</th></tr></thead><tbody>
    ${rows.map(({ e, ss, miss, late }) => `<tr><td class="n">${esc(e.name)}</td>${ss.map((k, i) => `<td><button class="sq wc-${k || 'none'}${days[i] === sel ? ' sel' : ''}" data-a="ui" data-k="wlDate" data-v="${days[i]}" title="${esc(e.name)} · ${fmtD(days[i])}${k ? ' · ' + WLSTATE[k][0] : ''}" aria-label="${esc(e.name)} ${fmtD(days[i])} ${k ? WLSTATE[k][0] : 'no log needed'}"></button></td>`).join('')}<td style="color:var(--bad);font-weight:600">${miss || ''}</td><td style="color:var(--vio);font-weight:600">${late || ''}</td></tr>`).join('')}
  </tbody></table></div><div class="cal-legend" style="padding:10px 16px"><span><i class="wc-ok"></i>On time</span><span><i class="wc-late"></i>Late</span><span><i class="wc-miss"></i>Missing</span><span><i class="wc-due"></i>Due today</span></div>`, { list: true, actions: `<input type="month" class="i" id="wl-tm" data-c="wlMonth" value="${m}" max="${T.slice(0, 7)}" style="width:auto">` });
}

function vWorklog() {
  const T = today(), d = ui('wlDate', T), mgr = isManager(), tab = ui('wlTab', 'mine');
  const tabsH = `<div class="tabs"><button class="tab" aria-selected="${tab === 'mine'}" data-a="ui" data-k="wlTab" data-v="mine">My log</button>${mgr ? `<button class="tab" aria-selected="${tab === 'team'}" data-a="ui" data-k="wlTab" data-v="team">Team logs</button>` : ''}</div>`;
  const dateBar = `<div class="filters"><button class="btn" data-a="ui" data-k="wlDate" data-v="${addDays(d, -1)}">‹</button><input type="date" class="i" id="wl-date" data-c="wlDate" value="${d}" max="${T}">${d < T ? `<button class="btn" data-a="ui" data-k="wlDate" data-v="${addDays(d, 1)}">›</button>` : ''}<span class="muted small" style="align-self:center">${DAYS[dow(d)]}, ${fmtD(d)}</span></div>`;
  const nav = tabsH;
  let body = nav;
  if (tab === 'mine') {
    const log = S.wlogs.find((w) => w.empId === S.me.id && w.date === d);
    const items = new Map((log?.tasks || []).map((x) => [x.id, x]));
    const doneThatDay = (t) => t.completedAt && ymd(new Date(t.completedAt)) === d;
    const tasks = S.tasks.filter((t) => t.assigneeId === S.me.id && t.code && ((openTask(t) && t.start <= d) || doneThatDay(t) || items.has(t.id))).sort(taskSort);
    let prevD = addDays(d, -1); for (let i = 0; i < 6 && !workingDay(prevD); i++) prevD = addDays(prevD, -1);
    const prevLog = S.wlogs.find((w) => w.empId === S.me.id && w.date === prevD);
    const editable = d >= addDays(T, -31) && d <= T && !S.readonly && (!S.me.joining || d >= S.me.joining);

        <div class="tiny muted">${esc(t.code)} · from ${esc(nameOf(t.assignerId))} · due ${fmtDs(t.due)}${(t.checklist || []).length ? ` · checklist ${(t.checklist || []).filter((c) => c.d).length}/${t.checklist.length}` : ''}</div>
        <div class="row" style="margin-top:6px;gap:6px">
          <div class="seg" role="radiogroup" aria-label="What happened with ${esc(t.code)}">${CH.map(([k, l]) => `<label class="${st === k ? 'on' : ''} s-${k}"><input type="radio" id="wl-s-${t.id}-${k}" name="s_${t.id}" value="${k}" ${st === k ? 'checked' : ''} ${editable ? '' : 'disabled'}>${l}</label>`).join('')}</div>
          <select class="i" id="wl-h-${t.id}" name="h_${t.id}" style="width:auto" aria-label="Hours" ${editable ? '' : 'disabled'}>${opts([['', 'Hours'], ...[0.5, 1, 1.5, 2, 3, 4, 5, 6, 8].map((h) => [h, h + ' h'])], it.hrs || '')}</select>
          <input class="i" id="wl-n-${t.id}" name="n_${t.id}" placeholder="Note (optional)" value="${esc(it.note || '')}" style="flex:1;min-width:140px" ${editable ? '' : 'disabled'}>
        </div></li>`;
    };
    const f = (k, l, v, ph = '') => `<label class="f full">${l}<textarea class="i" id="wl-${k}" name="${k}" rows="2" placeholder="${esc(ph)}" ${editable ? '' : 'disabled'}>${esc(v || '')}</textarea></label>`;
    const k = wlState(S.me, d);
    body += `<div class="wl-layout">${wlCalendar(S.me, ui('wlMonth', d.slice(0, 7)), d)}<div class="grid" style="gap:14px;align-content:start">
    <div class="wl-dayhead"><div><h2 style="margin:0">${DAYS[dow(d)]}, ${fmtD(d)}</h2><div class="small muted">${log ? `First submitted ${fmtDT(log.firstAt || log.at)}${log.firstAt && log.at !== log.firstAt ? ` · last edited ${fmtDT(log.at)}` : ''}` : k === 'miss' ? 'No log for this day yet — fill it now; it will be marked late.' : k === 'due' ? 'Submit before midnight to count as on time.' : workingDay(d) ? 'No log needed for this day (leave, absent or not joined yet) — you can still add one.' : 'Weekly off / holiday'}</div></div>${k ? `<span class="pill ${WLSTATE[k][1]}">${WLSTATE[k][0]}</span>` : ''}</div>
    <form data-f="worklog" data-date="${d}" class="grid" style="gap:14px">
      ${card(`My tasks for ${fmtDs(d)} (${tasks.length})`, tasks.length ? `<ul class="list">${tasks.map(rowFor).join('')}</ul>` : empty('No tasks assigned to you for this day. Add what you did in “Other work” below.'),
        { list: true, actions: editable && tasks.length ? '<button type="button" class="btn sm" data-a="wl-all">Mark all as worked on</button>' : '' })}
      <section class="card"><details ${log?.extra || log?.blockersNote || log?.outcomes || log?.tomorrowNote ? 'open' : ''}><summary class="body" style="cursor:pointer"><b>Other work &amp; notes</b> <span class="small muted">— optional; tasks above already fill the report</span></summary>
        <div class="body fgrid" style="padding-top:0">
          ${f('extra', 'Other work not in a task', log?.extra, 'e.g. Attended distributor call, prepared samples')}${f('outcomes', 'Results / numbers', log?.outcomes, 'e.g. Collected ₹1.2 lakh, 3 farmer visits')}
          ${f('blockers', 'Need help with (your manager is alerted)', log?.blockersNote)}${f('tomorrow', 'Plan for tomorrow', log?.tomorrowNote, 'Leave blank to use your open tasks')}
          ${editable && prevLog ? `<div class="full"><button type="button" class="btn sm" data-a="wl-copy" data-d="${prevD}">Copy notes from ${fmtDs(prevD)}</button></div>` : ''}
        </div></details></section>
      ${log?.review ? `<div class="alert t-info" style="cursor:default"><b>Manager feedback:</b> ${esc(log.review)}</div>` : ''}
      <div class="row">${editable ? `<button class="btn pri" type="submit">${log ? 'Update work log' : 'Submit work log'}</button><span class="small muted">Completed and blocked tasks are updated for you — no need to open each one.</span>` : '<span class="tiny muted">Logs older than 31 days are read-only.</span>'}${log ? `<span class="small muted">Saved ${fmtDT(log.at)}</span>` : ''}</div>

    const ids = scope().filter((id) => id !== S.me.id);

    body += wlTeamGrid(ids, ui('wlMonth', d.slice(0, 7)), d) + `<div style="margin-top:14px">${dateBar}</div>` + `${card(`Not submitted for ${fmtDs(d)} (${missing.length})`, missing.length ? `<div class="row">${missing.map((e) => `<span class="pill t-warn">${esc(e.name)}</span>`).join('')}</div>` : '<span class="muted small">Everyone who worked has submitted.</span>')}
    <div class="grid" style="margin-top:14px">${logs.length ? logs.map((l) => card(`${esc(nameOf(l.empId))} <span class="muted small" style="font-weight:400">· ${fmtDT(l.at)}</span>`, `<div class="grid g3 small">${[['Planned', l.planned], ['Completed', l.done], ['Pending', l.pending], ['Outcomes', l.outcomes], ['Blockers', l.blockers], ['Tomorrow', l.tomorrow]].filter(([, v]) => v).map(([k, v]) => `<div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.06em">${k}</div><div style="white-space:pre-wrap;${k === 'Blockers' ? 'color:var(--bad)' : ''}">${esc(v)}</div></div>`).join('')}</div>
      ${(l.tasks || []).length ? `<div class="tiny" style="margin-top:8px">${l.tasks.map((x) => { const t = S.tasks.find((y) => y.id === x.id); return `<div>${esc(t?.code || '')} ${esc(t?.title || '')}${x.hrs ? ` · ${x.hrs} h` : ''}${x.note ? ` — ${esc(x.note)}` : ''}</div>`; }).join('')}</div>` : ''}
      <form data-f="wl-review" data-id="${l.id}" class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="i" id="wlr-${l.id}" name="note" placeholder="Feedback (optional)" value="${esc(l.review || '')}"><button class="btn" type="submit">${l.reviewedBy ? 'Update' : 'Mark reviewed'}</button></form>`,
      { actions: l.reviewedBy ? '<span class="pill t-ok">Reviewed</span>' : '' })).join('') : empty('No work logs for this date.')}</div>`;
  }
  return shell(body, 'Daily work log', 'Linked to your tasks — notes and hours flow into each task’s history');
}

/* ═════════════ Approvals ═════════════ */
function vApprovals() {

  else list = S.reqs.filter((r) => mgmt || team.includes(r.empId));
  if (type) list = list.filter((r) => r.type === type);

  ${card(`${list.length} request(s)`, list.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Request</th><th>Type</th><th>From</th><th>Status</th><th>With</th><th>Raised</th></tr></thead><tbody>
    ${list.map((r) => { const s = curStep(r); return `<tr class="click" data-a="req" data-id="${r.id}"><td><b style="font-weight:500">${esc(r.title)}</b><div class="tiny muted">${esc(r.code)}${r.amount ? ' · ' + money(r.amount) : ''}</div></td><td class="small">${RTYPE[r.type]}</td><td>${esc(nameOf(r.empId))}</td>
      <td>${pill(RSTAT, r.status)} ${pastSLA(r) ? '<span class="pill t-bad">Late</span>' : ''}</td><td class="small">${s ? `${esc(nameOf(s.by))} <span class="muted">(${esc(s.label)})</span>` : '—'}</td><td class="small muted" style="white-space:nowrap">${fmtDT(r.created)}</td></tr>`; }).join('')}

/* ═════════════ Departments ═════════════ */

    return `<section class="card"><div class="body"><div class="row" style="justify-content:space-between"><div><h2>${esc(d.name)}</h2><div class="tiny muted">${esc(d.code)} · Head: ${esc(nameOf(d.headId))}</div></div><span style="font:600 1.6rem var(--f-display)">${m.length}</span></div>

    <label class="check small" style="margin-left:auto"><input type="checkbox" id="dr-closed" data-c="drClosed" ${ui('drClosed', false) ? 'checked' : ''}> Show closed</label></div>
  ${card(`${list.length} request(s)`, list.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Request</th><th>From → To</th><th>Owner now</th><th>Priority</th><th>Status</th><th>Expected by</th></tr></thead><tbody>
    ${list.map((r) => { const late = r.due < T && !['RESOLVED', 'CLOSED'].includes(r.status); return `<tr class="click" data-a="dreq" data-id="${r.id}"><td><b style="font-weight:500">${esc(r.title)}</b><div class="tiny muted">${esc(r.code)} · by ${esc(nameOf(r.byId))}</div></td><td class="small">${esc(deptOf(r.fromDept)?.name)} → ${esc(deptOf(r.toDept)?.name)}</td><td>${esc(nameOf(r.ownerId))}</td><td>${pill(PRIO, r.priority)}</td><td>${pill(DRSTAT, r.status)}</td><td style="white-space:nowrap;${late ? 'color:var(--bad);font-weight:600' : ''}">${fmtD(r.due)}${late ? ' · late' : ''}</td></tr>`; }).join('')}
  </tbody></table></div>` : empty('No requests here.'), { list: true })}`;

/* ═════════════ Reports ═════════════ */
const REPORTS = [['attendance', 'Monthly attendance'], ['leave', 'Leave utilization'], ['productivity', 'Employee productivity'], ['tasks', 'Daily task report'], ['aging', 'Approval aging'], ['dept', 'Department MIS'], ['lifecycle', 'Employee lifecycle']];
function buildReport(key) {
  const T = today(), ids = scope(), ppl = ids.map(empById).filter(Boolean).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
  const m = ui('rMonth', T.slice(0, 7)), from = ui('rFrom', addDays(T, -30)), to = ui('rTo', T), date = ui('rDate', T);
  const inRange = (d) => d >= from && d <= to;

    return { title: `Monthly attendance — ${fmtM(m)}`, f: ['month'], cols: ['Code', 'Name', 'Department', 'Present', 'Late marks', 'Half days', 'Absent', 'Leave', 'WFH/OD', 'Incomplete', 'Weekly off', 'Holidays', 'Hours'], rows: ppl.map((e) => { const ss = days.map((d) => dayStatus(e, d)); const c = (k) => ss.filter((s) => k.includes(s.code)).length; return [e.code, e.name, deptOf(e.deptId)?.name || '', c(['P', 'L']), ss.filter((s) => s.lateMin).length, c(['HD']), c(['A']), c(['LV']), c(['WFH', 'OD']), c(['I']), c(['WO']), c(['H']), round2(ss.reduce((a, s) => a + s.work, 0) / 60)]; }) };
  }
  if (key === 'leave') {
    const y = +m.slice(0, 4);
    return { title: `Leave utilization — ${y}`, f: ['month'], cols: ['Code', 'Name', 'Department', 'Leave type', 'Credited', 'Used', 'Pending', 'Available'], rows: ppl.flatMap((e) => balances(e, y).map((b) => [e.code, e.name, deptOf(e.deptId)?.name || '', b.lt.code, b.entitled, b.used, b.pending, b.avail])) };
  }
  if (key === 'productivity') {
    const W = { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1 };
    return { title: `Employee productivity — ${fmtD(from)} to ${fmtD(to)}`, f: ['range'], note: 'Weighted score counts each task completed on time at its priority weight (critical 4, high 3, medium 2, low 1) and late completions at half weight. Read it alongside workload and complexity, not as a task count.',
      cols: ['Code', 'Name', 'Tasks due', 'Completed', 'On time', 'Late', 'Still overdue', 'On-time %', 'Weighted score', 'Work logs / days worked'], rows: ppl.map((e) => {
        const t = S.tasks.filter((x) => x.assigneeId === e.id && x.status !== 'CANCELLED' && inRange(x.due));
        const comp = t.filter((x) => x.status === 'DONE' && x.completedAt), ontime = comp.filter((x) => ymd(new Date(x.completedAt)) <= x.due), late = comp.length - ontime.length;
        const worked = eachDay(from, to).filter((d) => presentish(dayStatus(e, d).code)).length, logs = S.wlogs.filter((w) => w.empId === e.id && inRange(w.date)).length;
        return [e.code, e.name, t.length, comp.length, ontime.length, late, t.filter((x) => overdue(x)).length, comp.length ? Math.round(ontime.length / comp.length * 100) + '%' : '—', ontime.reduce((s, x) => s + W[x.priority], 0) + comp.filter((x) => !ontime.includes(x)).reduce((s, x) => s + W[x.priority] / 2, 0), `${logs} / ${worked}`];
      }) };
  }
  if (key === 'tasks') {
    return { title: `Daily task report — ${fmtD(date)}`, f: ['date'], cols: ['Code', 'Name', 'Department', 'Due that day', 'Completed that day', 'Open', 'In progress', 'Blocked', 'In review', 'Overdue'], rows: ppl.map((e) => { const t = S.tasks.filter((x) => x.assigneeId === e.id); const o = t.filter(openTask); return [e.code, e.name, deptOf(e.deptId)?.name || '', t.filter((x) => x.due === date).length, t.filter((x) => x.completedAt && ymd(new Date(x.completedAt)) === date).length, o.length, o.filter((x) => x.status === 'IN_PROGRESS').length, o.filter((x) => x.status === 'BLOCKED').length, o.filter((x) => x.status === 'IN_REVIEW').length, o.filter((x) => overdue(x, date)).length]; }) };
  }
  if (key === 'aging') {
    const list = S.reqs.filter((r) => r.status === 'PENDING' && (isMgmt() || ids.includes(r.empId) || curStep(r)?.by === S.me.id)).sort((a, b) => a.created - b.created);
    return { title: 'Approval aging — pending requests', f: [], cols: ['Code', 'Type', 'Title', 'Requester', 'With', 'Step', 'Raised', 'Age (h)', 'Waiting at step (h)', 'Response time', 'Escalated'], rows: list.map((r) => { const s = curStep(r); return [r.code, RTYPE[r.type], r.title, nameOf(r.empId), s ? nameOf(s.by) : '', s?.label || '', fmtDT(r.created), Math.round((Date.now() - r.created) / 3600000), s?.at ? Math.round((Date.now() - s.at) / 3600000) : '', pastSLA(r) ? 'LATE' : 'OK', s?.escalated ? 'Yes' : '']; }) };
  }
  if (key === 'dept') {
    return { title: `Department MIS — ${fmtD(from)} to ${fmtD(to)}`, f: ['range'], cols: ['Department', 'Head', 'Headcount', 'Attendance %', 'Open tasks', 'Overdue', 'Blocked', 'Completed in period', 'Requests open', 'Requests late', 'Resolved on time %'], rows: cfg().depts.map((d) => {
      const m2 = active().filter((e) => e.deptId === d.id); let exp = 0, pres = 0;
      for (const e of m2) for (const day of eachDay(from, to)) { const c = dayStatus(e, day).code; if (['WO', 'H', '', 'PS', 'NI'].includes(c)) continue; exp++; if (presentish(c)) pres += c === 'HD' ? 0.5 : 1; }
      const t = S.tasks.filter((x) => x.deptId === d.id), o = t.filter(openTask), inc = S.dreqs.filter((r) => r.toDept === d.id), io = inc.filter((r) => !['RESOLVED', 'CLOSED'].includes(r.status));
      const res = inc.filter((r) => r.resolvedAt && inRange(ymd(new Date(r.resolvedAt)))), met = res.filter((r) => ymd(new Date(r.resolvedAt)) <= r.due);
      return [d.name, nameOf(d.headId), m2.length, exp ? Math.round(pres / exp * 100) + '%' : '—', o.length, o.filter((x) => overdue(x)).length, o.filter((x) => x.status === 'BLOCKED').length, t.filter((x) => x.completedAt && inRange(ymd(new Date(x.completedAt)))).length, io.length, io.filter((r) => r.due < T).length, res.length ? Math.round(met.length / res.length * 100) + '%' : '—'];
    }) };
  }
  if (key === 'lifecycle') {
    const rows = [];
    for (const e of S.emps.filter((x) => isMgmt() || ids.includes(x.id))) {
      if (e.joining && inRange(e.joining)) rows.push(['New joiner', e.name, deptOf(e.deptId)?.name || '', fmtD(e.joining), e.designation || '']);
      if (e.status === 'PROBATION') rows.push(['On probation', e.name, deptOf(e.deptId)?.name || '', fmtD(e.probEnd), e.probEnd && e.probEnd < T ? 'Review overdue' : 'Review due']);
      if (e.status === 'ON_NOTICE') rows.push(['On notice', e.name, deptOf(e.deptId)?.name || '', fmtD(e.exitDate), e.clearance || '']);
      if (e.status === 'EXITED' && e.exitDate && inRange(e.exitDate)) rows.push(['Exited', e.name, deptOf(e.deptId)?.name || '', fmtD(e.exitDate), '']);
      for (const h of (e.history || []).filter((x) => inRange(x.date))) rows.push([h.kind, e.name, '', fmtD(h.date), `${h.from || ''} → ${h.to || ''}`]);
    }
    return { title: `Employee lifecycle — ${fmtD(from)} to ${fmtD(to)}`, f: ['range'], cols: ['Event', 'Employee', 'Department', 'Date', 'Details'], rows };
  }
}

<script>
/* ═════════════ Modals ═════════════ */
let M = null;
function openModal(render) { M = { render }; drawModal(true); }
function closeModal() { M = null; $('#modal').innerHTML = ''; }
function drawModal(fresh) {
  const root = $('#modal');
  if (!M) { root.innerHTML = ''; return; }
  const inner = M.render();
  if (inner == null) { closeModal(); return; }
  const html = `<div class="overlay" data-bg="1"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  fresh ? (root.innerHTML = html) : morph(root, html);
  if (fresh) setTimeout(() => root.querySelector('input:not([type=hidden]),select,textarea')?.focus(), 30);
}
const mhead = (title, sub = '') => `<header><div><h2>${title}</h2>${sub ? `<div class="small muted">${sub}</div>` : ''}</div><button class="btn ghost sm" data-a="close" aria-label="Close">✕</button></header>`;
function confirmBox(title, text, onYes, { input = null, danger = true } = {}) {
  openModal(() => `${mhead(esc(title))}<form data-f="confirm"><div class="body"><p>${esc(text)}</p>${input ? `<label class="f">${esc(input)}<input class="i" id="cf-in" name="v" required></label>` : ''}</div><footer><button type="button" class="btn" data-a="close">Back</button><button class="btn ${danger ? 'danger' : 'pri'}" type="submit">Confirm</button></footer></form>`);
  M.onConfirm = onYes;
}

/* Task form */
function taskForm(t) {

  return `${mhead(isNew ? 'New task' : `Edit ${esc(t.code)}`)}<form data-f="task" data-id="${t?.id || ''}"><div class="body fgrid">

        <select class="i" id="tf-add" data-c="taskAdd">${peopleGroups(null, { blank: '+ Add a person…', exclude: M.asg, load: true })}</select></label>
      <div class="row" style="margin-top:6px;gap:6px">${M.asg.map((id) => { const [o, od] = load(id); return `<span class="chip"><input type="hidden" name="assignees" value="${id}">${esc(nameOf(id))}${id === S.me.id ? ' (me)' : ''} <span class="tiny" style="${o >= 6 ? 'color:var(--warn);font-weight:600' : 'color:var(--muted)'}">${o} open${od ? ` · <span style="color:var(--bad)">${od} overdue</span>` : ''}</span><button type="button" class="chip-x" data-a="tf-rm" data-id="${id}" aria-label="Remove ${esc(nameOf(id))}">✕</button></span>`; }).join('') || '<span class="small muted">Nobody chosen yet.</span>'}
        ${myTeam().length ? '<button type="button" class="btn sm ghost" data-a="tf-team">+ My whole team</button>' : ''}${!M.asg.includes(S.me.id) ? '<button type="button" class="btn sm ghost" data-a="tf-me">+ Me</button>' : ''}</div></div>`
    : `<label class="f">Assignee<select class="i" id="tf-asg" name="assignee">${peopleGroups(t.assigneeId)}</select></label>`}
    <label class="f">Priority<select class="i" id="tf-pr" name="priority">${opts(Object.entries(PRIO).map(([k, v]) => [k, v[0]]), t?.priority || 'MEDIUM')}</select></label>
    <label class="f">Start<input class="i" id="tf-start" type="date" name="start" value="${t?.start || T}"></label>
    <label class="f">Due<input class="i" id="tf-due" type="date" name="due" required value="${t?.due || addDays(T, 1)}"></label>
    <label class="f">Project / process<input class="i" id="tf-proj" name="project" value="${esc(t?.project || '')}" list="projects"></label>
    <label class="f">Department<select class="i" id="tf-dept" name="deptId">${deptOpts(t?.deptId, 'Assignee’s department')}</select></label>
    <label class="f">Depends on<select class="i" id="tf-dep" name="dependsOn">${opts(others.map((x) => [x.id, `${x.code} · ${x.title.slice(0, 40)}`]), t?.dependsOn, 'Nothing')}</select></label>
    <label class="f">Reviewer<select class="i" id="tf-rev" name="reviewerId">${peopleGroups(t?.reviewerId || S.me.id)}</select></label>
    <label class="check full"><input type="checkbox" id="tf-nr" name="needsReview" ${t ? (t.needsReview ? 'checked' : '') : 'checked'}> Reviewer must accept the work before it counts as completed</label>
    <label class="f full">Checklist / milestones (one per line)<textarea class="i" id="tf-cl" name="checklist" rows="3">${esc((t?.checklist || []).map((c) => c.t).join('\n'))}</textarea></label>
    <label class="f full">Completion criteria<input class="i" id="tf-cc" name="criteria" value="${esc(t?.criteria || '')}" placeholder="How will we know it’s done?"></label>
    <label class="f full">Links to files (Drive, SharePoint, email) — one per line<textarea class="i" id="tf-links" name="links" rows="2">${esc(t?.links || '')}</textarea></label>
    ${isNew ? '<label class="check full"><input type="checkbox" id="tf-dup" name="allowDup"> Create even if a similar open task exists</label>' : ''}
    <datalist id="projects">${[...new Set(S.tasks.map((x) => x.project).filter(Boolean))].map((p) => `<option value="${esc(p)}">`).join('')}</datalist>
  </div><footer><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">${isNew ? 'Create task' : 'Save changes'}</button></footer></form>`;
}
function taskDetail(id) {
  const t = S.tasks.find((x) => x.id === id);

  const iReview = rev && curStep(rev)?.by === S.me.id;
  const dep = t.dependsOn && S.tasks.find((x) => x.id === t.dependsOn);
  const subs = S.tasks.filter((x) => x.parentId === t.id);
  const cl = t.checklist || [];
  return `${mhead(esc(t.title), `${esc(t.code)} · ${pill(TSTAT, st)} ${pill(PRIO, t.priority)} ${overdue(t) ? '<span class="pill t-bad">Overdue</span>' : ''}`)}
  <div class="body grid" style="gap:16px">
    ${iReview ? `<form data-f="review" data-id="${rev.id}" class="alert t-warn" style="display:block;cursor:default"><b>${esc(nameOf(t.assigneeId))} submitted this for your review.</b>${rev.data.note ? ` “${esc(rev.data.note)}”` : ''}<div class="row" style="margin-top:8px"><input class="i" id="rv-c" name="comment" placeholder="Comment (needed to request changes)" style="flex:1;min-width:180px"><button class="btn pri" name="d" value="APPROVED">Accept & complete</button><button class="btn" name="d" value="RETURNED">Request changes</button></div></form>` : ''}
    ${t.desc ? `<p style="white-space:pre-wrap;margin:0">${esc(t.desc)}</p>` : ''}
    <div class="kv"><div><span>Assignee</span><b>${esc(nameOf(t.assigneeId))}</b></div><div><span>Assigned by</span><span>${esc(nameOf(t.assignerId))}</span></div>
      <div><span>Start</span><span>${fmtD(t.start)}</span></div><div><span>Due</span><b style="${overdue(t) ? 'color:var(--bad)' : ''}">${fmtD(t.due)}</b></div>

      ${!closed && ['TODO', 'IN_PROGRESS'].includes(st) ? `<button class="btn pri" data-a="t-status" data-id="${t.id}" data-to="${t.needsReview && t.reviewerId !== S.me.id ? 'IN_REVIEW' : 'DONE'}">${t.needsReview && t.reviewerId !== S.me.id ? 'Submit for review' : 'Mark complete'}</button>` : ''}

      ${mine && !closed ? `<button class="btn" data-a="t-extend" data-id="${t.id}">Ask for more time</button><button class="btn" data-a="t-hours" data-id="${t.id}">Log hours</button>` : ''}
      ${mgr && !closed ? `<button class="btn" data-a="t-edit" data-id="${t.id}">Edit / reassign</button><button class="btn" data-a="t-sub" data-id="${t.id}">Add subtask</button><button class="btn danger" data-a="t-cancel" data-id="${t.id}">Cancel task</button>` : ''}
      ${mgr && closed ? `<button class="btn" data-a="t-status" data-id="${t.id}" data-to="IN_PROGRESS">Reopen</button>` : ''}
    </div>${rev && !iReview ? `<p class="tiny muted">Waiting for review by ${esc(nameOf(curStep(rev)?.by))} (${esc(rev.code)}).</p>` : ''}</div>` : ''}
    <div><h3>Discussion</h3>
      ${(t.comments || []).map((c) => `<div style="margin-top:10px">${person(c.by, fmtDT(c.at))}<div style="margin:4px 0 0 36px;white-space:pre-wrap">${esc(c.text).replace(/@([A-Za-z][\w.-]*)/g, '<b style="color:var(--accent)">@$1</b>')}</div></div>`).join('') || '<div class="small muted">No comments yet.</div>'}
      <form data-f="comment" data-id="${t.id}" class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="i" id="cm-${t.id}" name="text" placeholder="Write an update — @Neha mentions a person, @ACC alerts a department head"><button class="btn">Post</button></form></div>

}
function leaveForm() {
  const bals = balances(S.me);
  return `${mhead('Apply for leave')}<form data-f="leave"><div class="body fgrid">
    <label class="f full">Leave type<select class="i" id="lf-lt" name="lt">${opts(bals.map((b) => [b.lt.code, `${b.lt.name}${b.lt.quota ? ` — ${b.avail} available` : ''}`]))}</select></label>
    <label class="f">From<input class="i" id="lf-from" type="date" name="from" required value="${addDays(today(), 1)}"></label>
    <label class="f">To<input class="i" id="lf-to" type="date" name="to"></label>
    <label class="check"><input type="checkbox" id="lf-half" name="half"> Half day</label>
    <label class="f"><select class="i" id="lf-sess" name="session">${opts([['First half', 'First half'], ['Second half', 'Second half']])}</select></label>
    <label class="f full">Reason<textarea class="i" id="lf-reason" name="reason" required rows="2"></textarea></label>
    <label class="f full">Supporting document link (needed for sick leave above the policy limit)<input class="i" id="lf-doc" name="doc" placeholder="Link to medical certificate in Drive / email"></label>
    ${approverPick(chainFor('LEAVE', S.me, { days: 1 })[0]?.by, `HR is added after the approver for leave longer than ${cfg().hrLeaveAbove ?? 2} day(s)`)}
    <p class="tiny muted full">Weekly offs and holidays inside the dates aren’t counted. Overlapping requests and insufficient balances are blocked.</p>
  </div><footer><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Submit for approval</button></footer></form>`;
}
function reqForm(type, extra = {}) {
  const T = today();
  if (!type) return `${mhead('Raise a request')}<div class="body grid g2">${[['WFH_OD', 'Work from home or official duty'], ['CORRECTION', 'Fix a missing or wrong punch'], ['OVERTIME', 'Extra hours worked'], ['EXPENSE', 'Claim travel or other expenses'], ['PURCHASE', 'Buy equipment or materials'], ['DOCUMENT', 'Salary certificate, experience letter…'], ['CHANGE', 'Change my details, assets'], ['HR_HELP', 'A question or problem for HR']].map(([k, d]) => `<button class="btn" style="justify-content:flex-start;white-space:normal;text-align:left" data-a="new-req" data-t="${k}"><span><b style="font-weight:600">${RTYPE[k]}</b><br><span class="small muted">${d}</span></span></button>`).join('')}
    <button class="btn" style="justify-content:flex-start" data-a="apply-leave"><span><b style="font-weight:600">Leave (CL/SL)</b><br><span class="small muted">Apply on the leave form</span></span></button></div>`;
  const f = {
    CORRECTION: `<label class="f">Date<input class="i" id="rq-date" type="date" name="date" required max="${T}" value="${extra.date || addDays(T, -1)}"></label><span></span><label class="f">Actual check-in<input class="i" id="rq-in" type="time" name="inT"></label><label class="f">Actual check-out<input class="i" id="rq-out" type="time" name="outT"></label>`,
    WFH_OD: `<label class="f">Type<select class="i" id="rq-kind" name="kind">${opts([['WFH', 'Work from home'], ['OD', 'Official duty / travel']])}</select></label><label class="f">Location (for official duty)<input class="i" id="rq-loc" name="location"></label><label class="f">From<input class="i" id="rq-from" type="date" name="from" required value="${T}"></label><label class="f">To<input class="i" id="rq-to" type="date" name="to"></label>`,
    OVERTIME: `<label class="f">Date<input class="i" id="rq-date" type="date" name="date" required max="${T}"></label><label class="f">Hours<input class="i" id="rq-h" type="number" step="0.5" min="0.5" name="hours" required></label>`,
    EXPENSE: `<label class="f">Amount (₹)<input class="i" id="rq-amt" type="number" min="1" step="0.01" name="amount" required></label><label class="f">Category<select class="i" id="rq-cat" name="category">${opts(['Travel', 'Local conveyance', 'Food & stay', 'Client meeting', 'Office supplies', 'Other'].map((x) => [x, x]))}</select></label><label class="f">Bill date<input class="i" id="rq-bd" type="date" name="billDate"></label><label class="f">Bills link<input class="i" id="rq-bl" name="link" placeholder="Drive folder with bills"></label>`,
    PURCHASE: `<label class="f">Estimated amount (₹)<input class="i" id="rq-amt" type="number" min="1" name="amount" required></label><label class="f">Vendor<input class="i" id="rq-ven" name="vendor"></label>`,
    DOCUMENT: `<label class="f">Document<select class="i" id="rq-doc" name="document">${opts(['Salary certificate', 'Experience letter', 'Employment verification', 'Address proof letter', 'Form 16 copy', 'Other'].map((x) => [x, x]))}</select></label><label class="f">Purpose<input class="i" id="rq-pur" name="purpose"></label>`,
    CHANGE: '', HR_HELP: '',
  }[type] || '';
  const ch = chainFor(type, S.me, { amount: 1, days: 1 });
  const chain = ch.slice(1).map((s) => `${s.label} (${nameOf(s.by)})`).join(' → ');
  return `${mhead(esc(RTYPE[type]))}<form data-f="req" data-t="${type}"><div class="body fgrid">
    ${['CHANGE', 'HR_HELP', 'PURCHASE', 'EXPENSE', 'DOCUMENT'].includes(type) ? `<label class="f full">Subject<input class="i" id="rq-title" name="title" required></label>` : ''}
    ${f}<label class="f full">${type === 'CORRECTION' ? 'Reason' : 'Details'}<textarea class="i" id="rq-det" name="reason" rows="3" ${['CORRECTION', 'WFH_OD', 'HR_HELP', 'CHANGE'].includes(type) ? 'required' : ''}></textarea></label>
    ${approverPick(ch[0]?.by, `${chain ? 'Then: ' + esc(chain) : ''}${type === 'EXPENSE' ? ` (+ Director above ${money(cfg().directorExpenseAbove)})` : ''}`)}
  </div><footer><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Submit</button></footer></form>`;
}
const DLABEL = { from: 'From', to: 'To', lt: 'Leave type', days: 'Days', half: 'Half day', session: 'Session', reason: 'Reason', doc: 'Document link', date: 'Date', inT: 'Check-in', outT: 'Check-out', kind: 'Type', location: 'Location', hours: 'Hours', category: 'Category', billDate: 'Bill date', link: 'Link', vendor: 'Vendor', document: 'Document', purpose: 'Purpose', newDue: 'New due date', oldDue: 'Current due date', note: 'Note', resubmitNote: 'Resubmission note', warnings: 'Flags' };
function reqDetail(id) {
  const r = S.reqs.find((x) => x.id === id);
  if (!r) return `${mhead('Opening…')}<div class="body muted">Loading the latest data…</div>`;
  const s = curStep(r), canDecide = r.status === 'PENDING' && s?.by === S.me.id, isReq = r.empId === S.me.id || r.raisedBy === S.me.id;
  let ctx = '';
  if (r.type === 'LEAVE') {
    const e = empById(r.empId), bals = e ? balances(e, +r.data.from.slice(0, 4)) : [];
    const mates = e ? active().filter((x) => x.id !== e.id && x.managerId && x.managerId === e.managerId) : [];
    const away = mates.filter((m) => reqsOf('LEAVE', m.id).some((x) => ['APPROVED', 'PENDING'].includes(x.status) && !x.data.cancelled && x.data.from <= r.data.to && x.data.to >= r.data.from));
    ctx = `<div class="card body" style="background:var(--sunk);border:0"><h3>Leave context</h3><div class="row small" style="margin-top:6px">${bals.map((b) => `<span>${esc(b.lt.code)}: <b>${b.lt.quota ? b.avail : '—'}</b> left</span>`).join(' · ')}</div><div class="small" style="margin-top:4px">Team members away then: ${away.length ? esc(away.map((a) => a.name).join(', ')) : 'none'}</div>${r.data.cancelOf ? '<div class="small" style="color:var(--warn);margin-top:4px">This asks to cancel leave that was already approved — approving restores the balance.</div>' : ''}</div>`;
  }
  if (r.type === 'CORRECTION') {
    const e = empById(r.empId), ds = dayStatus(e, r.data.date);
    ctx = `<div class="card body" style="background:var(--sunk);border:0"><h3>Recorded on ${fmtD(r.data.date)}</h3><div class="small">${stPill(ds.code)} In ${hm(ds.inT)} · Out ${hm(ds.outT)} · punches: ${(ds.punches || []).map((p) => `${hm(p.t)} (${p.s})`).join(', ') || 'none'}</div><div class="tiny muted">Approving adds correction punches; the original punches stay.</div></div>`;
  }
  if (isClaim(r)) ctx = claimCtx(r, canDecide);
  return `${mhead(esc(r.title), `${esc(r.code)} · ${RTYPE[r.type]} · ${pill(RSTAT, r.status)} ${pastSLA(r) ? '<span class="pill t-bad">Past response time</span>' : ''}`)}
  <div class="body grid" style="gap:14px">
    <div>${person(r.empId, `${empById(r.empId)?.designation || ''} · raised ${fmtDT(r.created)}`)}</div>
    ${isClaim(r) ? '' : `<div class="kv">${r.amount ? `<div><span>Amount</span><b>${money(r.amount)}</b></div>` : ''}${Object.entries(r.data || {}).filter(([k, v]) => DLABEL[k] && v !== '' && v != null && v !== false).map(([k, v]) => `<div><span>${DLABEL[k]}</span><span>${/^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? fmtD(v) : v === true ? 'Yes' : /^https?:/.test(String(v)) ? `<a href="${esc(v)}" target="_blank" rel="noopener">Open link</a>` : esc(v)}</span></div>`).join('')}</div>`}
    ${ctx}
    <div><h3 style="margin-bottom:8px">Approval chain</h3><ol class="timeline"><li class="APPROVED"><b>Submitted</b> by ${esc(nameOf(r.raisedBy || r.empId))} <span class="tiny muted">${fmtDT(r.created)}</span></li>
      ${r.steps.map((x) => `<li class="${x.status}"><b>${esc(x.label)}</b> — ${esc(nameOf(x.by))} ${pill({ WAITING: ['Not reached', ''], SKIPPED: ['Skipped', ''], ...RSTAT }, x.status)}${x.comment ? `<div class="small" style="font-style:italic">“${esc(x.comment)}”</div>` : ''}<div class="tiny muted">${x.done ? 'Decided ' + fmtDT(x.done) : x.at ? 'Waiting since ' + fmtDT(x.at) : ''}${x.escalated ? ' · escalated' : ''}</div></li>`).join('')}</ol></div>
    ${canDecide && !S.readonly ? `<form data-f="decide" data-id="${r.id}" class="grid" style="gap:8px">${isClaim(r) ? claimApprField(r) : ''}<textarea class="i" id="dc-${r.id}" name="comment" rows="2" placeholder="Comment (required to reject or send back)"></textarea><div class="row"><button class="btn pri" name="d" value="APPROVED">Approve</button><button class="btn" name="d" value="RETURNED">Send back</button><button class="btn danger" name="d" value="REJECTED">Reject</button></div></form>` : ''}
    ${isReq && r.status === 'RETURNED' ? `<form data-f="resubmit" data-id="${r.id}" class="row" style="flex-wrap:nowrap"><input class="i" id="rs-${r.id}" name="note" placeholder="What did you change or clarify?" required><button class="btn pri">Resubmit</button></form>` : ''}
    ${isReq && ['PENDING', 'RETURNED'].includes(r.status) ? `<div class="row">${pastSLA(r) && !s?.escalated ? `<button class="btn" data-a="req-escalate" data-id="${r.id}">Escalate to ${esc(nameOf(empById(s.by)?.managerId) || 'their manager')}</button>` : ''}<button class="btn danger" data-a="req-cancel" data-id="${r.id}">Cancel request</button></div>` : ''}
    ${r.data.taskId ? `<button class="btn" data-a="task" data-id="${r.data.taskId}">Open the task</button>` : ''}
  </div>`;
}

    <label class="f full">Assets issued<input class="i" id="ef-as" name="assets" value="${esc(e?.assets || '')}" placeholder="Laptop Dell 5440 (SN…), SIM, ID card" ${ro}></label>
    ${hr ? `<div class="full ppl"><div class="small muted" style="margin-bottom:4px">Claude login: ${e?.userId ? '<span class="pill t-ok">Linked</span>' : '<span class="pill">Not linked</span>'} — search by name to link</div>
      <input class="i" id="ef-find" data-search="people" placeholder="Search your organisation by name or email" autocomplete="off"><input type="hidden" id="ef-uid" name="userId" value="${esc(S.ui.pickUid ?? e?.userId ?? '')}"><div class="menu" id="ef-menu" hidden></div></div>` : ''}
  </div>
  ${e ? `<div class="body" style="border-top:1px solid var(--line)"><h3>Leave balances ${T.slice(0, 4)}</h3><div class="row small" style="margin-top:6px">${bals.map((b) => `<span>${esc(b.lt.code)} <b>${b.lt.quota ? b.avail : '—'}</b> left (${b.used} used)</span>`).join(' · ')}</div>
    ${hr ? `<div class="row" style="margin-top:8px"><select class="i" id="ef-adj-lt" style="width:auto">${opts(cfg().leaveTypes.map((l) => [l.code, l.code]))}</select><input class="i" id="ef-adj-v" type="number" step="0.5" placeholder="+/- days" style="width:110px"><input class="i" id="ef-adj-r" placeholder="Reason (kept in audit log)" style="flex:1;min-width:140px"><button type="button" class="btn" data-a="leave-adj" data-id="${e.id}">Adjust</button></div>` : ''}
    ${(e.history || []).length ? `<h3 style="margin-top:12px">History</h3>${e.history.slice().reverse().map((h) => `<div class="tiny" style="margin-top:4px"><b>${esc(h.kind)}</b> ${fmtD(h.date)} — ${esc(h.from || '—')} → ${esc(h.to || '—')}</div>`).join('')}` : ''}</div>` : ''}
  <footer>${e ? `<button type="button" class="btn" data-a="new-task" data-assignee="${e.id}">Assign a task</button>${e.id !== S.me.id ? `<button type="button" class="btn" data-a="dm" data-id="${e.id}">Message</button>` : ''}${hr && e.userId && e.id !== S.me.id ? `<button type="button" class="btn danger" data-a="acct-reset" data-id="${e.id}">Reset password</button>` : ''}` : ''}<span style="flex:1"></span><button type="button" class="btn" data-a="close">Close</button>${hr ? `<button class="btn pri" type="submit">${e ? 'Save' : 'Add employee'}</button>` : ''}</footer></form>`;
}

      <label class="f">Monthly on day<input class="i" id="tp-m" type="number" min="1" max="28" name="dom" value="1"></label>

  return `${mhead('Alerts')}<div class="body" style="padding:0">${list.length ? `<ul class="list">${list.map((n) => `<li data-a="ntf-open" data-id="${n.id}" style="cursor:pointer;${n.read ? 'opacity:.6' : ''}"><div class="grow"><div style="${n.read ? '' : 'font-weight:600'}">${esc(n.title)}</div>${n.body ? `<div class="small muted" style="white-space:pre-wrap">${esc(n.body)}</div>` : ''}<div class="tiny muted">${ago(n.at)}</div></div></li>`).join('')}</ul>` : empty('You’re all caught up.')}</div>
  <footer><button class="btn" data-a="ntf-readall">Mark all read</button><button class="btn" data-a="close">Close</button></footer>`;
