<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d6b57"><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style></head><body>
<title>OfficeHub Aminorich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (desktop) / scrolling top tab strip (phone) + one working pane; modals for forms and record detail. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#eaeee8; --ink:#17221d; --muted:#5d6b64; --line:#d8dfd9;
  --accent:#0d6b57; --accent-soft:#dcefe8; --accent-ink:#ffffff; --gold:#a8730b;
  --ok:#1d7a46; --ok-soft:#e1f2e7; --warn:#a86207; --warn-soft:#fbefd9; --bad:#b4232c; --bad-soft:#fbe4e4; --info:#1f5f9e; --info-soft:#e2edf8; --vio:#6b3fa0; --vio-soft:#efe7f8;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06);
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif; --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail:#0f3b31; --rail-ink:#e6f1ec; --rail-muted:#9dbcb1; --rail-hi:rgba(255,255,255,.09); --rail-act:#7ad8b5; --topbar:rgba(243,245,242,.86);
  --c-teal:#0f8a74; --c-sky:#1b86c7; --c-blue:#2f62d0; --c-violet:#7a4cc4; --c-amber:#c77d0a; --c-leaf:#3f8f2b; --c-coral:#d2513a; --c-gold:#b48712; --c-indigo:#4a55b8; --c-rose:#c43f73; --c-cyan:#0f8fa0; --c-slate:#56677a;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --sunk:#1c2622; --ink:#e3ebe6; --muted:#97a8a0; --line:#2a3631;
  --accent:#3fb894; --accent-soft:#183a30; --accent-ink:#06231a; --gold:#e0a93b;
  --ok:#5cc98a; --ok-soft:#163223; --warn:#e5a54a; --warn-soft:#352812; --bad:#f07a80; --bad-soft:#3a1a1d; --info:#79b2ee; --info-soft:#17283b; --vio:#bb98e6; --vio-soft:#2a2038;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --rail:#0b1311; --rail-ink:#dfe9e4; --rail-muted:#8aa198; --rail-hi:rgba(255,255,255,.06); --rail-act:#5fcca4; --topbar:rgba(15,21,19,.86); --c-teal:#3cc7a7; --c-sky:#5ab7ee; --c-blue:#7a9ef0; --c-violet:#b493ee; --c-amber:#f0b44e; --c-leaf:#86cf6a; --c-coral:#f2876f; --c-gold:#e6c15a; --c-indigo:#9aa2f2; --c-rose:#f08bb1; --c-cyan:#5ccfdc; --c-slate:#9fb0c2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --sunk:#1c2622; --ink:#e3ebe6; --muted:#97a8a0; --line:#2a3631;
  --accent:#3fb894; --accent-soft:#183a30; --accent-ink:#06231a; --gold:#e0a93b;
  --ok:#5cc98a; --ok-soft:#163223; --warn:#e5a54a; --warn-soft:#352812; --bad:#f07a80; --bad-soft:#3a1a1d; --info:#79b2ee; --info-soft:#17283b; --vio:#bb98e6; --vio-soft:#2a2038;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --rail:#0b1311; --rail-ink:#dfe9e4; --rail-muted:#8aa198; --rail-hi:rgba(255,255,255,.06); --rail-act:#5fcca4; --topbar:rgba(15,21,19,.86); --c-teal:#3cc7a7; --c-sky:#5ab7ee; --c-blue:#7a9ef0; --c-violet:#b493ee; --c-amber:#f0b44e; --c-leaf:#86cf6a; --c-coral:#f2876f; --c-gold:#e6c15a; --c-indigo:#9aa2f2; --c-rose:#f08bb1; --c-cyan:#5ccfdc; --c-slate:#9fb0c2; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.02rem;font-weight:600} h3{font-size:.95rem;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)} .small{font-size:.82rem} .tiny{font-size:.74rem}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 15px var(--f-display)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);width:100%}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ct{margin-left:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;font-weight:600}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;gap:10px;align-items:center}
.main{min-width:0;padding-block:20px 48px;padding-inline:clamp(16px,3vw,32px)}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.body{padding:14px 16px}
.card>.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;min-width:0}
.list>li:last-child{border-bottom:0}
.list>li .grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:9px 11px;border:0;text-align:left;cursor:pointer}
.kpi:hover{outline:1px solid var(--line)}
.kpi .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 1.55rem/1.15 var(--f-display)}
.kpi .v.bad{color:var(--bad)} .kpi .v.warn{color:var(--warn)} .kpi .v.ok{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 9px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-vio{background:var(--vio-soft);color:var(--vio)} .t-acc{background:var(--accent-soft);color:var(--accent)}
.pri-CRITICAL{box-shadow:inset 3px 0 0 var(--bad)} .pri-HIGH{box-shadow:inset 3px 0 0 var(--warn)} .pri-MEDIUM{box-shadow:inset 3px 0 0 var(--info)} .pri-LOW{box-shadow:inset 3px 0 0 var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font-size:.92rem}
textarea.i{resize:vertical;min-height:64px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .i{width:auto}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
.t th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--sunk)}
.t td.num,.t th.num{text-align:right}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:.88rem;border:0;width:100%;text-align:left;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 11px var(--f-body);flex:none}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:10px;padding:8px;min-height:120px}
.col h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;padding:2px 4px 8px}
.col.over{outline:2px dashed var(--accent)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:grab;font-size:.88rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:.7rem;text-transform:uppercase;color:var(--muted);text-align:center;letter-spacing:.06em}
.cal .dc{min-height:62px;border-radius:7px;padding:5px 6px;font-size:.74rem;background:var(--surface);border:1px solid var(--line)}
.cal .dc b{font-size:.8rem}
.reg{border-collapse:collapse;font-size:.72rem}
.reg th,.reg td{padding:2px;text-align:center;border-bottom:1px solid var(--line)}
.reg td.n{text-align:left;white-space:nowrap;padding-right:10px;position:sticky;left:0;background:var(--surface)}
.code{display:inline-block;min-width:24px;border-radius:4px;padding:1px 2px;font-weight:600}
.c-P{background:var(--ok-soft);color:var(--ok)} .c-L{background:var(--warn-soft);color:var(--warn)} .c-A{background:var(--bad-soft);color:var(--bad)} .c-HD,.c-I{background:var(--warn-soft);color:var(--warn)} .c-LV{background:var(--vio-soft);color:var(--vio)} .c-WFH,.c-OD{background:var(--info-soft);color:var(--info)} .c-WO,.c-H,.c-PS,.c-NI{background:var(--sunk);color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:start center;padding:5vh 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);box-shadow:var(--shadow);border:1px solid var(--line)}
.modal>header{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal>.body,.modal>form>.body{padding:16px 18px}
.modal>footer,.modal>form>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:.9rem;max-width:min(420px,calc(100% - 32px))}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 8px;font-size:.88rem}
.timeline li::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.timeline li.APPROVED::before{background:var(--ok)} .timeline li.PENDING::before{background:var(--warn)} .timeline li.REJECTED::before{background:var(--bad)} .timeline li.RETURNED::before{background:var(--gold)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;font-size:.88rem}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}
.kv span:first-child{color:var(--muted)}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:.66rem;padding:0 5px;font-weight:700}
.splash{max-width:560px;margin:10vh auto;padding:0 16px}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.ppl{position:relative}.ppl .menu{position:absolute;z-index:5;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow:auto}
.ppl .menu button{display:flex;width:100%;gap:8px;align-items:center;padding:7px 10px;border:0;background:none;text-align:left;cursor:pointer}.ppl .menu button:hover{background:var(--sunk)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;z-index:20;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand,.me{display:none}
  .nav{width:auto;white-space:nowrap;padding:7px 10px}
  .g2,.g3,.g4{grid-template-columns:1fr} .span2{grid-column:auto}
  .fgrid,.kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}}}

/* ── interface refresh: pine rail with icons, sticky top bar, phone tab bar ── */
body{font-size:14.5px}
.ico{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell{grid-template-columns:244px 1fr}
.rail{background:var(--rail);color:var(--rail-ink);border-right:0;padding:16px 12px 14px;gap:2px}
.rail .brand{padding:4px 8px 18px}
.rail .brand small{color:var(--rail-muted)}
.rail .mark{background:var(--rail-act);color:var(--rail);border-radius:10px;font-size:13px;letter-spacing:.02em}
.nav-g{font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--rail-muted);padding:14px 10px 6px;font-weight:600}
.rail .nav{color:var(--rail-ink);opacity:.86;padding:8px 10px;border-radius:9px;position:relative;font-size:.92rem}
.rail .nav .ico{opacity:.85}
.rail .nav:hover{background:var(--rail-hi);color:var(--rail-ink);opacity:1}
.rail .nav[aria-current="page"]{background:var(--rail-hi);color:#fff;opacity:1;font-weight:600}
.rail .nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--rail-act)}
.rail .nav[aria-current="page"] .ico{color:var(--rail-act);opacity:1}
.ct{margin-left:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 7px;font-weight:700;line-height:1.4}
.ct.ct-acc{background:var(--rail-act);color:var(--rail)}
.rail .me{border-top:1px solid var(--rail-hi);color:var(--rail-ink)}
.rail-muted{color:var(--rail-muted)}
.main{padding-block:0 56px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1 * clamp(16px,3vw,32px)) 18px;padding:16px clamp(16px,3vw,32px) 14px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.45rem;letter-spacing:-.015em}
.tb-actions{gap:8px}
.btn{min-height:36px;border-radius:9px;transition:border-color .12s,background .12s,box-shadow .12s}
.btn.sm{min-height:28px;border-radius:7px}
.btn.pri{box-shadow:0 1px 0 rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12)}
.btn .ico{width:17px;height:17px}
.card{border-color:color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 1px 2px rgba(20,40,30,.04)}
.card>header h2{font-size:.98rem}
.t th{position:sticky;top:0;z-index:1}
.t tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.tabs{gap:2px}
.tab{border-radius:8px 8px 0 0;font-weight:500}
.tab:hover{color:var(--ink)}
input.i,select.i,textarea.i{min-height:38px;border-radius:9px}
.modal{border-radius:16px}
.overlay{backdrop-filter:blur(2px)}
.tabbar,.sheet,.sheet-bg{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
  .topbar{padding-top:12px;padding-bottom:10px}
  .topbar h1{font-size:1.2rem}
  .tb-actions .btn:not(.bell):not(.pri):not(.searchbtn){display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.68rem;padding:5px 2px;border-radius:10px;position:relative;cursor:pointer}
  .tb[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
  .tb .ct{position:absolute;top:0;right:calc(50% - 22px);margin:0}
  .sheet-bg{display:block;position:fixed;inset:0;background:rgba(10,20,15,.4);z-index:28}
  .sheet{display:block;position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px 12px;max-height:70vh;overflow:auto;box-shadow:var(--shadow)}
  .sheet .nav-g{color:var(--muted);padding:12px 2px 6px}
  .sheet-me{display:flex;gap:10px;align-items:center;padding-bottom:6px}
  .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:.8rem;position:relative;cursor:pointer}
  .sg[aria-current="page"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .sg .ct{position:absolute;top:6px;right:6px}

<div id="app"><div class="splash"><div class="brand"><div class="mark">OH</div><div><b>OfficeHub</b><small>Aminorich Nutrients</small></div></div><p class="muted">Connecting to the office database…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ═════════════ OfficeHub on Vercel — browser bridge ═════════════
   The app was first built as a Claude artifact, which talks to `window.claude.use('db' | 'user' | …)`.
   This file provides the same small API backed by OfficeHub's own server (/api/*) and Postgres:
   - db: a local mirror of every record you may read, kept fresh by polling /api/sync; queries run locally.
   - user: who is signed in (server session cookie). Signed-out visitors get the sign-in / sign-up screen.
   - room: "online now" / "typing…" through the same sync call.  downloads: normal browser downloads. */
(function () {
  'use strict';
  const POLL_MS = 5000, POLL_HIDDEN_MS = 45000, PRESENCE_EVERY_MS = 20000;

  async function api(path, body, method) {
    const r = await fetch('/api/' + path, { method: method || (body ? 'POST' : 'GET'), headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', cache: 'no-store' });
    let j = null; try { j = await r.json(); } catch { /* not JSON */ }
    if (!r.ok) { const e = new Error((j && j.message) || `Request failed (${r.status})`); e.code = (j && j.code) || (r.status === 401 ? 'unauthenticated' : r.status === 403 ? 'permission_denied' : 'unavailable'); e.status = r.status; throw e; }
    return j || {};
  }

  /* ── session ── */
  let sessionP = null;
  const getSession = () => (sessionP = sessionP || api('session').catch((e) => (e.status === 401 ? null : Promise.reject(e))));

  /* ── local mirror ── */
  const docs = new Map();          // path -> { d: data, v }
  const listeners = new Set();
  let since = 0, scope = null, synced = false, syncWaiters = [], timer = 0, busy = false;
  const peer = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let presence = null, presenceDirty = false, presenceSent = 0, peers = [], peerFns = new Set();
  const clone = (x) => (x == null ? x : JSON.parse(JSON.stringify(x)));
  const parentOf = (p) => p.split('/').slice(0, -1).join('/');
  const idOf = (p) => p.split('/').pop();
  const ready = () => (synced ? Promise.resolve() : new Promise((r) => syncWaiters.push(r)));
  const autoId = () => { const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; const b = crypto.getRandomValues(new Uint8Array(20)); for (const x of b) s += a[x % 36]; return s; };
  const fieldOf = (d, f) => f.split('.').reduce((o, k) => (o == null ? undefined : o[k]), d);
  const cmp = (a, b) => (a === b ? 0 : a == null ? -1 : b == null ? 1 : a < b ? -1 : 1);

  function docSnap(path, entry) {
    const data = entry ? entry.d : undefined;
    return { id: idOf(path), ref: { path, id: idOf(path) }, exists: !!entry, data: () => clone(data), get: (f) => clone(fieldOf(data, f)), metadata: { hasPendingWrites: !!(entry && entry.pending) } };
  }
  function runQuery(qy) {
    let out = [];
    for (const [p, e] of docs) if (parentOf(p) === qy.coll && qy.wh.every((w) => match(fieldOf(e.d, w[0]), w[1], w[2]))) out.push([p, e]);
    for (const [f, dir] of qy.ob.slice().reverse()) out.sort((a, b) => cmp(fieldOf(a[1].d, f), fieldOf(b[1].d, f)) * (dir === 'desc' ? -1 : 1));
    if (!qy.ob.length) out.sort((a, b) => (a[0] < b[0] ? -1 : 1));
    if (qy.lim != null) out = out.slice(0, qy.lim);
    return out;
  }
  function match(v, op, x) {
    switch (op) {
      case '==': return v === x || (v == null && x == null);
      case '!=': return v !== x;
      case '<': return v != null && v < x;
      case '<=': return v != null && v <= x;
      case '>': return v != null && v > x;
      case '>=': return v != null && v >= x;
      case 'in': return Array.isArray(x) && x.includes(v);
      case 'not-in': return Array.isArray(x) && !x.includes(v);
      case 'array-contains': return Array.isArray(v) && v.includes(x);
      case 'array-contains-any': return Array.isArray(v) && Array.isArray(x) && x.some((y) => v.includes(y));

  const sigOf = (rows) => rows.map(([p, e]) => p + '@' + e.v).join('|');

  function notify(changedParents) {
    for (const l of listeners) {
      if (changedParents && !changedParents.has(l.kind === 'doc' ? parentOf(l.path) : l.q.coll)) continue;
      fire(l);
    }
  }
  function fire(l) {
    try {
      if (l.kind === 'doc') { const e = docs.get(l.path); const sig = e ? String(e.v) : '-'; if (sig === l.sig) return; l.sig = sig; l.next(docSnap(l.path, e)); }
      else { const rows = runQuery(l.q); const sig = sigOf(rows); if (sig === l.sig) return; l.sig = sig; l.next(qSnap(rows)); }
    } catch (e) { console.error(e); }
  }
  function addListener(l) { listeners.add(l); ready().then(() => { if (listeners.has(l)) fire(l); }); return () => listeners.delete(l); }

  /* ── sync loop ── */
  async function sync() {
    if (busy) return; busy = true; clearTimeout(timer);
    try {
      let again = true, cleared = null;
      while (again) {
        const body = { since, peer };
        if (presence && (presenceDirty || Date.now() - presenceSent > PRESENCE_EVERY_MS)) { body.presence = presence; presenceDirty = false; presenceSent = Date.now(); }
        const r = await api('sync', body);
        if (scope && r.scope !== scope) { cleared = new Set([...docs.keys()].map(parentOf)); docs.clear(); since = 0; scope = r.scope; continue; } // permissions changed: reload everything
        scope = r.scope;
        const changed = new Set();
        for (const row of r.docs) {
          const cur = docs.get(row.p);
          if (cur && cur.v >= row.v && !cur.pending) continue;
          if (cur && cur.pending) continue; // our own write is in flight; its answer will settle it
          if (row.x) docs.delete(row.p); else docs.set(row.p, { d: row.d, v: row.v });
          changed.add(parentOf(row.p));
        }
        again = r.more && r.next > since;
        since = Math.max(since, r.next);
        if (Array.isArray(r.peers)) setPeers(r.peers);
        if (!synced) { synced = true; syncWaiters.splice(0).forEach((f) => f()); }
        else {
          // after a reload, also tell lists that came back empty, so records you may no longer see disappear
          if (cleared) { for (const p of cleared) changed.add(p); cleared = null; }
          if (changed.size) notify(changed);
        }
      }
      online(true);
    } catch (e) {
      if (e.status === 401) { location.reload(); return; }
      if (e.code === 'revoked') { location.reload(); return; }

    } finally {

      timer = setTimeout(sync, document.hidden ? POLL_HIDDEN_MS : POLL_MS);
    }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  window.addEventListener('focus', () => sync());
  let wasOnline = true;
  function online(ok) {
    if (ok === wasOnline) return; wasOnline = ok;
    let b = document.getElementById('oh-offline');
    if (!ok && !b) { b = document.createElement('div'); b.id = 'oh-offline'; b.textContent = 'Connection lost — retrying…'; b.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#b3261e;color:#fff;padding:8px 14px;border-radius:999px;font:500 13px system-ui;z-index:9999'; document.body.appendChild(b); }
    if (ok && b) b.remove();
  }

  /* ── writes ── */
  async function write(op, path, data) {
    if (path.startsWith('auth/') && op === 'delete') { await api('auth/reset', { uid: path.split('/')[1] }); return; } // HR "reset password"
    const prev = docs.get(path);
    if (op === 'set') docs.set(path, { d: clone(data), v: prev ? prev.v : 0, pending: true });
    else if (op === 'update') { if (!prev) throw Object.assign(new Error('That record no longer exists.'), { code: 'not_found' }); docs.set(path, { d: { ...prev.d, ...clone(data) }, v: prev.v, pending: true }); }
    else docs.delete(path);
    notify(new Set([parentOf(path)]));
    try {
      const r = await api('write', { op, path, data: op === 'delete' ? undefined : data });
      if (op === 'delete') { /* stays deleted */ } else { const cur = docs.get(path); if (cur) docs.set(path, { d: cur.d, v: r.v }); }
      notify(new Set([parentOf(path)]));
    } catch (e) {
      if (prev) docs.set(path, prev); else docs.delete(path);
      notify(new Set([parentOf(path)]));
      throw e;
    }
  }

  /* ── db namespace (subset of the artifact db API that OfficeHub uses) ── */
  function docRef(path) {
    return {
      id: idOf(path), path,
      async get() {
        if (path.startsWith('blob/') || path.startsWith('complaintfile/') || path.startsWith('policyfile/') || !synced) { const r = await api('doc?p=' + encodeURIComponent(path)); return docSnap(path, r.exists ? { d: r.data, v: r.v } : null); }
        return docSnap(path, docs.get(path));
      },
      set: (data) => write('set', path, data),
      update: (data) => write('update', path, data),
      delete: () => write('delete', path),
      acquire: (o = {}) => api('lease', { path, holder: o.holder, ttlMs: o.ttlMs }),
      onSnapshot(next, error) { return addListener({ kind: 'doc', path, next, error, sig: null }); },
    };
  }
  function query(coll, wh = [], ob = [], lim = null) {
    const qy = { coll, wh, ob, lim };
    return {
      where: (f, op, v) => query(coll, [...wh, [f, op, v]], ob, lim),
      orderBy: (f, dir = 'asc') => query(coll, wh, [...ob, [f, dir]], lim),
      limit: (n) => query(coll, wh, ob, n),
      async get() { await ready(); return qSnap(runQuery(qy)); },
      onSnapshot(next, error) { return addListener({ kind: 'query', q: qy, next, error, sig: null }); },
      doc: (id) => docRef(`${coll}/${id || autoId()}`),
    };
  }
  const db = { doc: (p) => docRef(p), collection: (p) => query(p) };

  /* ── room (presence) ── */
  function setPeers(list) {
    const now = Date.now();
    peers = list.map((p) => Object.freeze({ peer: p.peer, by: p.by, kind: 'viewer', guest: false, isMe: p.peer === peer || p.by === SESSION?.uid, sameTab: p.peer === peer, presence: Object.freeze(p.presence || {}), updatedAt: p.at || now }));
    if (presence && !peers.some((p) => p.sameTab)) peers.push(Object.freeze({ peer, by: SESSION?.uid, kind: 'viewer', guest: false, isMe: true, sameTab: true, presence: Object.freeze({ ...presence }), updatedAt: now }));
    const ch = Object.freeze({ peers: Object.freeze(peers.slice()) });
    peerFns.forEach((fn) => { try { fn(ch); } catch (e) { console.error(e); } });
  }
  const room = {
    presence(patch) { presence = { ...(presence || {}), ...patch }; for (const k in presence) if (presence[k] === null) delete presence[k]; presenceDirty = true; clearTimeout(room._t); room._t = setTimeout(sync, 400); return Promise.resolve(); },
    onPeers(fn) { peerFns.add(fn); setTimeout(() => fn(Object.freeze({ peers: Object.freeze(peers.slice()) })), 0); return () => peerFns.delete(fn); },
    emit: () => Promise.resolve(), on: () => () => {}, connected: () => true, join: () => room, leave: () => Promise.resolve(),
  };

  /* ── downloads ── */
  const downloads = {
    async save({ filename, data, type }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename || 'download'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
  };

  /* ── user ── */
  let SESSION = null;
  const user = {
    async me() { return { id: SESSION.uid, isOwner: !!SESSION.owner, name: SESSION.name || '', email: null, guest: false }; },
    async id() { return SESSION.uid; },
    isOwner: () => !!SESSION.owner,
    async canEdit() { return !!SESSION.canEdit; },
    async can(name) { return name === 'data.write' ? true : null; },
    async profiles() { return {}; },
    async search() { return []; },
  };

  /* ── sign-in / create-account screen (shown before the app starts) ── */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function showAuth() {
    let info = { company: 'OfficeHub', hasUsers: true, hasData: true };
    try { info = await api('public'); } catch (e) { info.error = e.message; }
    let mode = 'login', err = '', busy2 = false; const vals = {};
    const app = document.getElementById('app');
    const draw = () => {
      const ini = esc((info.company || 'OH').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase());
      const panel = !info.hasData && !info.hasUsers
        ? `<h1>Set up OfficeHub</h1><p class="muted">This office has no data yet. Open the <a href="/setup.html">setup page</a> to import your data or create the first administrator.</p>${info.error ? `<div class="alert t-bad" style="margin-top:12px">${esc(info.error)}</div>` : ''}`
        : mode === 'login'
          ? `<h1>Sign in</h1><p class="muted">Welcome back.</p>${err ? `<div class="alert t-bad" style="cursor:default;margin:12px 0">${esc(err)}</div>` : ''}
            <form id="oh-login" class="grid" style="gap:12px;margin-top:16px">
              <label class="f">Work email or employee code<input class="i" name="id" autocomplete="username" required autofocus></label>
              <label class="f">Password<input class="i" type="password" name="password" autocomplete="current-password" required></label>
              <label class="check"><input type="checkbox" name="keep" checked> Keep me signed in on this device for 7 days</label>
              <button class="btn pri big" type="submit" ${busy2 ? 'disabled' : ''}>${busy2 ? 'Checking…' : 'Sign in'}</button>
              <p class="small muted" style="margin:0">First time here? <a href="#" id="oh-to-signup">Create your account</a> with the employee code and email HR has on record.</p>
              <p class="tiny muted" style="margin:0">Forgot your password? Ask HR or an administrator to reset it, then create your account again.</p></form>`
          : `<h1>Create your account</h1><p class="muted">Use the employee code and work email HR has on record for you.</p>${err ? `<div class="alert t-bad" style="cursor:default;margin:12px 0">${esc(err)}</div>` : ''}
            <form id="oh-signup" class="grid" style="gap:12px;margin-top:16px">
              <label class="f">Employee code<input class="i" name="code" required placeholder="e.g. AMR112" autocomplete="off"></label>
              <label class="f">Work email<input class="i" type="email" name="email" required autocomplete="email"></label>
              <label class="f">Password<input class="i" type="password" name="password" required minlength="8" autocomplete="new-password"></label>
              <label class="f">Repeat password<input class="i" type="password" name="password2" required autocomplete="new-password"></label>
              <label class="check"><input type="checkbox" name="mail" checked> Email me my alerts</label>
              <button class="btn pri big" type="submit" ${busy2 ? 'disabled' : ''}>${busy2 ? 'Creating…' : 'Create account'}</button>
              <p class="tiny muted" style="margin:0">At least 8 characters with letters and a number. Not on the employee list yet? Ask HR to add you first.</p>
              <p class="small muted" style="margin:0">Already have an account? <a href="#" id="oh-to-login">Sign in</a></p></form>`;
      app.innerHTML = `<div class="auth"><div class="auth-art" aria-hidden="true"><div class="auth-brand"><div class="mark">${ini}</div><div><b>OfficeHub</b><small>${esc(info.company)}</small></div></div>
        <div class="auth-copy"><h2>Your office, in one place.</h2><p>Attendance, leave, tasks, approvals, claims and salary — for everyone at ${esc(info.company)}.</p></div>
        <div class="auth-dots">${['var(--c-teal)', 'var(--c-amber)', 'var(--c-coral)', 'var(--c-sky)', 'var(--c-leaf)'].map((c) => `<span style="background:${c}"></span>`).join('')}</div></div>
        <div class="auth-panel"><div class="auth-box">${panel}</div></div></div>`;
      app.querySelectorAll('form input:not([type=password]):not([type=checkbox])').forEach((i) => { if (vals[i.name]) i.value = vals[i.name]; i.addEventListener('input', () => { vals[i.name] = i.value; }); });
      const sw = (m) => (ev) => { ev.preventDefault(); mode = m; err = ''; draw(); };
      app.querySelector('#oh-to-signup')?.addEventListener('click', sw('signup'));
      app.querySelector('#oh-to-login')?.addEventListener('click', sw('login'));
      app.querySelector('form')?.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target), v = (k) => String(fd.get(k) || '');

        busy2 = true; err = ''; draw();
        try {
          if (mode === 'login') await api('auth/login', { id: v('id'), password: v('password'), keep: fd.get('keep') === 'on' });
          else await api('auth/signup', { code: v('code'), email: v('email'), password: v('password'), mail: fd.get('mail') === 'on' });
          location.reload();
        } catch (e) { busy2 = false; err = e.message; draw(); }
      });
    };
    draw();
  }

  /* ── window.claude.use(name) ── */
  const NEVER = new Promise(() => {});
  let started = false;
  async function use(name) {
    const s = await getSession().catch(() => null);
    if (!s) { if (!started) { started = true; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showAuth); else showAuth(); } return NEVER; }

    if (name === 'user') return user;
    if (name === 'downloads') return downloads;
    if (name === 'room') return room;
    return null; // assets, comments, … are not used on this host (chat files are stored in the database)
  }
  window.claude = { use };
  window.OH = { api, sync: () => sync(), docs };
})();

<script>
'use strict';
/* ═════════════ Utilities ═════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const dow = (s) => new Date(s + 'T00:00').getDay();

/* ═════════════ Task actions ═════════════ */
const hist = (t, a) => [...(t.history || []), { at: Date.now(), by: S.me.id, a }];
async function setTaskStatus(t, to, note = '') {
  const mgr = canManageTask(t), mine = t.assigneeId === S.me.id;
  if (!mgr && !mine) fail('You can’t change this task.');
  if (!openTask(t) && !(to === 'IN_PROGRESS' && mgr)) fail('This task is closed. Its assigner can reopen it.');
  const pendingReview = S.reqs.find((r) => r.type === 'REVIEW' && r.data.taskId === t.id && r.status === 'PENDING');
  if (to === 'IN_PROGRESS' || to === 'TODO') {
    if (pendingReview) fail('This task is waiting for review. Ask the reviewer to accept it or send it back.');
    if (to === 'IN_PROGRESS' && t.dependsOn) {
      const dep = S.tasks.find((x) => x.id === t.dependsOn);
      if (dep && dep.status !== 'DONE') fail(`Waiting on ${dep.code} (${dep.title}) — finish that first.`);
    }
    await patch(`task/${t.id}`, { status: to, blockedReason: null, completedAt: null, history: hist(t, !openTask(t) ? `Reopened${note ? ': ' + note : ''}` : t.status === 'BLOCKED' ? 'Unblocked' : to === 'IN_PROGRESS' ? 'Started work' : 'Moved to To do') });
    return;
  }
  if (to === 'BLOCKED') {
    if (note.trim().length < 3) fail('Say what the task is waiting for.');
    await patch(`task/${t.id}`, { status: 'BLOCKED', blockedReason: note.trim(), history: hist(t, `Blocked: ${note.trim()}`) });
    await notify([t.assignerId, t.assigneeId], { title: `Blocked: ${t.code} ${t.title}`, body: note, go: { view: 'tasks', task: t.id } });
    return;
  }
  if (to === 'CANCELLED') {
    if (!mgr) fail('Only the assigner or a manager can cancel a task.');
    if (note.trim().length < 3) fail('Give a reason for cancelling.');
    await patch(`task/${t.id}`, { status: 'CANCELLED', history: hist(t, `Cancelled: ${note}`) });
    await notify([t.assigneeId], { title: `Cancelled: ${t.code} ${t.title}`, body: note, go: { view: 'tasks', task: t.id } });
    return;
  }
  if (to === 'IN_REVIEW' || to === 'DONE') {
    if (t.status === 'IN_REVIEW' && pendingReview) {
      if (to !== 'DONE') fail('Already submitted for review.');
      await decide(pendingReview, 'APPROVED', note);
      return;
    }
    if ((t.checklist || []).some((c) => !c.d)) fail('Tick off every checklist item first.');
    if (t.needsReview && t.reviewerId && t.reviewerId !== S.me.id) {
      await patch(`task/${t.id}`, { status: 'IN_REVIEW', history: hist(t, `Submitted for review${note ? ': ' + note : ''}`) });
      await createRequest('REVIEW', `Review ${t.code}: ${t.title}`, { taskId: t.id, note, reviewer: t.reviewerId, assigner: t.assignerId }, { ctx: { reviewer: t.reviewerId }, empId: t.assigneeId });
    } else {
      await patch(`task/${t.id}`, { status: 'DONE', completedAt: Date.now(), history: hist(t, 'Completed') });
      if (t.assignerId !== S.me.id) await notify([t.assignerId], { title: `Completed: ${t.code} ${t.title}`, go: { view: 'tasks', task: t.id } });
    }
  }
}
async function mentionNotify(text, title, go) {
  const handles = (text.match(/@([A-Za-z][\w.-]*)/g) || []).map((h) => h.slice(1).toLowerCase());
  if (!handles.length) return;
  const ids = active().filter((e) => handles.some((h) => e.name.toLowerCase().split(/\s+/)[0] === h || (e.code || '').toLowerCase() === h)).map((e) => e.id);
  const deptHeads = cfg().depts.filter((d) => handles.includes(d.code.toLowerCase())).map((d) => d.headId);
  await notify([...ids, ...deptHeads], { title: `You were mentioned: ${title}`, body: text.slice(0, 200), go });
}

/* ═════════════ Recurring tasks (generated when anyone opens the app; a lease prevents duplicates) ═════════════ */
let recurringRan = false;
async function runRecurring() {
  if (recurringRan || S.readonly) return;
  recurringRan = true;
  const T = today(), dom = +T.slice(8), codes = S.tasks.slice();
  for (const tp of S.tpls.filter((x) => x.active !== false && (x.lastGen || '') < T)) {
    const due = tp.freq === 'DAILY' ? workingDay(T) : tp.freq === 'WEEKLY' ? dow(T) === +tp.dow : dom === +tp.dom;
    if (!due) continue;
    try {
      const ref = docRef(`tpl/${tp.id}`);
      const lease = await ref.acquire({ holder: S.uid || newId(), ttlMs: 20000 });
      if (!lease.acquired) continue;
      const fresh = await ref.get();
      if (!fresh.exists || (fresh.data().lastGen || '') >= T) continue;
      const id = newId();
      await put(`task/${id}`, {
        code: nextCode('TSK', codes), title: tp.title, desc: tp.desc || '', assigneeId: tp.assigneeId, assignerId: tp.createdBy, reviewerId: tp.needsReview ? tp.createdBy : null,
        needsReview: !!tp.needsReview, deptId: empById(tp.assigneeId)?.deptId || null, project: tp.project || 'Recurring', priority: tp.priority || 'MEDIUM', status: 'TODO',
        start: T, due: addDays(T, +tp.dueIn || 0), checklist: (tp.checklist || []).map((x) => ({ t: x, d: false })), comments: [], created: Date.now(), tplId: tp.id,
        history: [{ at: Date.now(), by: null, a: 'Created from recurring template' }],
      });

}

/* ═════════════ Attendance import (Excel/CSV report from the biometric machine) ═════════════ */
function parseWhen(v, timeV) {
  if (v instanceof Date && !isNaN(v)) {
    if (timeV instanceof Date) { const d = new Date(v); d.setHours(timeV.getHours(), timeV.getMinutes(), timeV.getSeconds()); return d; }
    if (typeof timeV === 'string' && /\d{1,2}:\d{2}/.test(timeV)) { const [h, m, s] = timeV.split(':').map(Number); const d = new Date(v); d.setHours(h, m, s || 0); return d; }
    if (typeof timeV === 'number' && timeV < 1) { const d = new Date(v); const secs = Math.round(timeV * 86400); d.setHours(Math.floor(secs / 3600), Math.floor(secs / 60) % 60, secs % 60); return d; }
    return v;
  }
  const s = String(v || '').trim() + (timeV != null && timeV !== '' ? ' ' + String(timeV).trim() : '');
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if (m) { let h = +m[4]; if (m[7]) { h = h % 12 + (/pm/i.test(m[7]) ? 12 : 0); } const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1], h, +m[5], +(m[6] || 0)); }
  return null;
}
function analyseSheet(rows) {
  if (!rows.length) return { error: 'The file has no rows.' };
  const keys = Object.keys(rows[0]);
  const find = (...names) => keys.find((k) => names.includes(k.toLowerCase().replace(/[^a-z]/g, '')));
  const idK = find('userid', 'empcode', 'employeecode', 'pin', 'badge', 'enrollno', 'employeeid', 'empid', 'id', 'code', 'cardno', 'biometricid', 'ecode');
  const dtK = find('datetime', 'punchtime', 'logdate', 'checktime', 'timestamp', 'attendancedatetime', 'logtime');
  const dateK = find('date', 'attendancedate', 'punchdate', 'workdate');
  const timeK = find('time', 'punchtimeonly');
  const inK = find('intime', 'in', 'checkin', 'firstin', 'timein');
  const outK = find('outtime', 'out', 'checkout', 'lastout', 'timeout');
  if (!idK) return { error: `Couldn’t find an employee ID column. Columns found: ${keys.join(', ')}` };
  const byKey = new Map();
  for (const e of S.emps) { if (e.bioId) byKey.set(String(e.bioId).trim().toLowerCase(), e); if (e.code) byKey.set(String(e.code).trim().toLowerCase(), e); }
  const out = []; const unknown = new Set(); let bad = 0;
  for (const r of rows) {
    const key = String(r[idK] ?? '').trim().toLowerCase();
    if (!key) continue;
    const emp = byKey.get(key);
    if (!emp) { unknown.add(String(r[idK]).trim()); continue; }
    const whens = [];
    if (dtK) whens.push(parseWhen(r[dtK]));
    else if (dateK && (inK || outK)) { if (r[inK]) whens.push(parseWhen(r[dateK], r[inK])); if (r[outK]) whens.push(parseWhen(r[dateK], r[outK])); }
    else if (dateK && timeK) whens.push(parseWhen(r[dateK], r[timeK]));
    else if (dateK) whens.push(parseWhen(r[dateK]));
    for (const w of whens) { if (!w || isNaN(w) || w.getTime() > Date.now() + 600000) { bad++; continue; } out.push({ emp, t: w.getTime() }); }
  }
  return { punches: out, unknown: [...unknown], bad, cols: { idK, dtK, dateK, timeK, inK, outK } };
}
async function importPunches(list) {
  const groups = new Map();
  for (const p of list) { const d = ymd(new Date(p.t)); const k = `${p.emp.id}|${d}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p.t); }
  const byDoc = new Map();
  for (const [k, ts] of groups) { const [empId, d] = k.split('|'); const dk = attKey(empId, d.slice(0, 7)); if (!byDoc.has(dk)) byDoc.set(dk, { empId, m: d.slice(0, 7), days: {} }); byDoc.get(dk).days[d.slice(8)] = ts; }
  let added = 0, latest = '';
  for (const [dk, g] of byDoc) {
    const doc = clean(S.att[dk] || { empId: g.empId, month: g.m, year: +g.m.slice(0, 4), days: {} });
    delete doc.id;
    for (const [dd, ts] of Object.entries(g.days)) {
      const list = doc.days[dd] || [];
      for (const t of ts) if (!list.some((p) => Math.abs(p.t - t) < 60000)) { list.push({ t, s: 'device' }); added++; }
      doc.days[dd] = list.sort((a, b) => a.t - b.t);
      const d = `${g.m}-${dd}`; if (d > latest) latest = d;
    }
    await put(`att/${dk}`, doc);
  }
  return { added, latest };
}

/* ═════════════ Export ═════════════ */
async function exportXlsx(name, cols, rows) { return exportBook(name, [{ name, cols, rows }]); }
async function exportBook(fileName, sheets, { csv = false } = {}) {
  if (!S.dl) { toast('Downloads aren’t available in this view.', 'warn'); return; }
  const safe = fileName.replace(/[\\/:*?"<>|]/g, '-');
  let data, filename;
  if (!csv && window.XLSX) {
    const wb = XLSX.utils.book_new(), used = new Set();
    for (const sh of sheets) {
      const ws = XLSX.utils.aoa_to_sheet([sh.cols, ...sh.rows]);
      ws['!cols'] = sh.cols.map((c, i) => ({ wch: Math.min(50, Math.max(String(c).length, ...sh.rows.slice(0, 200).map((r) => String(r[i] ?? '').length)) + 2) }));
      if (sh.rows.length) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sh.rows.length, c: sh.cols.length - 1 } }) };
      ws['!freeze'] = { xSplit: 0, ySplit: 1 };
      let n = sh.name.replace(/[\\/:*?[\]]/g, '-').slice(0, 31), k = 2; while (used.has(n)) n = `${sh.name.slice(0, 27)} (${k++})`; used.add(n);
      XLSX.utils.book_append_sheet(wb, ws, n);
    }
    data = new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); filename = `${safe}.xlsx`;
  } else {
    const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const sh = sheets[0];
    data = new Blob(['\ufeff' + [sh.cols, ...sh.rows].map((r) => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' }); filename = `${safe}.csv`;
    if (!csv) toast('Excel library didn’t load — saved as CSV (opens in Excel).', 'warn');
  }
  try { await S.dl.save({ filename, data }); toast('Saved ' + filename); }
  catch (e) { if (e?.code !== 'declined') toast('The file couldn’t be saved here.', 'bad'); }
}
