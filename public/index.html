/* ── delete a direct chat for yourself: hides everything up to now from your chats (on all your devices).
   Nothing shared is removed — the other person keeps the whole conversation, and a new message brings the chat back. ── */
function dmDeleteAsk() {
  const c = myChats().find((x) => x.id === CHAT.openId);
  if (!c || c.kind !== 'dm') return toast('Only direct chats can be deleted this way.', 'warn');
  return confirmBox(`Delete your chat with ${c.title}?`, `The conversation is removed from your chats on all your devices. ${c.title} still keeps their copy. If either of you sends a new message, the chat comes back with only the new messages.`, () => dmDelete(c));
}
async function dmDelete(c) {
  if (!S.uid) fail('Sign in with your own account to delete chats.');
  if (CHAT.openId !== c.id || CHAT.loadedFor !== c.id) fail('Messages are still loading — try again in a moment.');
  // marks by position, not time: each bucket's last entry right now, the latest message, and the pins/notifications so far.
  // Anyone's clock being off can't hide a later message, because later messages are always appended after these marks.
  const old = clearedOf(c.id) || {}, now = CHAT.list.find((x) => x.id === c.id) || c;
  // marks for months that can no longer be loaded are dropped (the loaded window only moves forward), keeping the record small
  const pm = addDays(today().slice(0, 7) + '-01', -1).slice(0, 7);
  const n = Object.fromEntries(Object.entries(old.n || {}).filter(([k]) => k.slice(0, 7) >= pm));
  let pend = null;
  for (const b of CHAT.buckets) {
    const msgs = b.msgs || [], tail = msgs[msgs.length - 1];
    if (tail) n[b.id] = [msgs.length, tail.id, Number(tail.at) || 0];
    // a message whose "last" update hasn't landed yet: remember it too, so when it lands the chat doesn't reappear empty
    const top = msgs.filter((m) => !m.react).pop();
    if (top && (Number(top.at) || 0) > Math.max(Number(now.last?.at) || 0, pend?.at || 0)) pend = { at: Number(top.at) || 0, by: b.by };
  }
  const nt = [...new Set([...(old.nt || []), ...S.ntf.filter((x) => x.go?.chat === c.id).map((x) => x.id)])].slice(-300);
  const entry = { at: Date.now(), n, last: lastSig(now.last), p: (now.pins || []).map((p) => p.id), nt };
  if (pend) entry.pend = lastSig(pend);
  const ref = S.db.doc(`data/users/${S.uid}/cleared`);
  // update merges on the server, so deletions made on another device at the same moment are kept; set only creates the record
  try { await ref.update({ [c.id]: entry }); } catch (e) { if (e?.code !== 'not_found') throw e; await ref.set({ ...CHAT.cleared, [c.id]: entry }); }
  CHAT.cleared = { ...CHAT.cleared, [c.id]: entry };
  if (CHAT.openId === c.id) { voiceStop(true); CH2.picker = null; CH2.editing = null; CHAT.replyTo = null; S.ui.chat = null; S.ui.chFind = ''; CHAT.unsub?.(); CHAT.unsub = null; CHAT.openId = null; }
  schedule();
}

/* ── voice messages: recorded in the browser, sent as a chunked audio file, played inline ── */
const VOICE = { rec: null, stream: null, parts: [], t0: 0, timer: null, cancel: false, mime: '', chatId: null, starting: false };
const VOICE_MAX_MS = 5 * 60000;
const fmtSecs = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
/* Playback uses one <audio> element that lives outside the chat list. The chat list is rebuilt on every
   update (presence, new messages), which would destroy an in-list player mid-playback. */
let VOICE_PLAYER = null;
function voicePlayer() {
  if (!VOICE_PLAYER) {
    VOICE_PLAYER = document.createElement('audio');
    VOICE_PLAYER.preload = 'auto';
    for (const ev of ['play', 'pause', 'ended']) VOICE_PLAYER.addEventListener(ev, () => schedule());
    document.body.appendChild(VOICE_PLAYER);
  }
  return VOICE_PLAYER;
}
const voicePlaying = (fid) => !!VOICE_PLAYER && VOICE_PLAYER.dataset.fid === fid && !VOICE_PLAYER.paused;
const voiceChip = (f) => `<button type="button" class="voice-note" data-a="chat-voice-play" data-fid="${esc(f.fid)}" aria-label="${voicePlaying(f.fid) ? 'Pause' : 'Play'} voice message, ${fmtSecs(f.dur || 0)}"><span class="vp-ico" aria-hidden="true">${voicePlaying(f.fid) ? '❚❚' : '▶'}</span><span class="vp-len">${f.dur ? fmtSecs(f.dur) : ''}</span><span class="tiny muted">voice message</span></button>`;
async function voicePlay(fid) {
  const m = messagesOf().find((x) => x.file?.fid === fid);
  if (!m) return toast('That voice message is no longer available.', 'warn');
  const p = voicePlayer();
  if (p.dataset.fid === fid) { if (p.paused) return p.play().catch((e) => voiceFail(e, p)); return p.pause(); }
  p.pause(); p.dataset.fid = fid;
  try { p.src = await previewSrc(m.file); await p.play(); }
  catch (e) { voiceFail(e, p); }
}
function voiceFail(e, p) {
  if (e?.name === 'AbortError') return; // a newer play/pause took over
  console.error('Voice message playback failed:', e?.name, e?.message, 'media error code:', p?.error?.code, p?.error?.message || '');
  toast(e?.user ? e.message : 'This voice message couldn’t be played. Try again.', 'bad');
}
const voiceBar = () => `<div class="voice-bar"><span class="rec-dot" aria-hidden="true"></span><b id="voice-t">${fmtSecs(Math.floor((Date.now() - VOICE.t0) / 1000))}</b><span class="tiny muted grow">Recording… (max 5 min)</span><button type="button" class="btn ghost sm" data-a="chat-voice-cancel">Cancel</button><button type="button" class="btn pri sm" data-a="chat-voice-send">Send voice</button></div>`;
async function voiceStart() {
  if (VOICE.rec || VOICE.starting) return;
  if (!CHAT.openId) return toast('Open a chat first.', 'warn');
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) return toast('Voice messages aren’t supported in this browser.', 'warn');
  VOICE.starting = true;
  try {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { console.error('Voice message: microphone error', e?.name, e?.message); return toast(micErrorText(e), 'warn'); }
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    Object.assign(VOICE, { rec, stream, parts: [], t0: Date.now(), cancel: false, mime: rec.mimeType || type || 'audio/webm', chatId: CHAT.openId });
    rec.ondataavailable = (e) => { if (e.data?.size) VOICE.parts.push(e.data); };
    rec.onstop = voiceFinish;
    rec.start(1000);
    VOICE.timer = setInterval(() => {
      const el = document.getElementById('voice-t');
      if (el) el.textContent = fmtSecs(Math.floor((Date.now() - VOICE.t0) / 1000));
      if (Date.now() - VOICE.t0 >= VOICE_MAX_MS) voiceStop(false);
    }, 500);
    schedule();
  } finally { VOICE.starting = false; }
}
/* The message names the real cause, so a blocked site policy, a blocked browser permission, and a missing or busy device are told apart. */
function micErrorText(e) {
  const msg = String(e?.message || '');
  if (e?.name === 'NotAllowedError' && /polic/i.test(msg)) return 'This site’s security settings block the microphone. Ask the admin to check the app’s Permissions-Policy.';
  if (e?.name === 'NotAllowedError' || e?.name === 'SecurityError') return 'The browser is blocking the microphone. Click the lock icon in the address bar, set Microphone to Allow, then reload.';
  if (e?.name === 'NotFoundError' || e?.name === 'OverconstrainedError') return 'No microphone was found on this device.';
  if (e?.name === 'NotReadableError' || e?.name === 'AbortError') return 'The microphone is in use by another app. Close it and try again.';
  return `Couldn’t start the microphone (${e?.name || 'unknown error'}).`;
}
function voiceStop(cancel) {
  if (!VOICE.rec) return;
  VOICE.cancel = cancel;
  if (VOICE.rec.state !== 'inactive') VOICE.rec.stop();
}
async function voiceFinish() {
  const { parts, mime, cancel, chatId, t0, stream, timer } = VOICE;
  clearInterval(timer);
  stream?.getTracks().forEach((t) => t.stop());
  Object.assign(VOICE, { rec: null, stream: null, parts: [], timer: null });
  const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
  schedule();
  if (cancel) return;
  if (CHAT.openId !== chatId) return toast('Voice message discarded — you switched chats.', 'warn');
  const blob = new Blob(parts, { type: mime });
  if (!blob.size) return toast('Nothing was recorded.', 'warn');
  if (blob.size > MAX_CHUNKED) return toast('That voice message is too long to send. Try a shorter one.', 'warn');
  const ext = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
  await act(async () => {
    try {
      const { fid, chunks } = await putChunked(new Uint8Array(await blob.arrayBuffer()), 'Voice message');
      CHAT.stick = true;
      await sendMessage('', { name: 'Voice message', size: blob.size, ext, mime, fid, chunks, voice: true, dur: secs });
    } finally { CHAT.uploading = null; schedule(); }
  });
}

/* ── quick search / command palette (Ctrl/⌘ K) ── */
const CMDK = { idx: 0 };
function openCmdk() { if (!S.me || isAuthed() !== true) return; CMDK.idx = 0; S.ui.cmdq = ''; openModal(cmdkModal); setTimeout(() => $('#cmdk-q')?.focus(), 30); }
function cmdkItems() {
  const q = (S.ui.cmdq || '').trim().toLowerCase(), out = [];
  const vis = VIEWS.filter((v) => v[2]());
  const has = (s) => String(s || '').toLowerCase().includes(q);
  for (const [k, l] of vis) if (!q || has(l)) out.push({ g: 'Go to', ico: k, label: l, a: 'nav', v: k });
  if (canSalary() && (!q || has('salary payroll'))) out.push({ g: 'Go to', ico: 'attendance', label: 'Salary sheet & payroll', a: 'cmdk-tab', v: 'attendance', tab: ['attTab', 'salary'] });
  if (q) {
    [['Apply for leave', 'apply-leave'], ['New task', 'new-task'], ['New expense claim', 'claim-new'], ['Raise a request', 'new-req'], ['New group chat', 'chat-new'], ['My account & password', 'acct']].filter(([l]) => has(l)).forEach(([l, a]) => out.push({ g: 'Actions', ico: 'more', label: l, a }));
    active().filter((e) => has(e.name) || has(e.code) || has(e.designation)).slice(0, 6).forEach((e) => out.push({ g: 'People', av: e.name, label: e.name, sub: `${e.code || ''} · ${e.designation || ''}`, a: e.id === S.me.id ? 'acct' : 'dm', id: e.id }));
    S.tasks.filter((t) => (canSee(t.assigneeId) || t.assignerId === S.me.id) && (has(t.title) || has(t.code))).slice(0, 6).forEach((t) => out.push({ g: 'Tasks', ico: 'tasks', label: `${t.code} · ${t.title}`, sub: `${nameOf(t.assigneeId)} · due ${fmtDs(t.due)}`, a: 'task', id: t.id }));
    S.reqs.filter((r) => (r.empId === S.me.id || curStep(r)?.by === S.me.id || canSee(r.empId)) && (has(r.title) || has(r.code))).slice(0, 6).forEach((r) => out.push({ g: 'Requests', ico: 'approvals', label: `${r.code} · ${r.title}`, sub: `${nameOf(r.empId)} · ${RSTAT[r.status]?.[0] || r.status}`, a: 'req', id: r.id }));
    myChats().filter((c) => has(c.title)).slice(0, 5).forEach((c) => out.push({ g: 'Chats', ico: 'chats', label: c.title, sub: c.kind === 'dm' ? 'Direct message' : `${chatMembers(c).length} members`, a: 'cmdk-chat', id: c.id }));
  }
  return out.slice(0, 30);
}
function cmdkModal() {
  const items = cmdkItems(); CMDK.idx = Math.min(CMDK.idx, Math.max(0, items.length - 1));
  let g = '';
  return `<div class="cmdk"><div class="cmdk-in"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg><input class="i" id="cmdk-q" data-i="cmdq" value="${esc(S.ui.cmdq || '')}" placeholder="Search people, tasks, requests, chats — or jump to a page" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="cmdk-list">${items.map((it, i) => { const head = it.g !== g ? `<div class="cmdk-g">${(g = it.g)}</div>` : ''; return `${head}<button class="cmdk-it ${i === CMDK.idx ? 'on' : ''}" data-a="cmdk-go" data-i="${i}">${it.av ? avatar(it.av) : `<span class="cmdk-ico">${ico(it.ico)}</span>`}<span class="grow" style="min-width:0"><span class="trunc" style="display:block">${esc(it.label)}</span>${it.sub ? `<span class="tiny muted trunc" style="display:block">${esc(it.sub)}</span>` : ''}</span><span class="tiny muted">↵</span></button>`; }).join('') || empty('Nothing matches.')}</div>
    <div class="cmdk-foot tiny muted">↑ ↓ to move · Enter to open · Ctrl/⌘ K anywhere</div></div>`;
}
function cmdkKey(ev) {
  const items = cmdkItems();
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); CMDK.idx = (CMDK.idx + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length); drawModal(); }
  if (ev.key === 'Enter') { ev.preventDefault(); cmdkRun(items[CMDK.idx]); }
}
function cmdkRun(it) {
  if (!it) return;
  closeModal();
  const fake = { dataset: { v: it.v, id: it.id, go: it.v } };
  if (it.a === 'cmdk-tab') { S.ui[it.tab[0]] = it.tab[1]; return setView(it.v); }
  if (it.a === 'cmdk-chat') { S.ui.chat = it.id; S.ui.chTab = 'msgs'; return setView('chats'); }
  onAction(it.a, fake, new Event('click'));
}

<script>
/* ═════════════ Vercel host overrides ═════════════
   On Vercel, sign-in is handled by the server (HttpOnly session cookie, scrypt password hashes in Postgres),
   so the in-page password screens of the artifact build are replaced here. Loaded after every other part
   except the boot part, so these declarations win. */
function isAuthed() { return !!S.me; }
function signOut() {
  fetch('/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).finally(() => location.reload());
}
async function authSubmit(f, form, fd) {
  const v = (k) => String(fd.get(k) ?? '');
  try {
    if (f === 'auth-change') {
      if (v('pw') !== v('pw2')) fail('The two new passwords don’t match.');
      await OH.api('auth/change', { current: v('cur'), password: v('pw') });
      closeModal(); toast('Password changed');
      return;
    }
    if (f === 'acct-prefs') { await patch(`emp/${S.me.id}`, { prefs: { ...(S.me.prefs || {}), email: fd.get('mail') === 'on' } }); closeModal(); toast('Saved'); return; }
  } catch (e) { toast(e.user || e instanceof Error ? e.message : errText(e), 'bad'); }
}
// Shown only if the signed-in account is not linked to an active employee any more.
function vSignup() {
  return `<div class="splash"><div class="brand"><div class="mark">OH</div><div><b>OfficeHub</b><small>${esc(cfg().company)}</small></div></div>
    <h1>Your account isn’t active</h1><p class="muted">Your login is not linked to an active employee record. Ask HR to check your record on the People page.</p>
    <p><button class="btn" data-a="acct-signout">Sign out</button></p></div>`;
}
</script>

<script>
/* ═════════════ Complaints & grievances ═════════════
   Anonymous by design. The server keeps each complainant's identity in a separate record that only
   administrators can read. HR, managers and directors see every complaint, with the complainant shown as
   "Anonymous". Everyone else sees only the complaints they raised. All of these rules are enforced in
   server/complaints.js; this panel only shows what the server sends. */
const CMP = { list: [], names: null, sub: false, subAdmin: false };
const CMP_CATS = ['Harassment', 'Discrimination', 'Safety', 'Pay or benefits', 'Workplace conflict', 'Policy violation', 'Other'];
const CMP_PRI = { LOW: ['Low', ''], MEDIUM: ['Medium', 't-acc'], HIGH: ['High', 't-warn'], URGENT: ['Urgent', 't-bad'] };
const CMP_ST = { OPEN: ['Open', 't-acc'], WORKING: ['Working', 't-warn'], RESOLVED: ['Resolved', 't-ok'], CLOSED: ['Closed', ''] };
const CMP_SLA = { within: ['Within SLA', 't-ok'], due: ['Due soon', 't-warn'], breached: ['Breached', 't-bad'] };
const CMP_SOON_MS = 24 * 3600000, CMP_MAX_FILES = 3, CMP_MAX_BYTES = 6 * 1024 * 1024;
const cmpStaff = () => isManager() || S.me?.role === 'MANAGER';
const cmpIsAdmin = () => S.me?.role === 'ADMIN';
const cmpCanAssign = (e) => ['ADMIN', 'HR', 'DIRECTOR', 'MANAGER'].includes(e.role) || cfg().depts.some((d) => d.headId === e.id) || S.emps.some((x) => x.managerId === e.id);

/* SLA: 7 days from when the complaint is raised. Closed items are judged on when they were resolved. */
function cmpSla(c, now = Date.now()) {
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') return (c.resolvedAt || c.closedAt || c.updatedAt || now) <= c.dueAt ? 'within' : 'breached';
  if (now > c.dueAt) return 'breached';
  return c.dueAt - now <= CMP_SOON_MS ? 'due' : 'within';
}

function cmpEnsure() {
  if (!S.db || !S.me) return;
  if (!CMP.sub) { CMP.sub = true; S.db.collection('complaint').onSnapshot((q) => { CMP.list = docsOf(q); schedule(); }, () => {}); }
  if (cmpIsAdmin() && !CMP.subAdmin) {
    CMP.subAdmin = true;
    S.db.collection('complaintsecret').onSnapshot((q) => { CMP.names = Object.fromEntries(docsOf(q).map((d) => [d.id, d.by])); schedule(); }, () => {});
  }
}

function cmpRows() {
  const q = ui('cmpQ', '').trim().toLowerCase(), st = ui('cmpSt', ''), pr = ui('cmpPr', ''), cat = ui('cmpCat', ''), sla = ui('cmpSla', ''), who = ui('cmpWho', '');
  return CMP.list.filter((c) => (!st || c.status === st) && (!pr || c.priority === pr) && (!cat || c.category === cat) && (!sla || cmpSla(c) === sla)
    && (!who || (who === 'mine' ? c.assignedTo === S.me.id : !c.assignedTo))
    && (!q || [c.code, c.subject, c.description, c.category].some((x) => String(x || '').toLowerCase().includes(q))))
    .sort((a, b) => b.createdAt - a.createdAt);
}

function vComplaints() {
  cmpEnsure();
  const staff = cmpStaff(), all = CMP.list, rows = cmpRows();
  const n = (f) => all.filter(f).length;
  const summary = staff ? `<div class="row" style="gap:10px;flex-wrap:wrap;margin-bottom:12px">
    ${[['Open or working', n((c) => c.status === 'OPEN' || c.status === 'WORKING')], ['Due soon', n((c) => (c.status === 'OPEN' || c.status === 'WORKING') && cmpSla(c) === 'due')], ['Breached', n((c) => (c.status === 'OPEN' || c.status === 'WORKING') && cmpSla(c) === 'breached')], ['Resolved or closed', n((c) => c.status === 'RESOLVED' || c.status === 'CLOSED')]]
      .map(([l, v]) => `<div class="card body" style="min-width:150px;padding:10px 14px"><span class="tiny muted">${l}</span><div style="font:600 1.4rem var(--f-display)">${v}</div></div>`).join('')}</div>` : '';
  const filters = `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <input class="i" data-i="cmpQ" placeholder="Search code, subject or description" value="${esc(ui('cmpQ', ''))}" style="min-width:230px">
    <select class="i" style="width:auto;min-width:150px" data-c="cmpSt" aria-label="Status">${opts(Object.entries(CMP_ST).map(([k, v]) => [k, v[0]]), ui('cmpSt', ''), 'All statuses')}</select>
    <select class="i" style="width:auto;min-width:150px" data-c="cmpPr" aria-label="Priority">${opts(Object.entries(CMP_PRI).map(([k, v]) => [k, v[0]]), ui('cmpPr', ''), 'All priorities')}</select>
    <select class="i" style="width:auto;min-width:150px" data-c="cmpCat" aria-label="Category">${opts(CMP_CATS.map((c) => [c, c]), ui('cmpCat', ''), 'All categories')}</select>
    <select class="i" style="width:auto;min-width:150px" data-c="cmpSla" aria-label="SLA">${opts([['within', 'Within SLA'], ['due', 'Due soon'], ['breached', 'Breached']], ui('cmpSla', ''), 'Any SLA')}</select>
    ${staff ? `<select class="i" style="width:auto;min-width:150px" data-c="cmpWho" aria-label="Assignment">${opts([['mine', 'Assigned to me'], ['none', 'Unassigned']], ui('cmpWho', ''), 'Everything')}</select>` : ''}
  </div>`;
  const list = rows.length
    ? `<div class="card" style="overflow:hidden;padding:0">${rows.map(cmpRow).join('')}</div>`
    : empty(all.length ? 'No complaints match these filters.' : 'No complaints yet. Use “+ New complaint” to raise one. You can stay anonymous.');
  const intro = staff ? '' : '<p class="tiny muted" style="margin:0 0 12px">These are the complaints you raised. HR and managers see them without your name. Only the administrator can see who raised a complaint, and only to act on a serious case.</p>';
  return shell(`${summary}${filters}${intro}${list}`, 'Complaints & grievances',
    staff ? 'Every complaint, with the complainant kept anonymous' : 'Raise a concern privately and track it',
    '<button class="btn pri" data-a="cmp-new">+ New complaint</button>');
}

function cmpRow(c) {
  const assignee = c.assignedTo ? nameOf(c.assignedTo) : 'Not assigned';
  return `<button class="cmp-row" data-a="cmp-open" data-id="${esc(c.id)}">
    <span class="grow" style="min-width:0;text-align:left"><b class="trunc" style="display:block">${esc(c.code)} · ${esc(c.subject)}</b>
    <span class="tiny muted">${esc(c.category)} · raised ${fmtDT(c.createdAt)} · due ${fmtDT(c.dueAt)}</span></span>
    <span class="cmp-pills">${pill(CMP_PRI, c.priority)}${pill(CMP_ST, c.status)}${pill(CMP_SLA, cmpSla(c))}</span>
    ${cmpStaff() ? `<span class="tiny muted" style="min-width:110px;text-align:right">${esc(assignee)}</span>` : ''}
  </button>`;
}

function cmpNewModal() {
  return `${mhead('New complaint', 'Your name is not shown to HR or managers. The system keeps a record of who raised it, which only the administrator can see.')}
    <form data-f="cmp-create"><div class="body fgrid">
      <label class="f">Category<select class="i" name="category" required>${opts(CMP_CATS.map((c) => [c, c]), '', 'Choose…')}</select></label>
      <label class="f">Priority<select class="i" name="priority">${opts(Object.entries(CMP_PRI).map(([k, v]) => [k, v[0]]), 'MEDIUM')}</select></label>
      <label class="f full">Subject<input class="i" name="subject" required minlength="3" maxlength="150" placeholder="A short summary"></label>
      <label class="f full">Description<textarea class="i" name="description" required minlength="10" maxlength="4000" rows="6" placeholder="What happened, when and where. Names are optional."></textarea></label>
      <label class="f full">Attachments (optional: up to ${CMP_MAX_FILES} files, 6 MB each)<input class="i" type="file" name="files" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.docx,.xlsx,.pptx,.csv,.txt,.zip"></label>
      <p class="tiny muted full" style="margin:0">Check attachments before you send them: they can contain names or other details that identify you.</p>
    </div><footer><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri">Submit</button></footer></form>`;
}

function cmpDetail() {
  const c = CMP.list.find((x) => x.id === S.ui.cmpOpen);
  if (!c) return null;
  const staff = cmpStaff(), admin = cmpIsAdmin();
  const who = admin
    ? (CMP.names ? `${esc(CMP.names[c.id] ? nameOf(CMP.names[c.id]) : 'Unknown')} <span class="tiny muted">· visible to administrators only</span>` : 'Loading…')
    : staff ? 'Anonymous' : 'You (anonymous to HR and managers)';
  const files = (c.attachments || []).map((f, i) => (staff
    ? `<button class="chat-file" data-a="cmp-file" data-id="${esc(c.id)}" data-n="${i}"><span class="ficon">${esc((f.ext || 'file').slice(0, 3).toUpperCase())}</span><span class="grow" style="min-width:0;text-align:left"><span class="trunc" style="display:block">${esc(f.name)}</span><span class="tiny muted">${fsize(f.size)} · Download</span></span></button>`
    : `<div class="tiny muted">📎 ${esc(f.name)} (${fsize(f.size)})</div>`)).join('') || '<span class="tiny muted">No attachments.</span>';
  const history = (c.log || []).slice().reverse().map((l) => `<div class="tiny" style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${esc(nameOf(l.by))}</b> · ${fmtDT(l.at)} — ${esc(l.text)}</div>`).join('') || '<span class="tiny muted">No updates yet.</span>';
  const manage = staff ? `<form data-f="cmp-update" data-id="${esc(c.id)}" class="card body fgrid" style="padding:12px">
      <label class="f">Status<select class="i" name="status">${opts(Object.entries(CMP_ST).map(([k, v]) => [k, v[0]]), c.status)}</select></label>
      <label class="f">Priority<select class="i" name="priority">${opts(Object.entries(CMP_PRI).map(([k, v]) => [k, v[0]]), c.priority)}</select></label>
      <label class="f full">Assigned to<select class="i" name="assignedTo">${opts(active().filter(cmpCanAssign).sort((a, b) => a.name.localeCompare(b.name)).map((e) => [e.id, e.name]), c.assignedTo || '', 'Not assigned')}</select></label>
      <label class="f full">Add a note to the record<textarea class="i" name="note" rows="2" maxlength="2000" placeholder="Optional"></textarea></label>
      <div class="full"><button class="btn pri">Save changes</button></div></form>` : '';
  return `${mhead(`${esc(c.code)} · ${esc(c.subject)}`, `${esc(c.category)} · raised ${fmtDT(c.createdAt)}`)}
    <div class="body">
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${pill(CMP_PRI, c.priority)}${pill(CMP_ST, c.status)}${pill(CMP_SLA, cmpSla(c))}<span class="tiny muted">Due ${fmtDT(c.dueAt)}</span></div>
      <div class="kv" style="grid-template-columns:1fr"><div><span>Complainant</span><b>${who}</b></div>${staff ? `<div><span>Assigned to</span><b>${c.assignedTo ? esc(nameOf(c.assignedTo)) : 'Not assigned'}</b></div>` : ''}</div>
      <h3 style="margin:14px 0 4px">Description</h3>
      <div class="cmp-desc">${esc(c.description)}</div>
      <h3 style="margin:14px 0 6px">Attachments</h3>
      <div class="chat-files" style="padding:0">${files}</div>
      ${manage}
      <h3 style="margin:14px 0 6px">History</h3>
      <div>${history}</div>
    </div>
    <footer>${admin && staff ? `<button type="button" class="btn danger" data-a="cmp-delete" data-id="${esc(c.id)}">Delete complaint</button>` : ''}<button type="button" class="btn" data-a="close">Close</button></footer>`;
}

/* ── actions and forms ── */
async function cmpAction(a, el) {
  switch (a) {
    case 'cmp-new': return openModal(cmpNewModal);
    case 'cmp-open': S.ui.cmpOpen = el.dataset.id; return openModal(cmpDetail);
    case 'cmp-file': {
      const c = CMP.list.find((x) => x.id === el.dataset.id), f = c?.attachments?.[+el.dataset.n];
      if (f) return act(() => saveFile(f));
      return;
    }
    case 'cmp-delete': {
      const c = CMP.list.find((x) => x.id === el.dataset.id);
      if (!c) return;
      return confirmBox(`Delete ${c.code}?`, 'The complaint, its history, its attachments and the complainant record are removed for good.', () => cmpDelete(c));
    }
  }
}
async function cmpSubmit(f, form, fd) {
  if (f === 'cmp-create') return cmpCreate(fd);
  if (f === 'cmp-update') return cmpUpdate(form, fd);
}

async function cmpApi(path, body) {
  const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin', cache: 'no-store' });
  let j = null; try { j = await r.json(); } catch { /* not JSON */ }
  if (!r.ok) throw Object.assign(new Error((j && j.message) || 'That didn’t save. Check your connection and try again.'), { user: true });
  return j || {};
}

async function cmpCreate(fd) {
  const files = fd.getAll('files').filter((x) => x && x.size);
  if (files.length > CMP_MAX_FILES) return toast(`Attach up to ${CMP_MAX_FILES} files.`, 'warn');
  for (const f of files) {
    if (f.size > CMP_MAX_BYTES) return toast(`${f.name} is larger than 6 MB.`, 'warn');
    if (!CHUNK_TYPES.includes(extOf(f.name))) return toast(`${f.name}: that file type can’t be attached.`, 'warn');
  }
  const ok = await act(async () => {
    try {
      const attachments = [];
      for (const f of files) {
        const { fid, chunks } = await putChunked(new Uint8Array(await f.arrayBuffer()), f.name, 'complaintfile');
        attachments.push({ fid, chunks, name: f.name, size: f.size, ext: extOf(f.name), mime: ASSET_TYPES[extOf(f.name)] || '' });
      }
      await cmpApi('complaints/submit', { category: fd.get('category'), priority: fd.get('priority'), subject: fd.get('subject'), description: fd.get('description'), attachments });
      closeModal();
    } finally { CHAT.uploading = null; schedule(); }
  }, 'Complaint submitted. Thank you for speaking up.');
  return ok;
}

async function cmpUpdate(form, fd) {
  const c = CMP.list.find((x) => x.id === form.dataset.id);
  if (!c) return toast('That complaint no longer exists.', 'warn');
  const status = String(fd.get('status')), priority = String(fd.get('priority'));
  const assignedTo = String(fd.get('assignedTo') || '') || null, note = String(fd.get('note') || '').trim();
  const now = Date.now(), changes = [];
  if (status !== c.status) changes.push(`status ${CMP_ST[c.status][0]} → ${CMP_ST[status][0]}`);
  if (priority !== c.priority) changes.push(`priority ${CMP_PRI[priority][0]}`);
  if (assignedTo !== (c.assignedTo || null)) changes.push(assignedTo ? `assigned to ${nameOf(assignedTo)}` : 'unassigned');
  if (!changes.length && !note) return toast('Nothing to save.', 'warn');
  const log = [...(c.log || [])];
  if (changes.length) log.push({ at: now, by: S.me.id, text: changes.join('; ') });
  if (note) log.push({ at: now, by: S.me.id, text: note });
  const doc = { status, priority, assignedTo, log, updatedAt: now };
  if ((status === 'RESOLVED' || status === 'CLOSED') && !c.resolvedAt) doc.resolvedAt = now;
  if (status === 'CLOSED' && !c.closedAt) doc.closedAt = now;
  if (status === 'OPEN' || status === 'WORKING') { doc.resolvedAt = null; doc.closedAt = null; }
  return act(async () => {
    await patch(`complaint/${c.id}`, doc);
    if (assignedTo && assignedTo !== c.assignedTo) await notify([assignedTo], { title: 'A complaint was assigned to you', body: `${c.code} · ${c.category}`, go: { view: 'complaints' } });
    await audit('COMPLAINT_UPDATED', { complaint: c.id, status });
  }, 'Saved');
}

async function cmpDelete(c) {
  await act(async () => {
    for (const f of c.attachments || []) for (let i = 0; i < (f.chunks || 0); i++) await docRef(`complaintfile/${f.fid}_${i}`).delete();
    await docRef(`complaintsecret/${c.id}`).delete();
    await docRef(`complaint/${c.id}`).delete();
    await audit('COMPLAINT_DELETED', { complaint: c.id });
    S.ui.cmpOpen = null;
    closeModal();
  }, 'Complaint deleted');
}
</script>

.cmp-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;cursor:pointer;color:var(--ink);text-align:left}
.cmp-row:hover{background:var(--sunk)}
.cmp-row:last-child{border-bottom:0}
.cmp-pills{display:flex;gap:6px;flex-wrap:wrap}
.cmp-desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem;line-height:1.55;background:var(--sunk);border-radius:10px;padding:10px 12px}
</style>

<script>
/* ═════════════ Policies ═════════════
   Company, department and group policies. Managers (administrators, HR, directors, managers and department heads)
   post them; the server decides who may see what (server/policy.js). Employees only receive published policies that
   apply to them; managers also see drafts. */
const POL = { list: [], sub: false };
const POL_CATS = ['HR & people', 'Leave & attendance', 'Expenses & finance', 'IT & security', 'Health & safety', 'Code of conduct', 'Operations', 'General'];
const POL_ST = { draft: ['Draft', ''], published: ['Published', 't-ok'] };
const POL_MAX_FILES = 3, POL_MAX_BYTES = 6 * 1024 * 1024;
const polManager = () => isManager() || S.me?.role === 'MANAGER';
const polCanCompany = () => isHR();
const polDeptChoices = () => cfg().depts.filter((d) => isHR() || d.headId === S.me.id);
const polPeopleChoices = () => active().filter((e) => e.id !== S.me.id && (isHR() || e.managerId === S.me.id)).sort((a, b) => a.name.localeCompare(b.name));
const polStatus = (p) => (p.published === true ? 'published' : 'draft');

function polScopeText(p) {
  const a = p.audience || {};
  if (a.scope === 'company') return 'Company-wide';
  if (a.scope === 'depts') return `Departments: ${(a.depts || []).map((id) => deptOf(id)?.name || 'Unknown').join(', ')}`;
  return `Selected people (${(a.people || []).length})`;
}

function polEnsure() {
  if (!S.db || !S.me || POL.sub) return;
  POL.sub = true;
  S.db.collection('policy').onSnapshot((q) => { POL.list = docsOf(q); schedule(); }, () => {});
}

function polRows() {
  const q = ui('polQ', '').trim().toLowerCase(), cat = ui('polCat', ''), sc = ui('polScope', ''), st = ui('polSt', '');
  return POL.list.filter((p) => (!cat || p.category === cat) && (!sc || p.audience?.scope === sc) && (!st || polStatus(p) === st)
    && (!q || [p.title, p.content, p.category].some((x) => String(x || '').toLowerCase().includes(q))))
    .sort((a, b) => (b.publishedAt || b.updatedAt || 0) - (a.publishedAt || a.updatedAt || 0));
}

function vPolicies() {
  polEnsure();
  const mgr = polManager(), rows = polRows();
  const filters = `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <input class="i" data-i="polQ" placeholder="Search title or text" value="${esc(ui('polQ', ''))}" style="min-width:230px">
    <select class="i" style="width:auto;min-width:160px" data-c="polCat" aria-label="Category">${opts(POL_CATS.map((c) => [c, c]), ui('polCat', ''), 'All categories')}</select>
    <select class="i" style="width:auto;min-width:160px" data-c="polScope" aria-label="Audience">${opts([['company', 'Company-wide'], ['depts', 'Departments'], ['people', 'Selected people']], ui('polScope', ''), 'Any audience')}</select>
    ${mgr ? `<select class="i" style="width:auto;min-width:140px" data-c="polSt" aria-label="Status">${opts([['published', 'Published'], ['draft', 'Drafts']], ui('polSt', ''), 'Any status')}</select>` : ''}
  </div>`;
  const list = rows.length
    ? `<div class="card" style="overflow:hidden;padding:0">${rows.map(polRow).join('')}</div>`
    : empty(POL.list.length ? 'No policies match these filters.' : (mgr ? 'No policies yet. Use “+ New policy” to post one.' : 'No policies apply to you yet.'));
  return shell(`${filters}${list}`, 'Policies',
    mgr ? 'Post company, department or group policies, and publish when they are ready' : 'Policies that apply to you',
    mgr ? '<button class="btn pri" data-a="pol-new">+ New policy</button>' : '');
}

function polRow(p) {
  return `<button class="cmp-row" data-a="pol-open" data-id="${esc(p.id)}">
    <span class="grow" style="min-width:0;text-align:left"><b class="trunc" style="display:block">${esc(p.title)}</b>
    <span class="tiny muted">${esc(p.category)} · ${esc(polScopeText(p))} · ${p.attachments?.length ? `${p.attachments.length} attachment${p.attachments.length > 1 ? 's' : ''} · ` : ''}by ${esc(nameOf(p.createdBy))} · ${fmtDT(p.publishedAt || p.updatedAt)}</span></span>
    <span class="cmp-pills">${polManager() ? pill(POL_ST, polStatus(p)) : ''}</span>
  </button>`;
}

function polDetail() {
  const p = POL.list.find((x) => x.id === S.ui.polOpen);
  if (!p) return null;
  const mgr = polManager(), author = p.createdBy === S.me.id || isHR();
  const files = (p.attachments || []).map((f, i) => `<button class="chat-file" data-a="pol-file" data-id="${esc(p.id)}" data-n="${i}"><span class="ficon">${esc((f.ext || 'file').slice(0, 3).toUpperCase())}</span><span class="grow" style="min-width:0;text-align:left"><span class="trunc" style="display:block">${esc(f.name)}</span><span class="tiny muted">${fsize(f.size)} · Download</span></span></button>`).join('') || '<span class="tiny muted">No attachments.</span>';
  const who = mgr ? `<div class="kv" style="grid-template-columns:1fr"><div><span>Audience</span><b>${esc(polScopeText(p))}</b></div>${p.audience?.scope === 'people' ? `<div><span>People</span><b>${(p.audience.people || []).map((id) => esc(nameOf(id))).join(', ')}</b></div>` : ''}</div>` : '';
  const controls = mgr && author ? `<div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn" data-a="pol-edit" data-id="${esc(p.id)}">Edit</button>
      <button class="btn ${p.published ? '' : 'pri'}" data-a="pol-toggle" data-id="${esc(p.id)}">${p.published ? 'Unpublish' : 'Publish'}</button>
    </div>` : '';
  return `${mhead(esc(p.title), `${esc(p.category)} · ${esc(polScopeText(p))}`)}
    <div class="body">
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${mgr ? pill(POL_ST, polStatus(p)) : ''}<span class="tiny muted">By ${esc(nameOf(p.createdBy))} · ${p.publishedAt ? `published ${fmtDT(p.publishedAt)}` : `last updated ${fmtDT(p.updatedAt)}`}</span></div>
      ${who}
      <h3 style="margin:14px 0 6px">Policy</h3>
      <div class="cmp-desc">${esc(p.content)}</div>
      <h3 style="margin:14px 0 6px">Attachments</h3>
      <div class="chat-files" style="padding:0">${files}</div>
      ${controls ? `<div style="margin-top:14px">${controls}</div>` : ''}
    </div>
    <footer>${mgr && (isHR()) ? `<button type="button" class="btn danger" data-a="pol-delete" data-id="${esc(p.id)}">Delete policy</button>` : ''}<button type="button" class="btn" data-a="close">Close</button></footer>`;
}

function polForm(p) {
  const a = p?.audience || { scope: polCanCompany() ? 'company' : 'depts' };
  const deptChecked = new Set(a.scope === 'depts' ? a.depts || [] : []), peopleChecked = new Set(a.scope === 'people' ? a.people || [] : []);
  const scopes = [...(polCanCompany() ? [['company', 'Company-wide']] : []), ['depts', 'Departments'], ['people', 'Selected people']];
  const depts = polDeptChoices(), people = polPeopleChoices();
  const kept = (p?.attachments || []).map((f) => `<label class="check"><input type="checkbox" name="drop" value="${esc(f.fid)}"> Remove ${esc(f.name)}</label>`).join('');
  return `${mhead(p ? 'Edit policy' : 'New policy', 'Employees see a published policy only if it applies to them.')}
    <form data-f="${p ? 'pol-save' : 'pol-create'}" data-id="${p ? esc(p.id) : ''}"><div class="body fgrid">
      <label class="f full">Title<input class="i" name="title" required minlength="3" maxlength="150" value="${esc(p?.title || '')}" placeholder="e.g. Annual leave carry-forward"></label>
      <label class="f">Category<select class="i" name="category" required>${opts(POL_CATS.map((c) => [c, c]), p?.category || '', 'Choose…')}</select></label>
      <label class="f">Audience<select class="i" name="scope" id="pol-scope">${opts(scopes, a.scope)}</select></label>
      <div class="f full"><span class="small muted">Departments (for a department policy)</span>
        <div style="max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px" class="grid">${depts.map((d) => `<label class="check"><input type="checkbox" name="depts" value="${esc(d.id)}" ${deptChecked.has(d.id) ? 'checked' : ''}> ${esc(d.name)}</label>`).join('') || '<span class="tiny muted">No departments you head.</span>'}</div></div>
      <div class="f full"><span class="small muted">People (for a group or individual policy)</span>
        <div style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px" class="grid g2">${people.map((e) => `<label class="check"><input type="checkbox" name="people" value="${esc(e.id)}" ${peopleChecked.has(e.id) ? 'checked' : ''}> ${esc(e.name)} <span class="tiny muted">${esc(deptOf(e.deptId)?.code || '')}</span></label>`).join('') || '<span class="tiny muted">No one you manage yet.</span>'}</div></div>
      <label class="f full">Policy text<textarea class="i" name="content" required minlength="10" maxlength="20000" rows="8" placeholder="Write the policy in full">${esc(p?.content || '')}</textarea></label>
      ${kept ? `<div class="f full"><span class="small muted">Current attachments</span>${kept}</div>` : ''}
      <label class="f full">Attach files (optional: up to ${POL_MAX_FILES} files, 6 MB each)<input class="i" type="file" name="files" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.docx,.xlsx,.pptx,.csv,.txt,.zip"></label>
      <label class="check full"><input type="checkbox" name="publish" ${p?.published ? 'checked' : ''}> Publish now (otherwise saved as a draft)</label>
    </div><footer><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri">${p ? 'Save' : 'Save policy'}</button></footer></form>`;
}

/* ── actions and forms ── */
async function polAction(a, el) {
  switch (a) {
    case 'pol-new': return openModal(() => polForm(null));
    case 'pol-open': S.ui.polOpen = el.dataset.id; return openModal(polDetail);
    case 'pol-edit': { const p = POL.list.find((x) => x.id === el.dataset.id); if (p) return openModal(() => polForm(p)); return; }
    case 'pol-file': { const p = POL.list.find((x) => x.id === el.dataset.id), f = p?.attachments?.[+el.dataset.n]; if (f) return act(() => saveFile(f)); return; }
    case 'pol-toggle': {
      const p = POL.list.find((x) => x.id === el.dataset.id);
      if (!p) return;
      const now = Date.now(), publish = !p.published;
      return act(async () => {
        await patch(`policy/${p.id}`, { published: publish, publishedAt: publish ? (p.publishedAt || now) : null, updatedAt: now });
        await audit(publish ? 'POLICY_PUBLISHED' : 'POLICY_UNPUBLISHED', { policy: p.id });
      }, publish ? 'Policy published' : 'Policy unpublished');
    }
    case 'pol-delete': {
      const p = POL.list.find((x) => x.id === el.dataset.id);
      if (!p) return;
      return confirmBox(`Delete “${p.title}”?`, 'The policy and its attachments are removed for everyone. This cannot be undone.', () => polDelete(p));
    }
  }
}

async function polSubmit(f, form, fd) {
  if (f === 'pol-create' || f === 'pol-save') return polSave(f, form, fd);
}

async function polSave(f, form, fd) {
  const scope = String(fd.get('scope') || '');
  const depts = fd.getAll('depts').map(String), people = fd.getAll('people').map(String);
  if (scope === 'depts' && !depts.length) return toast('Choose at least one department.', 'warn');
  if (scope === 'people' && !people.length) return toast('Choose at least one person.', 'warn');
  if (scope === 'company' && !polCanCompany()) return toast('Only HR or an administrator can publish a company-wide policy.', 'warn');
  const audience = scope === 'company' ? { scope } : scope === 'depts' ? { scope, depts } : { scope, people };
  const old = f === 'pol-save' ? POL.list.find((x) => x.id === form.dataset.id) : null;
  const dropped = fd.getAll('drop').map(String);
  const files = fd.getAll('files').filter((x) => x && x.size);
  const kept = (old?.attachments || []).filter((x) => !dropped.includes(x.fid));
  if (kept.length + files.length > POL_MAX_FILES) return toast(`Attach up to ${POL_MAX_FILES} files.`, 'warn');
  for (const file of files) {
    if (file.size > POL_MAX_BYTES) return toast(`${file.name} is larger than 6 MB.`, 'warn');
    if (!CHUNK_TYPES.includes(extOf(file.name))) return toast(`${file.name}: that file type can’t be attached.`, 'warn');
  }
  const publish = fd.get('publish') === 'on', id = old ? old.id : newId();
  return act(async () => {
    try {
      const added = [];
      for (const file of files) {
        const { fid, chunks } = await putChunked(new Uint8Array(await file.arrayBuffer()), file.name, 'policyfile');
        added.push({ fid, chunks, name: file.name, size: file.size, ext: extOf(file.name), mime: ASSET_TYPES[extOf(file.name)] || '', store: 'policyfile' });
      }
      const now = Date.now();
      const data = { title: String(fd.get('title') || '').trim(), content: String(fd.get('content') || '').trim(), category: String(fd.get('category') || ''), audience, published: publish, publishedAt: publish ? (old?.publishedAt || now) : null, attachments: [...kept, ...added], updatedAt: now };
      if (old) await patch(`policy/${id}`, data);
      else await put(`policy/${id}`, { ...data, createdBy: S.me.id, createdAt: now });
      await audit(publish && !old?.published ? 'POLICY_PUBLISHED' : 'POLICY_SAVED', { policy: id });
      closeModal();
    } finally { CHAT.uploading = null; schedule(); }
  }, publish ? 'Policy published' : 'Draft saved');
}

async function polDelete(p) {
  await act(async () => {
    for (const f of p.attachments || []) for (let i = 0; i < (f.chunks || 0); i++) await docRef(`policyfile/${f.fid}_${i}`).delete();
    await docRef(`policy/${p.id}`).delete();
    await audit('POLICY_DELETED', { policy: p.id });
    S.ui.polOpen = null;
    closeModal();
  }, 'Policy deleted');
}
</script>

<script>
/* ═════════════ Department dashboard ═════════════
   For department heads (their own departments only) and for Admin, HR and Directors (every department — the access
   they already have elsewhere in the app). Built only from records the app already keeps: employee records,
   check-ins (att), approved leave and WFH / official-duty requests (req), tasks, daily work logs (wlog) and shared
   WFH locations (loc — the server sends these only to Admin, HR and Manager accounts). Nothing is estimated or made
   up: where a record doesn't exist, the dashboard says so. */
const ddDepts = () => (S.me ? cfg().depts.filter((d) => isMgmt() || d.headId === S.me.id) : []);
const canDeptDash = () => ddDepts().length > 0;
// attendance category for the summary and the filter: one per person per day, so nobody is counted twice
const DD_CAT = {
  present: ['Present', 't-ok'], wfh: ['WFH / official duty', 't-info'], half: ['Half day', 't-warn'], leave: ['On leave', 't-vio'],
  notin: ['Not checked in', 't-warn'], absent: ['Absent', 't-bad'], off: ['Weekly off / holiday', ''], pending: ['Machine data pending', ''], none: ['—', ''],
};
function ddCat(s, rem) {
  if (s.code === 'LV') return 'leave';
  if (rem && !['WO', 'H'].includes(s.code)) return 'wfh';
  return { P: 'present', L: 'present', I: 'present', HD: 'half', NI: 'notin', A: 'absent', WO: 'off', H: 'off', PS: 'pending' }[s.code] || 'none';
}
const DD_TASK_FILTERS = [['', 'Any task status'], ['IN_PROGRESS', 'Has work in progress'], ['BLOCKED', 'Has blocked work'], ['IN_REVIEW', 'Has work in review'], ['TODO', 'Has work to do'], ['OVERDUE', 'Has overdue work'], ['NONE', 'No open tasks']];
const DD_WL_DAYS = 62, DD_LOC_DAYS = 40; // how far back the app loads work logs and locations (part7 subscriptions)

function ddDept() {
  const list = ddDepts(), want = ui('ddDept', '');
  return list.find((d) => d.id === want) || list.find((d) => d.id === S.me.deptId) || list[0] || null;
}
// one person's day: attendance, WFH, location sharing (only when this viewer may see it), tasks and work log
function ddRow(e, d) {
  const s = dayStatus(e, d), rem = remoteOn(e.id, d), cat = ddCat(s, rem);
  const mine = S.tasks.filter((t) => t.assigneeId === e.id && t.status !== 'CANCELLED');
  const open = mine.filter(openTask).sort(taskSort);
  const doneOn = mine.filter((t) => t.status === 'DONE' && t.completedAt && ymd(new Date(t.completedAt)) === d);
  const wl = S.wlogs.find((w) => w.empId === e.id && w.date === d) || null;
  const canLoc = seesLocOf(e.id), loc = canLoc ? locOf(e.id, d) || null : null; // the server only sends locations to Admin, HR and Manager accounts
  return { e, d, s, rem, cat, mine, open, doneOn, wl, canLoc, loc,
    inProg: open.filter((t) => t.status === 'IN_PROGRESS'), blocked: open.filter((t) => t.status === 'BLOCKED'),
    review: open.filter((t) => t.status === 'IN_REVIEW'), todo: open.filter((t) => t.status === 'TODO'), late: open.filter((t) => overdue(t)),
    next: open.filter((t) => t.due).sort((a, b) => a.due.localeCompare(b.due))[0] || null };
}
const ddProgress = (t) => { const cl = t.checklist || []; return cl.length ? `${cl.filter((c) => c.d).length}/${cl.length} steps` : ''; };
function ddTaskMatch(r, f) {
  if (!f) return true;
  if (f === 'NONE') return !r.open.length;
  if (f === 'OVERDUE') return r.late.length > 0;
  return r.open.some((t) => t.status === f);
}
function ddRows(dept, d) {
  const empF = ui('ddEmp', ''), catF = ui('ddCat', ''), taskF = ui('ddTask', '');
  return active().filter((e) => e.deptId === dept.id).sort((a, b) => a.name.localeCompare(b.name)).map((e) => ddRow(e, d))
    .filter((r) => (!empF || r.e.id === empF) && (!catF || r.cat === catF) && ddTaskMatch(r, taskF));
}
function ddLocCell(r) {
  if (!r.rem) return '';
  if (!r.canLoc) return '<div class="tiny muted">Location: only Admin, HR and Manager accounts can see it</div>';
  if (daysBetween(r.d, today()) > DD_LOC_DAYS) return '<div class="tiny muted">Location: not loaded for dates this old</div>';
  const st = wfhState(r.loc), p = lastPing(r.loc);
  const txt = { live: 'Sharing live', outdated: 'Live, but outdated', stopped: 'Stopped sharing', once: 'Shared once', none: 'No location shared' }[st];
  return `<div class="tiny ${st === 'live' ? '' : 'muted'}" style="${st === 'live' ? 'color:var(--ok)' : st === 'outdated' ? 'color:var(--warn)' : ''}">${txt}${p ? ` · ${hm(p.t)}` : ''}${p ? ` <button class="btn sm ghost" data-a="loc-view" data-e="${r.e.id}" data-d="${r.d}" style="padding:0 4px">View</button>` : ''}</div>`;
}
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

function vDeptDash() {
  if (!canDeptDash()) return shell(empty('This dashboard is for department heads, Admin, HR and Directors.'), 'Department dashboard');
  const dept = ddDept(), T = today();
  let d = ui('ddDate', T); if (d > T) d = T;
  const minD = `${+T.slice(0, 4) - 1}-01-01`; if (d < minD) d = minD;
  const all = active().filter((e) => e.deptId === dept.id).sort((a, b) => a.name.localeCompare(b.name)).map((e) => ddRow(e, d));
  const rows = ddRows(dept, d);
  const n = (c) => all.filter((r) => r.cat === c).length;
  const pending = all.reduce((s, r) => s + r.open.length, 0), late = all.reduce((s, r) => s + r.late.length, 0), done = all.reduce((s, r) => s + r.doneOn.length, 0);
  const kpis = [['Present', n('present'), 'ok', 'present'], ['WFH / official duty', n('wfh'), '', 'wfh'], ['On leave', n('leave'), '', 'leave'], ['Half day', n('half'), n('half') ? 'warn' : '', 'half'],
    [d === T ? 'Not checked in' : 'Absent', d === T ? n('notin') : n('absent'), (d === T ? n('notin') : n('absent')) ? 'warn' : '', d === T ? 'notin' : 'absent'],
    ...(d === T && n('absent') ? [['Absent', n('absent'), 'bad', 'absent']] : []),
    ['Pending tasks', pending, '', ''], ['Overdue', late, late ? 'bad' : '', ''], [`Completed ${d === T ? 'today' : 'that day'}`, done, 'ok', '']];
  const multi = ddDepts().length > 1;
  const notes = [];
  if (daysBetween(d, T) > DD_WL_DAYS) notes.push(`Work logs older than ${DD_WL_DAYS} days aren’t loaded, so work-log columns are empty for this date.`);
  if (daysBetween(d, T) > DD_LOC_DAYS) notes.push(`Shared locations older than ${DD_LOC_DAYS} days aren’t loaded.`);
  if (d !== T) notes.push('Tasks show their current status — the app doesn’t keep a day-by-day history of task status. “Completed that day” uses each task’s completion date.');
  const head = dept.headId ? nameOf(dept.headId) : 'no head set';
  const empOpts = all.map((r) => [r.e.id, r.e.name]);
  const working = (r) => {
    const ip = r.inProg.slice(0, 2).map((t) => `<div class="small trunc" title="${esc(t.title)}">${esc(t.code)} · ${esc(t.title)}</div>`).join('');
    const wl = r.wl ? (r.wl.tasks || []).filter((x) => x.st === 'W' || x.st === 'C').length : 0;
    return ip || (r.wl ? `<div class="tiny muted">Work log: ${wl} task(s) worked on</div>` : '<span class="tiny muted">Nothing in progress</span>');
  };
  const taskCell = (r) => `<div class="small"><b>${r.open.length}</b> open${r.late.length ? ` · <span style="color:var(--bad);font-weight:600">${r.late.length} overdue</span>` : ''}${r.blocked.length ? ` · <span style="color:var(--bad)">${r.blocked.length} blocked</span>` : ''}</div>
    <div class="tiny muted">${r.doneOn.length ? `${r.doneOn.length} completed ${d === T ? 'today' : 'that day'} · ` : ''}${r.next ? `next due ${fmtD(r.next.due)}` : 'no deadlines'}</div>`;
  const attCell = (r) => `${r.s.code ? stPill(r.s.code, r.s.note) : ''}${r.cat === 'wfh' && r.s.code !== 'WFH' && r.s.code !== 'OD' ? ` <span class="pill t-info">${r.rem.data.kind === 'OD' ? 'OD' : 'WFH'}</span>` : ''}${r.s.lateMin ? `<div class="tiny" style="color:var(--warn)">${r.s.lateMin} min late</div>` : ''}${ddLocCell(r)}`;
  const body = `
    <div class="filters dd-filters">
      ${multi ? `<select class="i" id="dd-dept" data-c="ddDept" aria-label="Department">${opts(ddDepts().map((x) => [x.id, x.name]), dept.id)}</select>` : ''}
      <input type="date" class="i" id="dd-date" data-c="ddDate" value="${d}" max="${T}" min="${minD}" aria-label="Date">
      <select class="i" id="dd-emp" data-c="ddEmp" aria-label="Employee">${opts(empOpts, ui('ddEmp', ''), 'All employees')}</select>
      <select class="i" id="dd-cat" data-c="ddCat" aria-label="Attendance status">${opts(Object.entries(DD_CAT).filter(([k]) => k !== 'none').map(([k, v]) => [k, v[0]]), ui('ddCat', ''), 'Any attendance')}</select>
      <select class="i" id="dd-task" data-c="ddTask" aria-label="Task status">${opts(DD_TASK_FILTERS.slice(1), ui('ddTask', ''), DD_TASK_FILTERS[0][1])}</select>
      ${ui('ddEmp', '') || ui('ddCat', '') || ui('ddTask', '') ? '<button class="btn ghost" data-a="dd-clear">Clear filters</button>' : ''}
    </div>
    <div class="kstrip dd-kpis">${kpis.map(([l, v, c, k]) => `<button class="kt" ${k ? `data-a="ui" data-k="ddCat" data-v="${k}" title="Show only: ${esc(l)}"` : 'style="cursor:default"'}><span class="l">${esc(l)}</span><span class="v ${c}">${v}</span></button>`).join('')}</div>
    ${card(`${esc(dept.name)} · ${DAYS[dow(d)]} ${fmtD(d)} · ${all.length} people · head: ${esc(head)}`, rows.length ? `<div class="tbl-wrap"><table class="t dd-t"><thead><tr><th>Employee</th><th>Attendance</th><th>In</th><th>Out</th><th>Working on</th><th>Tasks</th><th>Work log</th></tr></thead><tbody>
      ${rows.map((r) => `<tr class="click" data-a="dd-emp" data-e="${r.e.id}" data-d="${d}"><td>${person(r.e.id, esc(r.e.designation || ''))}</td>
        <td>${attCell(r)}</td><td class="small">${r.s.inT ? hm(r.s.inT) : '—'}</td><td class="small">${r.s.outT ? hm(r.s.outT) : '—'}</td>
        <td style="max-width:240px">${working(r)}</td><td>${taskCell(r)}</td>
        <td class="small">${r.wl ? `<span style="color:var(--ok)">Submitted ${hm(r.wl.at)}</span>${r.wl.blockers ? '<div class="tiny" style="color:var(--bad)">Has blockers</div>' : ''}` : '<span class="muted">Not submitted</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : empty(all.length ? 'Nobody matches these filters.' : 'No active employees in this department.'), { list: true })}
    ${notes.length ? `<p class="tiny muted">${notes.join(' ')}</p>` : ''}
    <p class="tiny muted">Attendance comes from check-ins, approved leave and approved WFH / official-duty requests. “Working on” is the person’s tasks marked In progress, or what they logged in their daily work log. Click a person for all their tasks and the day’s work log.</p>`;
  return shell(body, 'Department dashboard', multi ? 'Your departments — attendance and work, from the app’s own records' : `${esc(dept.name)} — attendance and work, from the app’s own records`);
}

function ddEmpModal(empId, d) {
  const e = empById(empId);
  // only people in a department this viewer may see
  if (!e || !ddDepts().some((x) => x.id === e.deptId)) return `${mhead('Not available')}<div class="body">${empty('This person isn’t in a department you manage.')}</div><footer><button class="btn" data-a="close">Close</button></footer>`;
  const r = ddRow(e, d), T = today();
  const tl = (list) => list.map((t) => `<li style="display:block"><div class="row" style="justify-content:space-between;gap:8px"><span class="grow" style="min-width:0"><b class="small">${esc(t.code)}</b> <span class="small">${esc(t.title)}</span></span><span class="row" style="gap:4px">${overdue(t) ? '<span class="pill t-bad">Overdue</span>' : ''}<span class="pill ${TSTAT[effStatus(t)]?.[1] || ''}">${TSTAT[effStatus(t)]?.[0] || esc(t.status)}</span></span></div>
    <div class="tiny muted">${PRIO[t.priority]?.[0] || ''}${t.due ? ` · due ${fmtD(t.due)}` : ''}${ddProgress(t) ? ` · ${ddProgress(t)}` : ''}${t.hours ? ` · ${t.hours} h logged` : ''}${t.status === 'BLOCKED' && t.blockedReason ? ` · blocked: ${esc(t.blockedReason)}` : ''}${t.status === 'DONE' && t.completedAt ? ` · completed ${fmtD(ymd(new Date(t.completedAt)))}` : ''}</div></li>`).join('');
  const recentDone = r.mine.filter((t) => t.status === 'DONE').sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)).slice(0, 5);
  const wl = r.wl;
  const lines = (s) => esc(s || '').split('\n').filter(Boolean).map((x) => `<div class="small">${x}</div>`).join('') || '<div class="small muted">—</div>';
  return `${mhead(esc(e.name), `${esc(e.designation || '')}${e.code ? ` · ${esc(e.code)}` : ''} · ${DAYS[dow(d)]} ${fmtD(d)}`)}
  <div class="body grid" style="gap:14px">
    <div class="row" style="gap:10px;flex-wrap:wrap">${r.s.code ? stPill(r.s.code, r.s.note) : ''}${r.rem ? `<span class="pill t-info">${r.rem.data.kind === 'OD' ? 'Official duty' : 'Work from home'}</span>` : ''}
      <span class="small">In ${r.s.inT ? hm(r.s.inT) : '—'} · Out ${r.s.outT ? hm(r.s.outT) : '—'}${r.s.work ? ` · ${mins(r.s.work)} worked` : ''}${r.s.lateMin ? ` · ${r.s.lateMin} min late` : ''}</span></div>
    ${r.s.punches?.length > 2 ? `<div class="tiny muted">All check-ins: ${r.s.punches.map((p) => hm(p.t)).join(', ')}</div>` : ''}
    ${r.rem ? `<div>${ddLocCell(r) || '<div class="tiny muted">Location: not loaded for this date</div>'}</div>` : ''}
    <div><h3 class="sec-l" style="margin:0 0 6px">Open tasks (${r.open.length})</h3>${r.open.length ? `<ul class="list">${tl(r.open)}</ul>` : '<p class="small muted" style="margin:0">No open tasks.</p>'}</div>
    ${recentDone.length ? `<div><h3 class="sec-l" style="margin:0 0 6px">Recently completed</h3><ul class="list">${tl(recentDone)}</ul></div>` : ''}
    <div><h3 class="sec-l" style="margin:0 0 6px">Work log · ${fmtD(d)}</h3>${wl ? `<div class="grid" style="gap:6px"><div><b class="tiny">Done</b>${lines(wl.done)}</div><div><b class="tiny">Pending</b>${lines(wl.pending)}</div>${wl.blockers ? `<div><b class="tiny" style="color:var(--bad)">Blockers</b>${lines(wl.blockers)}</div>` : ''}${wl.tomorrow ? `<div><b class="tiny">Next</b>${lines(wl.tomorrow)}</div>` : ''}<div class="tiny muted">Submitted ${fmtDT(wl.at)}${wl.review ? ` · reviewed: ${esc(wl.review)}` : ''}</div></div>`
      : `<p class="small muted" style="margin:0">${daysBetween(d, T) > DD_WL_DAYS ? 'Work logs this old aren’t loaded.' : 'No work log submitted for this day.'}</p>`}</div>
  </div><footer><button class="btn" data-a="close">Close</button>${canView('tasks') ? `<button class="btn" data-a="dd-tasks" data-e="${e.id}">Open in Tasks</button>` : ''}</footer>`;
}

async function ddAction(a, el) {
  switch (a) {
    case 'dd-emp': return openModal(() => ddEmpModal(el.dataset.e, el.dataset.d));
    case 'dd-clear': Object.assign(S.ui, { ddEmp: '', ddCat: '', ddTask: '' }); return schedule();
    case 'dd-open': S.ui.ddDept = el.dataset.d; Object.assign(S.ui, { ddEmp: '', ddCat: '', ddTask: '' }); return setView('deptdash');
    case 'dd-tasks': { closeModal(); Object.assign(S.ui, { tScope: isMgmt() ? 'all' : 'team', tView: 'list', tStatus: 'OPEN', tQ: '', tWho: el.dataset.e }); return setView('tasks'); }
  }
}

<script>
/* ═════════════ Render loop ═════════════ */
const VIEW_FN = { dashboard: vDashboard, policies: vPolicies, chats: vChats2, attendance: vAttendance, wfhlive: vWfhLive, leave: vLeave, tasks: vTasks, worklog: vWorklog, approvals: vApprovals, claims: vClaims, complaints: vComplaints, deptdash: vDeptDash, departments: vDepartments, people: vPeople, reports: vReports, settings: vSettings };
let raf = 0, viewChanged = true;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function morph(root, html, fresh = false) {
  const keep = {};
  if (!fresh) root.querySelectorAll('input[id],select[id],textarea[id]').forEach((el) => {
    if (el.type === 'file' || el.type === 'hidden' || el.dataset.c || el.dataset.i) return;
    const dirty = el.type === 'checkbox' || el.type === 'radio' ? el.checked !== el.defaultChecked : el.tagName === 'SELECT' ? [...el.options].some((o) => o.selected !== o.defaultSelected) : el.value !== el.defaultValue;
    if (dirty) keep[el.id] = el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value;
  });
  const ae = document.activeElement, aid = !fresh && root.contains(ae) ? ae.id : null;
  let sel = null; try { sel = aid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null; } catch { sel = null; }
  const scroll = root.querySelector('.overlay')?.scrollTop;
  root.innerHTML = html;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el && root.contains(el)) { if (el.type === 'checkbox' || el.type === 'radio') el.checked = v; else el.value = v; } }
  if (aid) { const el = document.getElementById(aid); if (el && root.contains(el)) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(...sel); } catch { /* not a text field */ } } }
  if (scroll) { const o = root.querySelector('.overlay'); if (o) o.scrollTop = scroll; }
}
function render() {
  if (!S.db) return;
  if (!NEED.every((k) => S.loaded.has(k))) return;
  identify();
  if (S.me && !VIEWS.find((v) => v[0] === S.view && v[2]())) S.view = 'dashboard';
  const prevChatScroll = viewChanged ? null : document.getElementById('chat-msgs')?.scrollTop;
  const authed = S.me ? isAuthed() : false;
  if (S.me && authed !== true && S.authWas !== authed) viewChanged = true;
  S.authWas = authed;
  const html = !S.me ? vSetup() : authed === true ? VIEW_FN[S.view]() : vLogin();

  subscribe('dreq', db.collection('dreq'), (q) => { S.dreqs = docsOf(q); });
  subscribe('tpl', db.collection('tpl'), (q) => { S.tpls = docsOf(q); });
  subscribe('att', db.collection('att').where('year', 'in', [Y - 1, Y]), (q) => { const m = {}; for (const d of q.docs) m[d.id] = { id: d.id, ...d.data() }; S.att = m; });
  chatSubscribe();
  subscribe('loc', db.collection('loc').where('date', '>=', addDays(today(), -40)), (q) => { S.locs = docsOf(q); });
  subscribe('wlog', db.collection('wlog').where('date', '>=', addDays(today(), -62)), (q) => { S.wlogs = docsOf(q); });
})();
</script>
