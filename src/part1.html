<title>OfficeHub Aminorich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (desktop) / scrolling top tab strip (phone) + one working pane; modals for forms and record detail. */
:root{

  --accent:#0d6b57; --accent-soft:#dcefe8; --accent-ink:#ffffff; --gold:#a8730b;
  --ok:#1d7a46; --ok-soft:#e1f2e7; --warn:#a86207; --warn-soft:#fbefd9; --bad:#b4232c; --bad-soft:#fbe4e4; --info:#1f5f9e; --info-soft:#e2edf8; --vio:#6b3fa0; --vio-soft:#efe7f8;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06);
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif; --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail:#0f3b31; --rail-ink:#e6f1ec; --rail-muted:#9dbcb1; --rail-hi:rgba(255,255,255,.09); --rail-act:#7ad8b5; --topbar:rgba(243,245,242,.86);
  --c-teal:#0f8a74; --c-sky:#1b86c7; --c-blue:#2f62d0; --c-violet:#7a4cc4; --c-amber:#c77d0a; --c-leaf:#3f8f2b; --c-coral:#d2513a; --c-gold:#b48712; --c-indigo:#4a55b8; --c-rose:#c43f73; --c-cyan:#0f8fa0; --c-slate:#56677a;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --sunk:#1c2622; --ink:#e3ebe6; --muted:#97a8a0; --line:#2a3631;
  --accent:#3fb894; --accent-soft:#183a30; --accent-ink:#06231a; --gold:#e0a93b;
  --ok:#5cc98a; --ok-soft:#163223; --warn:#e5a54a; --warn-soft:#352812; --bad:#f07a80; --bad-soft:#3a1a1d; --info:#79b2ee; --info-soft:#17283b; --vio:#bb98e6; --vio-soft:#2a2038;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --rail:#0b1311; --rail-ink:#dfe9e4; --rail-muted:#8aa198; --rail-hi:rgba(255,255,255,.06); --rail-act:#5fcca4; --topbar:rgba(15,21,19,.86); --c-teal:#3cc7a7; --c-sky:#5ab7ee; --c-blue:#7a9ef0; --c-violet:#b493ee; --c-amber:#f0b44e; --c-leaf:#86cf6a; --c-coral:#f2876f; --c-gold:#e6c15a; --c-indigo:#9aa2f2; --c-rose:#f08bb1; --c-cyan:#5ccfdc; --c-slate:#9fb0c2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --sunk:#1c2622; --ink:#e3ebe6; --muted:#97a8a0; --line:#2a3631;
  --accent:#3fb894; --accent-soft:#183a30; --accent-ink:#06231a; --gold:#e0a93b;
  --ok:#5cc98a; --ok-soft:#163223; --warn:#e5a54a; --warn-soft:#352812; --bad:#f07a80; --bad-soft:#3a1a1d; --info:#79b2ee; --info-soft:#17283b; --vio:#bb98e6; --vio-soft:#2a2038;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --rail:#0b1311; --rail-ink:#dfe9e4; --rail-muted:#8aa198; --rail-hi:rgba(255,255,255,.06); --rail-act:#5fcca4; --topbar:rgba(15,21,19,.86); --c-teal:#3cc7a7; --c-sky:#5ab7ee; --c-blue:#7a9ef0; --c-violet:#b493ee; --c-amber:#f0b44e; --c-leaf:#86cf6a; --c-coral:#f2876f; --c-gold:#e6c15a; --c-indigo:#9aa2f2; --c-rose:#f08bb1; --c-cyan:#5ccfdc; --c-slate:#9fb0c2; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.02rem;font-weight:600} h3{font-size:.95rem;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)} .small{font-size:.82rem} .tiny{font-size:.74rem}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 15px var(--f-display)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);width:100%}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ct{margin-left:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;font-weight:600}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;gap:10px;align-items:center}
.main{min-width:0;padding-block:20px 48px;padding-inline:clamp(16px,3vw,32px)}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.body{padding:14px 16px}
.card>.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;min-width:0}
.list>li:last-child{border-bottom:0}
.list>li .grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:9px 11px;border:0;text-align:left;cursor:pointer}
.kpi:hover{outline:1px solid var(--line)}
.kpi .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 1.55rem/1.15 var(--f-display)}
.kpi .v.bad{color:var(--bad)} .kpi .v.warn{color:var(--warn)} .kpi .v.ok{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 9px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-vio{background:var(--vio-soft);color:var(--vio)} .t-acc{background:var(--accent-soft);color:var(--accent)}
.pri-CRITICAL{box-shadow:inset 3px 0 0 var(--bad)} .pri-HIGH{box-shadow:inset 3px 0 0 var(--warn)} .pri-MEDIUM{box-shadow:inset 3px 0 0 var(--info)} .pri-LOW{box-shadow:inset 3px 0 0 var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font-size:.92rem}
textarea.i{resize:vertical;min-height:64px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .i{width:auto}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
.t th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--sunk)}
.t td.num,.t th.num{text-align:right}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:.88rem;border:0;width:100%;text-align:left;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 11px var(--f-body);flex:none}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:10px;padding:8px;min-height:120px}
.col h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;padding:2px 4px 8px}
.col.over{outline:2px dashed var(--accent)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:grab;font-size:.88rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:.7rem;text-transform:uppercase;color:var(--muted);text-align:center;letter-spacing:.06em}
.cal .dc{min-height:62px;border-radius:7px;padding:5px 6px;font-size:.74rem;background:var(--surface);border:1px solid var(--line)}
.cal .dc b{font-size:.8rem}
.reg{border-collapse:collapse;font-size:.72rem}
.reg th,.reg td{padding:2px;text-align:center;border-bottom:1px solid var(--line)}
.reg td.n{text-align:left;white-space:nowrap;padding-right:10px;position:sticky;left:0;background:var(--surface)}
.code{display:inline-block;min-width:24px;border-radius:4px;padding:1px 2px;font-weight:600}
.c-P{background:var(--ok-soft);color:var(--ok)} .c-L{background:var(--warn-soft);color:var(--warn)} .c-A{background:var(--bad-soft);color:var(--bad)} .c-HD,.c-I{background:var(--warn-soft);color:var(--warn)} .c-LV{background:var(--vio-soft);color:var(--vio)} .c-WFH,.c-OD{background:var(--info-soft);color:var(--info)} .c-WO,.c-H,.c-PS,.c-NI{background:var(--sunk);color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:start center;padding:5vh 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);box-shadow:var(--shadow);border:1px solid var(--line)}
.modal>header{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal>.body,.modal>form>.body{padding:16px 18px}
.modal>footer,.modal>form>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:.9rem;max-width:min(420px,calc(100% - 32px))}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 8px;font-size:.88rem}
.timeline li::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.timeline li.APPROVED::before{background:var(--ok)} .timeline li.PENDING::before{background:var(--warn)} .timeline li.REJECTED::before{background:var(--bad)} .timeline li.RETURNED::before{background:var(--gold)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;font-size:.88rem}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}
.kv span:first-child{color:var(--muted)}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:.66rem;padding:0 5px;font-weight:700}
.splash{max-width:560px;margin:10vh auto;padding:0 16px}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.ppl{position:relative}.ppl .menu{position:absolute;z-index:5;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow:auto}
.ppl .menu button{display:flex;width:100%;gap:8px;align-items:center;padding:7px 10px;border:0;background:none;text-align:left;cursor:pointer}.ppl .menu button:hover{background:var(--sunk)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;z-index:20;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand,.me{display:none}
  .nav{width:auto;white-space:nowrap;padding:7px 10px}
  .g2,.g3,.g4{grid-template-columns:1fr} .span2{grid-column:auto}
  .fgrid,.kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}}}

/* ── interface refresh: pine rail with icons, sticky top bar, phone tab bar ── */
body{font-size:14.5px}
.ico{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell{grid-template-columns:244px 1fr}
.rail{background:var(--rail);color:var(--rail-ink);border-right:0;padding:16px 12px 14px;gap:2px}
.rail .brand{padding:4px 8px 18px}
.rail .brand small{color:var(--rail-muted)}
.rail .mark{background:var(--rail-act);color:var(--rail);border-radius:10px;font-size:13px;letter-spacing:.02em}
.nav-g{font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--rail-muted);padding:14px 10px 6px;font-weight:600}
.rail .nav{color:var(--rail-ink);opacity:.86;padding:8px 10px;border-radius:9px;position:relative;font-size:.92rem}
.rail .nav .ico{opacity:.85}
.rail .nav:hover{background:var(--rail-hi);color:var(--rail-ink);opacity:1}
.rail .nav[aria-current="page"]{background:var(--rail-hi);color:#fff;opacity:1;font-weight:600}
.rail .nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--rail-act)}
.rail .nav[aria-current="page"] .ico{color:var(--rail-act);opacity:1}
.ct{margin-left:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 7px;font-weight:700;line-height:1.4}
.ct.ct-acc{background:var(--rail-act);color:var(--rail)}
.rail .me{border-top:1px solid var(--rail-hi);color:var(--rail-ink)}
.rail-muted{color:var(--rail-muted)}
.main{padding-block:0 56px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1 * clamp(16px,3vw,32px)) 18px;padding:16px clamp(16px,3vw,32px) 14px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.45rem;letter-spacing:-.015em}
.tb-actions{gap:8px}
.btn{min-height:36px;border-radius:9px;transition:border-color .12s,background .12s,box-shadow .12s}
.btn.sm{min-height:28px;border-radius:7px}
.btn.pri{box-shadow:0 1px 0 rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12)}
.btn .ico{width:17px;height:17px}
.card{border-color:color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 1px 2px rgba(20,40,30,.04)}
.card>header h2{font-size:.98rem}
.t th{position:sticky;top:0;z-index:1}
.t tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.tabs{gap:2px}
.tab{border-radius:8px 8px 0 0;font-weight:500}
.tab:hover{color:var(--ink)}
input.i,select.i,textarea.i{min-height:38px;border-radius:9px}
.modal{border-radius:16px}
.overlay{backdrop-filter:blur(2px)}
.tabbar,.sheet,.sheet-bg{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
  .topbar{padding-top:12px;padding-bottom:10px}
  .topbar h1{font-size:1.2rem}
  .tb-actions .btn:not(.bell):not(.pri):not(.searchbtn){display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.68rem;padding:5px 2px;border-radius:10px;position:relative;cursor:pointer}
  .tb[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
  .tb .ct{position:absolute;top:0;right:calc(50% - 22px);margin:0}

  .sheet{display:block;position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px 12px;max-height:70vh;overflow:auto;box-shadow:var(--shadow)}
  .sheet .nav-g{color:var(--muted);padding:12px 2px 6px}

  .sg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:.8rem;position:relative;cursor:pointer}
  .sg[aria-current="page"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

@media (prefers-reduced-motion:no-preference){.sheet{animation:sheetup .18s ease-out}@keyframes sheetup{from{transform:translateY(16px);opacity:.6}}}

/* ── colour: each section has its own hue (--sec), the rail icons carry theirs, tiles and segments are tinted ── */
